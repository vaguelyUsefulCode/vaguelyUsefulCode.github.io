      renderUniqueItemsTable();
    });
  });
}

// What a Bunker Buck is worth in money right now: the most any cache returns
// per Buck. Zero until the cache prices have been read.
function bunkerBuckValue() {
  let best = 0;
  for (const [id, cost] of Object.entries(BUNKER_CACHE_COST)) {
    const mv = state.itemMarketValueCache.get(Number(id));
    if (Number.isFinite(mv) && mv > 0 && cost > 0) best = Math.max(best, mv / cost);
  }
  return best;
}

function bunkerBucksFor(item) {
  const catalogItem = state.itemsById.get(Number(item?.itemId));
  if (!catalogItem) return null;

  const type = String(val(catalogItem.type, catalogItem.category) ?? "").toLowerCase().trim();
  const sub = String(val(catalogItem.sub_type, catalogItem.subtype) ?? "").toLowerCase().trim();
  const rates = BUNKER_RATES[["armor", "armour"].includes(type) ? "armor" : sub];
  if (!rates) return null;

  const rarity = String(item?.rarity ?? "").toLowerCase();
  const twoEffects = [item?.bonus1, item?.bonus2].filter(Boolean).length >= 2;

  if (rarity === "yellow") return rates.yellow;
  if (rarity === "orange") return (twoEffects && rates.orange2) || rates.orange;
  if (rarity === "red") return (twoEffects && rates.red2) || rates.red;
  return null;
}

// The floor under an unsold weapon: what the bunker would pay for it.
function bunkerValue(item) {
  const bucks = bunkerBucksFor(item);
  const rate = bunkerBuckValue();
  return bucks && rate ? Math.round(bucks * rate) : null;
}

// Profit if an unsold weapon were exchanged today.
function unrealisedProfit(item) {
  const value = bunkerValue(item);
  if (value === null) return null;
  const cost = (item?.externalLogs || item?.logs || [])[0]?.price;
  return hasPrice(cost) ? value - Number(cost) : value;
}

// The log for a bunker sell has never been seen on this account, so the Bucks
// are read from whichever field carries them if one is there, and otherwise
// derived from the published rate for that weapon - which is deterministic.
function bunkerBucksFromLog(row) {
  const data = row?.raw?.data || {};
  const stated = val(data.bucks, data.bunker_bucks, data.bunkerBucks);
  const n = Number(stated);
  if (Number.isFinite(n) && n > 0) return n;
  return bunkerBucksFor(row);
}

// Today's cache market value is a stand-in until the caches those Bucks bought
// are seen to sell; the row says which of the two it is showing.
function priceBunkerSellRows(rows) {
  const rate = bunkerBuckValue();
  for (const row of rows) {
    const bucks = bunkerBucksFromLog(row);
    row.bunkerBucks = bucks ?? null;
    if (bucks && rate) {
      row.price = Math.round(bucks * rate);
      row.bunkerEstimated = true;
    }
  }
}

function isListedOnMarket(uid) {
  if (uid === null || uid === undefined) return false;
  return state.marketRows.some(r => String(r.uid) === String(uid));
}

function hasPrice(value) {
  return value !== null && value !== undefined && value !== "" &&
    Number.isFinite(Number(value));
}

// Item Sent carries a price only when it was really a sale. A hand-entered 0 is
// a price like any other - it says "this went out as a sale, for nothing".
function sentAsSale(entry) {
  return entry?.sourceKey === "itemsSent" && hasPrice(entry?.price);
}

// The state the transactions alone imply, before any hand-marking. Kept
// separate so the UI can tell "already returned per the logs" from "returned
// because a person said so".
function itemLogState(item) {
  // Moving a weapon between the shared accounts says nothing about where it
  // stands, so the state comes from the last transaction with an outsider.
  const logs = item.externalLogs || item.logs || [];
  const last = logs[logs.length - 1];
  // Already resolved to override, then default, then key holder.
  const owner = { id: item.ownerId, name: item.owner };

  // Someone else's weapon, player or faction alike. Sending it back to them
  // closes the loan.
  if (owner.id && !isKeyHolder(owner.id)) {
    if (RETURN_SOURCES.has(last?.sourceKey) && String(last?.toId ?? "") === String(owner.id)) {
      return "returned";
    }
    return "loanedToUs";
  }

  if (isListedOnMarket(item.uid)) return "listed";
  if (last && (SALE_SOURCES.has(last.sourceKey) || sentAsSale(last))) return "sold";
  if (last?.sourceKey === "factionDeposit") return "loanedToFaction";
  if (last?.sourceKey === "itemsSent") return "loanedOut";
  return "inventory";
}

// A hand-marked return is the last word: the logs cannot show it.
function itemStateKey(item) {
  return itemLogState(item);
}


// UIDs whose earliest recorded event is an Items Received entry.
function uidsFirstSeenAsReceived() {
  const out = new Map();
  for (const item of buildUniqueItemsRows()) {
    const first = (item.logs || [])[0];
    if (first?.sourceKey === "itemsReceived") out.set(String(item.uid), first.timestamp);
  }
  return out;
}

}

function parseEditablePrice(raw) {
  const s = String(raw ?? "").trim().toLowerCase().replace(/,/g, "");
  if (s === "") return null;

  const match = s.match(/^(\d+(?:\.\d+)?)\s*([kmb])?$/i);
  if (!match) return NaN;

  const number = Number(match[1]);
  if (!Number.isFinite(number)) return NaN;

  const multiplier = {
    k: 1_000,
    m: 1_000_000,
    b: 1_000_000_000
  }[match[2]?.toLowerCase()] || 1;

  return Math.round(number * multiplier);
}

function formatEditablePrice(value) {
  if (value === null || value === undefined || value === "") return "";
  const n = Number(value);
  return Number.isFinite(n) ? Math.round(n).toLocaleString() : "";
}

function saveManualPrices() {
  localStorage.setItem("tornManualPrices", JSON.stringify(Object.fromEntries(state.manualPrices)));
}

function setManualPrice(rowKey, rawValue) {
  const parsed = parseEditablePrice(rawValue);

  if (parsed === null) {
    state.manualPrices.delete(rowKey);
  } else if (Number.isFinite(parsed)) {
    state.manualPrices.set(rowKey, parsed);
  } else {
    return false;
  }

  saveManualPrices();

  for (const spec of LOGS) {
    const row = (state.rows[spec.key] || []).find(r => r.rowKey === rowKey);
    if (row) {
      row.price = state.manualPrices.has(rowKey) ? state.manualPrices.get(rowKey) : null;
      break;
    }
  }

  return true;
}


// Two figures the transactions can actually support: what the weapons that
// have gone made, and what the ones still on hand cost to buy. Weapons that
// were never ours count towards neither, and neither do ones with a
// holding still waiting on a decision - their cost or proceeds is not a
// number yet, and counting them as zero would flatter both figures. Both
// follow the filters, so the numbers describe what is on screen.
function inventoryProfit(rows) {
  let realised = 0;
  let unrealised = 0;
  let excluded = 0;


  for (const item of rows) {
    if (!item.ownedByKeyHolder) continue;

    if (item.unresolved) {
      excluded += 1;
      continue;
    }

    if (item.state === "sold") {
      if (hasPrice(item.profit)) realised += Number(item.profit);
      continue;
    }

    // Marked against the bunker, which is the one price every weapon can be
    // held to whether or not anybody wants to buy it.
    const gain = unrealisedProfit(item);
    if (gain !== null) unrealised += gain;
  }

  return { realised, unrealised, excluded };
}

const HISTORY_SUB_COLS = [
  ["type", "Transaction"],
  ["timestamp", "Date"],
  ["price", "Price"],
  ["from", "From"],
  ["to", "To"]
];
const HISTORY_NUMERIC_PROPS = new Set(["timestamp", "price"]);

// "log2.price" addresses the third visible entry on the row; "firstLog.type"
// and "outcome.type" address the ends of its history regardless of what is on
// screen.
function historyFieldParts(field) {
  const name = String(field ?? "");
  const semantic = /^(firstLog|outcome)\.(\w+)$/.exec(name);
  if (semantic) {
    return { which: semantic[1] === "firstLog" ? "first" : "outcome", prop: semantic[2] };
  }
  const positional = /^log(\d+)\.(\w+)$/.exec(name);
  return positional ? { index: Number(positional[1]), prop: positional[2] } : null;
}

function historyFieldEntry(row, parts) {
  if (!parts) return null;
  return parts.which
    ? semanticLogEntry(row, parts.which)
    : (visibleItemLogs(row)[parts.index] || null);
}

function transactionSortValue(row, field) {
  const parts = historyFieldParts(field);
  if (parts) {
    const entry = historyFieldEntry(row, parts);
    return entry ? (entry[parts.prop] ?? null) : null;
  }
  return row[field] ?? null;
}

function transactionFieldValue(row, field) {
  if (field === "rarity") return formatRarity(row.rarity);

  const parts = historyFieldParts(field);
  if (parts) {
    const entry = historyFieldEntry(row, parts);
    if (!entry) return "";
    if (parts.prop === "timestamp") return entry.timestamp ? formatDate(entry.timestamp) : "";
    if (parts.prop === "price") return hasPrice(entry.price) ? formatMoney(entry.price) : "";
    return entry[parts.prop] ?? "";
  }

  const v = row[field];
  return v === null || v === undefined ? "" : v;
}

function getFilteredTransactionRows(rows, options={}) {
  const skip = options.skip || null;
  const states = activeStateFilter();

  const firstExcluded = excludedLogTypes("firstLog");
  const outcomeExcluded = excludedLogTypes("outcome");

  const filtered = rows.filter(row => {
    if (state.unresolvedOnly && !row.unresolved) return false;
    if (row.state && !states.has(row.state)) return false;

    if (skip !== "firstLog" && firstExcluded.size &&
        firstExcluded.has(logTypeKeyOf(row, "firstLog"))) return false;
    if (skip !== "outcome" && outcomeExcluded.size &&
        outcomeExcluded.has(logTypeKeyOf(row, "outcome"))) return false;

    for (const [field, query] of Object.entries(state.transactionFilters)) {
      if (!query) continue;
      let value = transactionFieldValue(row, field);
      if (field === "profit" && value !== null && value !== undefined && value !== "") {
        value = formatMoney(value);
      }
      if (field === "owner" || field === "rarity") {
        if (String(value ?? "") !== String(query)) return false;
        continue;
      }
      const hay = String(value ?? "").toLowerCase();
      if (!hay.includes(String(query).toLowerCase())) return false;
    }
    return true;
  });

  const { field, dir } = state.transactionSort;
  const parts = historyFieldParts(field);
  const numericFields = new Set([
    "firstLogTimestamp","quality","armor","damage","accuracy",
    "bonus1Value","bonus2Value","profit"
  ]);
  const numeric = numericFields.has(field) ||
    (parts && HISTORY_NUMERIC_PROPS.has(parts.prop));

  return filtered.slice().sort((a, b) => {
    const av = transactionSortValue(a, field);
    const bv = transactionSortValue(b, field);

    let c;
    if (numeric) {
      const an = Number(av), bn = Number(bv);
      const aa = Number.isFinite(an) ? an : -Infinity;
      const bb = Number.isFinite(bn) ? bn : -Infinity;
      c = aa - bb;
    } else {
      c = String(av ?? "").localeCompare(String(bv ?? ""), undefined, {
        numeric: true,
        sensitivity: "base"
      });
    }
    return dir === "asc" ? c : -c;
  });
}

function transactionSortIndicator(field) {
  return state.transactionSort.field === field
    ? `<span class="sort-indicator">${state.transactionSort.dir === "asc" ? "▲" : "▼"}</span>`
    : "";
}

function bindTransactionHistoryControls() {
  document.querySelectorAll("[data-th-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const field = th.dataset.thSort;
      if (state.transactionSort.field === field) {
        state.transactionSort.dir = state.transactionSort.dir === "asc" ? "desc" : "asc";
      } else {
        state.transactionSort.field = field;
        state.transactionSort.dir = "asc";
      }
      renderUniqueItemsTable();
    });
  });

  document.querySelectorAll("[data-th-filter]").forEach(input => {
    input.addEventListener("input", () => {
      const field = input.dataset.thFilter;
      const value = input.value;
      const start = input.selectionStart;
      const end = input.selectionEnd;

      state.transactionFilters[field] = value;
      renderUniqueItemsTable();

      const replacement = document.querySelector(`[data-th-filter="${CSS.escape(field)}"]`);
      if (replacement) {
        replacement.focus();
        try { replacement.setSelectionRange(start, end); } catch (_) {}
      }
    });
  });
}

function bindEditablePrices(root) {
  root.querySelectorAll("[data-price-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.editingPriceRow = btn.dataset.priceEdit;
      render();
    });
  });

  root.querySelectorAll("[data-price-row]").forEach(input => {
    // A field opened by the pencil is removed when Escape re-renders, and a
    // removed field still blurs; without this the discarded value is saved.
    let cancelled = false;
    const fromPencil = state.editingPriceRow === input.dataset.priceRow;

    const commitPrice = () => {
      if (cancelled) return;
      const rowKey = input.dataset.priceRow;
      const previous = state.manualPrices.has(rowKey)
        ? state.manualPrices.get(rowKey)
        : null;

      if (!setManualPrice(rowKey, input.value)) {
        input.value = formatEditablePrice(previous);
        return;
      }

      const current = state.manualPrices.has(rowKey)
        ? state.manualPrices.get(rowKey)
        : null;
      input.value = formatEditablePrice(current);
      state.editingPriceRow = null;
      render();
    };

    input.addEventListener("blur", commitPrice);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        input.blur();
      }
      if (e.key === "Escape" && fromPencil) {
        e.preventDefault();
        cancelled = true;
        state.editingPriceRow = null;
        render();
      }
    });

    if (fromPencil) {
      input.focus();
      input.select();
    }
  });
}

// ---------------------------------------------------------------------------
// RW Inventory table.
//
// Every row of the table - the toggle strip, the band row, the headers, the
// filters and the body - is generated from one column list. Rows cannot
// disagree about how many cells they have, because none of them decides that
// for itself. A folded-away group is absent from the list rather than hidden
// with CSS, so there is no second mechanism to fall out of step.
//
// Widths live on the colgroup and the table is laid out `fixed`, so a control
// inside a cell can never widen its column or spill past it.
// ---------------------------------------------------------------------------

// Acquired and Last Transaction. Always both, whether or not a weapon has two
// transactions to put in them.
const HISTORY_GROUP_COUNT = 2;

const HISTORY_SUB_SPEC = [
  { prop: "type",      label: "Transaction", width: 124 },
  { prop: "timestamp", label: "Date",        width: 152 },
  { prop: "price",     label: "Price",       width: 112 },
  { prop: "from",      label: "From",        width: 94, party: true },
  { prop: "to",        label: "To",          width: 94, party: true }
];

const INVENTORY_FIXED_SPEC = [
  { key: "name",        label: "Item",     width: 258 },
  { key: "owner",       label: "Owner",    width: 152, filter: "owner" },
  { key: "rarity",      label: "Rarity",   width: 86,  filter: "rarity" },
  { key: "quality",     label: "Quality",  width: 66,  group: "stats" },
  { key: "armor",       label: "Armor",    width: 66,  group: "stats" },
  { key: "damage",      label: "DMG",      width: 66,  group: "stats" },
  { key: "accuracy",    label: "ACC",      width: 66,  group: "stats" },
  // One column for both bonuses, stacked; its pair holds both values. The
  // second line only exists on a weapon that has a second bonus, so a row with
  // one bonus is no taller than it ever was.
  { key: "bonus1",      label: "Bonus 1",  width: 124, stack: "bonus2",      stackLabel: "Bonus 2" },
  { key: "bonus1Value", label: "Value",    width: 64,  stack: "bonus2Value", stackLabel: "Value",
    narrow: true },
  { key: "profit",      label: "Profit",   width: 136, filter: null }
];

function inventoryColumns(ctx) {
  const cols = [];

  for (const spec of INVENTORY_FIXED_SPEC) {
    if (spec.group === "stats" && state.hideStatColumns) continue;

    const numeric = STAT_FIELDS.has(spec.key) || spec.narrow;
    cols.push({
      key: spec.key,
      width: spec.width,
      numeric,
      cls: [numeric ? "col-num" : "", spec.narrow ? "col-narrow" : ""].filter(Boolean).join(" "),
      sort: spec.key,
      header: () => {
        if (spec.key === "name") return `${esc(spec.label)}${uidToggleHtml()}`;
        if (spec.stack) {
          return `<span class="stack-line">${esc(spec.label)}</span>` +
            `<span class="stack-line stack-second">${esc(spec.stackLabel)}</span>`;
        }
        return esc(spec.label);
      },
      filter: () => {
        if (spec.filter === null) return "";
        if (spec.stack) {
          return [spec.key, spec.stack].map((field, i) =>
            `<input class="stack-line${i ? " stack-second" : ""}" ` +
            `data-th-filter="${field}" ` +
            `aria-label="Filter by ${escInput(i ? spec.stackLabel : spec.label)}" ` +
            `value="${escInput(state.transactionFilters[field] || "")}">`).join("");
        }
        if (spec.filter === "owner") {
          return `<select data-th-filter="owner" aria-label="Filter by owner">` +
            ownerFilterOptionsHtml(ctx.ownerValues, state.transactionFilters.owner || "") +
            `</select>`;
        }
        if (spec.filter === "rarity") {
          return `<select data-th-filter="rarity" aria-label="Filter by rarity">` +
            rarityFilterOptionsHtml(state.transactionFilters.rarity || "") +
            `</select>`;
        }
        return `<input data-th-filter="${spec.key}" aria-label="Filter by ${escInput(spec.label)}" ` +
          `value="${escInput(state.transactionFilters[spec.key] || "")}">`;
      },
      body: (r) => {
        if (!spec.stack) return inventoryFixedCell(spec.key, r);
        const first = inventoryFixedCell(spec.key, r);
        // No second bonus, no second line: the row keeps its usual height.
        if (!hasSecondBonus(r)) return `<span class="stack-line">${first}</span>`;
        return `<span class="stack-line">${first}</span>` +
          `<span class="stack-line stack-second">${inventoryFixedCell(spec.stack, r)}</span>`;
      }
    });
  }

  for (let g = 0; g < HISTORY_GROUP_COUNT; g++) {
    const bandLabel = g === 0 ? "Acquired" : "Outcome";

    HISTORY_SUB_SPEC.forEach((sub, k) => {
      const sortField = historySortField(g, sub.prop);
      const filterField = `log${g}.${sub.prop}`;
      const slot = sub.prop === "type" ? (g === 0 ? "firstLog" : "outcome") : null;

      cols.push({
        key: `g${g}.${sub.prop}`,
        width: sub.width,
        band: g,
        bandLabel,
        cls: ["history-group", `history-group-${g % 2}`,
              k === 0 ? "history-group-start" : "",
              sub.party ? "history-party" : ""].filter(Boolean).join(" "),
        sort: sortField,
        header: () => esc(sub.label),
        filter: () => slot
          ? logTypeFilterHtml(slot, ctx.facetRows[slot])
          : `<input data-th-filter="${filterField}" ` +
            `aria-label="Filter by ${escInput(sub.label)}" ` +
            `value="${escInput(state.transactionFilters[filterField] || "")}">`,
        body: (r) => historyCell(r, g, sub, ctx)
      });
    });
  }

  return cols;
}

// Group 0's Date keeps firstLogTimestamp so the default sort stays attached to
// a visible header; the Transaction columns at either end address the history
// itself rather than a slot.
function historySortField(g, prop) {
  if (g === 0 && prop === "timestamp") return "firstLogTimestamp";
  if (prop === "type") return g === 0 ? "firstLog.type" : "outcome.type";
  return `log${g}.${prop}`;
}

function hasSecondBonus(r) {
  return r?.bonus2 !== null && r?.bonus2 !== undefined && r?.bonus2 !== "";
}

function inventoryFixedCell(key, r) {
  switch (key) {
    case "name": {
      const returnButton = r.unresolved
        ? `<button type="button" class="inline-action is-unresolved"
            data-item-history="${esc(r.uid)}" data-holding="${esc(r.holdingKey)}"
            title="Something about this holding is undecided - open its history to settle it"
            >Unresolved</button>`
        : "";

      const live = findLiveMarketRow(r.uid);
      const manual = findManualMarketRow(r.uid);
      // Only a weapon that is ours and still here can be offered for sale.
      const addButton = (r.state === "sold" || !r.ownedByKeyHolder)
        ? ""
        : live
        ? `<button type="button" class="add-market" disabled title="Already listed on the item market">Listed</button>`
        : manual
          ? `<button type="button" class="add-market" data-market-drop="${esc(manual.rowKey)}" title="Remove from Currently Selling">&minus; Market</button>`
          : `<button type="button" class="add-market" data-market-add="${esc(r.uid)}" title="Add to Currently Selling">+ Market</button>`;

      return `<button type="button" class="item-history-link" data-item-history="${esc(r.uid)}"
          title="Every transaction this weapon has been through"
          >${esc(r.name)}</button>${addButton}${returnButton}${uidLineHtml(r.uid)}`;
    }
    case "owner":
      return ownerCellHtml(r, { id: r.ownerId, name: r.owner });
    case "rarity":
      return `<span class="${rarityClass(r.rarity).trim()}">${esc(formatRarity(r.rarity))}</span>`;
    case "profit": {
      if (!r.ownedByKeyHolder) return "—";
      if (r.profit !== null && r.profit !== undefined) return esc(formatMoney(r.profit));
      if (!state.showBunkerProfit) return "—";

      // An estimate rather than a realised figure, so it is marked as one.
      const gain = unrealisedProfit(r);
      const bucks = bunkerBucksFor(r);
      return gain === null
        ? "—"
        : `<span class="profit-estimate" title="If exchanged at Big Al's for ${esc(bucks)} BB"` +
          `>~${esc(formatMoney(gain))}</span>`;
    }
    default:
      return esc(r[key]);
  }
}

function historyCell(r, g, sub, ctx) {
  const entry = (ctx.logsByUid.get(String(r.uid)) || [])[g];
  if (!entry) return "—";

  if (sub.prop === "type") {
    // Name on one line, the trade it came from on the next, same size as
    // everything else.
    return entry.hasReceipt
      ? `<span class="tx-name">${esc(entry.type)}</span>` +
        `<button type="button" class="trade-link tx-trade" ` +
        `data-trade-row="${esc(entry.rowKey)}" title="Show the full trade">` +
        `[${esc(entry.tradeId)}]</button>`
      : esc(entry.type);
  }
  if (sub.prop === "timestamp") return esc(formatDate(entry.timestamp));
  if (sub.prop === "price") {
    // Somebody else's weapon only ever passed through on loan, so none of its
    // transactions is a purchase or a sale and none of them has a price -
    // not even one to type in. Naming an owner of ours brings them back.
    if (!r.ownedByKeyHolder) {
      return `<span class="no-price" title="Not owned by a key holder, so this ` +
        `movement is a loan rather than a sale. Set the owner to price it.">—</span>`;
    }

    if (entry.editable) {
      return state.editingPriceRow === entry.rowKey
        ? `<input class="editable-price history-price" type="text" inputmode="decimal" ` +
          `data-price-row="${esc(entry.rowKey)}" aria-label="Price" ` +
          `value="${escInput(hasPrice(entry.price) ? formatEditablePrice(entry.price) : "")}" placeholder="—">`
        : `<span class="price-field history-field">` +
          `<span class="price-shown history-shown">` +
          `${hasPrice(entry.price) ? esc(formatMoney(entry.price)) : "—"}</span>` +
          `<button type="button" class="price-edit history-edit" ` +
          `data-price-edit="${esc(entry.rowKey)}" ` +
          `title="Edit this price" aria-label="Edit price">&#9998;</button>` +
          `</span>`;
    }
    // A price that fell back to market value is a stand-in, not a record of
    // what was paid, and says so on hover.
    const estimateTitle = entry.cacheEstimated
      ? "Cache market value - no matching purchase found"
      : (entry.bunkerPartial
        ? `${entry.bunkerPartial.resolved} of ${entry.bunkerPartial.resolved +
            entry.bunkerPartial.estimated} Bucks are priced by the caches they ` +
          `bought; the other ${entry.bunkerPartial.estimated} at today's rate.`
        : (entry.bunkerEstimated
          ? "Estimated: today's cache market value per Buck. No sale of the caches " +
            "these Bucks bought has been matched to it yet."
          : null));

    const realTitle = entry.bunkerBucks
      ? "From the sale of the caches these Bucks bought"
      : null;

    const money = hasPrice(entry.price)
      ? (estimateTitle
        ? `<span class="profit-estimate" title="${esc(estimateTitle)}"` +
          `>${esc(formatMoney(entry.price))}</span>`
        : (realTitle
          ? `<span title="${esc(realTitle)}">${esc(formatMoney(entry.price))}</span>`
          : esc(formatMoney(entry.price))))
      : "—";

    // An exchange is paid in Bucks, so both are shown.
    return entry.bunkerBucks
      ? `${money}<span class="bb-note">${esc(entry.bunkerBucks)} BB</span>`
      : money;
  }
  const owned = entry[sub.prop] && entry[sub.prop] === entry.owner;
  return `<span class="${owned ? "history-owner-cell" : ""}">${esc(entry[sub.prop])}</span>`;
}

// Consecutive columns sharing a band collapse into one spanning cell.
function bandedRow(cols, rowCls, cellFor, keyOf = (col) => col.band) {
  const out = [];
  let i = 0;
  while (i < cols.length) {
    const key = keyOf(cols[i]);
    if (key === undefined) { out.push(cellFor(cols[i], 1)); i += 1; continue; }
    let j = i;
    while (j < cols.length && keyOf(cols[j]) === key) j += 1;
    out.push(cellFor(cols[i], j - i));
    i = j;
  }
  return `<tr class="${rowCls}">${out.join("")}</tr>`;
}

function renderUniqueItemsTable() {
  const allRows = buildUniqueItemsRows();
  const rows = getFilteredTransactionRows(allRows);
  const table = document.getElementById("table");
  const empty = document.getElementById("empty");

  const logsByUid = new Map(allRows.map(r => [String(r.uid), visibleItemLogs(r)]));

  const ctx = {
    groupCount: HISTORY_GROUP_COUNT,
    logsByUid,
    ownerValues: new Set(allRows.map(r => r.owner).filter(Boolean)),
    facetRows: {
      firstLog: getFilteredTransactionRows(allRows, { skip: "firstLog" }),
      outcome: getFilteredTransactionRows(allRows, { skip: "outcome" })
    }
  };

  const cols = inventoryColumns(ctx);
  const totalWidth = cols.reduce((n, c) => n + c.width, 0);

  const colgroup = `<colgroup>${cols.map(c =>
    `<col style="width:${c.width}px">`).join("")}</colgroup>`;

  const bandRow = bandedRow(cols, "band-row", (col, span) =>
    span > 1
      ? `<th colspan="${span}" class="history-group history-group-${col.band % 2} history-band">` +
        `${esc(col.bandLabel || "")}</th>`
      : `<th class="${col.cls || ""}"></th>`);

  const headerRow = `<tr>${cols.map(col => {
    const sorted = col.sort && state.transactionSort.field === col.sort;
    const aria = col.sort
      ? ` aria-sort="${sorted ? (state.transactionSort.dir === "asc" ? "ascending" : "descending") : "none"}"`
      : "";
    return `<th scope="col" class="${col.sort ? "sortable " : ""}${col.cls || ""}"` +
      `${col.sort ? ` data-th-sort="${col.sort}"` : ""}${aria}>` +
      `${col.header ? col.header() : ""}` +
      `${col.sort ? transactionSortIndicator(col.sort) : ""}</th>`;
  }).join("")}</tr>`;

  const filterRow = `<tr class="filter-row">${cols.map(col =>
    `<th class="${col.cls || ""}">${col.filter ? col.filter() : ""}</th>`).join("")}</tr>`;

  const body = rows.map(r =>
    `<tr class="${ITEM_STATES[r.state]?.cls || ""}" title="${escInput(r.stateLabel || "")}">` +
    cols.map(col => `<td class="${col.cls || ""}">${col.body ? col.body(r) : ""}</td>`).join("") +
    `</tr>`).join("");

  table.className = "fixed-layout";
  table.style.width = `${totalWidth}px`;
  table.innerHTML =
    `<caption class="sr-only">Weapons and armour, with the transactions each one passed through</caption>` +
    colgroup +
    `<thead>${bandRow}${headerRow}${filterRow}</thead>` +
    `<tbody>${body}</tbody>`;

  bindTransactionHistoryControls();
  bindOwnerControls();
  bindEditablePrices(table);
  bindLogTypeFilters(table);
  bindUidControls(table);

  table.querySelectorAll("[data-trade-row]").forEach(btn => {
    btn.addEventListener("click", () => openTradeModal(btn.dataset.tradeRow));
  });

  table.querySelectorAll("[data-item-history]").forEach(btn => {
    btn.addEventListener("click", () => openItemModal(btn.dataset.itemHistory));
  });

  table.querySelectorAll("[data-market-add]").forEach(btn => {
    btn.addEventListener("click", () => {
      const uid = btn.dataset.marketAdd;
      const item = buildUniqueItemsRows().find(r => String(r.uid) === String(uid));
      if (!item) return;
      if (addManualMarketRow(item)) {
        status(`${item.name} added to Currently Selling - set its price there.`);
      }
      render();
    });
  });

  table.querySelectorAll("[data-market-drop]").forEach(btn => {
    btn.addEventListener("click", () => {
      removeManualMarketRow(btn.dataset.marketDrop);
      render();
    });
  });

  empty.style.display = rows.length ? "none" : "block";
  if (!rows.length) {
    empty.textContent = allRows.length
      ? "No items match the current filters."
      : "No transaction history found.";
  }
}

const MARKET_FIELDS = [
  ["name", "Item"],
  ["where", "Where"],
  ["type", "Type"],
  ["owner", "Owner"],
  ["price", "Listed Price", "col-price"],
  ["rarity", "Rarity"],
  ["quality", "Quality"],
  ["armor", "Armor"],
  ["damage", "Damage"],
  ["accuracy", "Accuracy"],
  ["bonus1", "Bonus 1"],
  ["bonus1Value", "Bonus 1 Value"],
  ["bonus2", "Bonus 2"],
  ["bonus2Value", "Bonus 2 Value"]
];
const MARKET_NUMERIC_FIELDS = new Set([
  "uid", "price", "quality", "armor", "damage", "accuracy",
  "bonus1Value", "bonus2Value"
]);

// Where the weapon physically is: on the market if it is listed, otherwise with
// whoever the last transaction handed it to.
function whereIsUid(uid, source) {
  if (source !== "manual") return "Item Market";

  const item = buildUniqueItemsRows().find(i => String(i.uid) === String(uid));
  const last = (item?.logs || [])[(item?.logs || []).length - 1];
  if (!last) return "Inventory";
  if (last.sourceKey === "itemsSent") return last.to || "Sent out";
  if (last.sourceKey === "factionDeposit") return last.to || "Armoury";
  return "Inventory";
}

function marketDisplayValue(row, field) {
  if (field === "where") return whereIsUid(row.uid, row.source);
  const v = row[field];
  if (v === null || v === undefined || v === "") return "";
  if (field === "price") return formatMoney(v);
  if (field === "rarity") return formatRarity(v);
  return String(v);
}

function marketItemUrl(row) {
  return row.itemId === null
    ? null
    : `https://www.torn.com/page.php?sid=ItemMarket#/market/view=search&itemID=${row.itemId}`;
}

function getFilteredMarketRows() {
  const filtered = allMarketRows().filter(row => {
    for (const [field, query] of Object.entries(state.marketFilters)) {
      if (!query) continue;
      const value = String(marketDisplayValue(row, field));
      if (field === "rarity") {
        if (value !== String(query)) return false;
        continue;
      }
      if (!value.toLowerCase().includes(String(query).toLowerCase())) return false;
    }
    return true;
  });

  const { field, dir } = state.marketSort;
  return filtered.slice().sort((a, b) => {
    let c;
    if (MARKET_NUMERIC_FIELDS.has(field)) {
      const an = Number(a[field]), bn = Number(b[field]);
      c = (Number.isFinite(an) ? an : -Infinity) - (Number.isFinite(bn) ? bn : -Infinity);
    } else {
      c = String(a[field] ?? "").localeCompare(String(b[field] ?? ""), undefined, {
        numeric: true,
        sensitivity: "base"
      });
    }
    return dir === "asc" ? c : -c;
  });
}

function marketSortIndicator(field) {
  return state.marketSort.field === field
    ? `<span class="sort-indicator">${state.marketSort.dir === "asc" ? "\u25b2" : "\u25bc"}</span>`
    : "";
}

function bindMarketControls() {
  document.querySelectorAll("[data-mk-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const field = th.dataset.mkSort;
      if (state.marketSort.field === field) {
        state.marketSort.dir = state.marketSort.dir === "asc" ? "desc" : "asc";
      } else {
        state.marketSort.field = field;
        state.marketSort.dir = MARKET_NUMERIC_FIELDS.has(field) ? "desc" : "asc";
      }
      renderItemMarketTable();
    });
  });

  document.querySelectorAll("[data-mk-filter]").forEach(input => {
    input.addEventListener("input", () => {
      const field = input.dataset.mkFilter;
      const value = input.value;
      const start = input.selectionStart;
      const end = input.selectionEnd;

      state.marketFilters[field] = value;
      renderItemMarketTable();

      const replacement = document.querySelector(`[data-mk-filter="${CSS.escape(field)}"]`);
      if (replacement) {
        replacement.focus();
        try { replacement.setSelectionRange(start, end); } catch (_) {}
      }
    });
  });

  document.querySelectorAll("[data-market-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      removeManualMarketRow(btn.dataset.marketRemove);
      render();
    });
  });

  document.querySelectorAll("[data-market-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.editingMarketPrice = btn.dataset.marketEdit;
      render();
    });
  });

  document.querySelectorAll("[data-market-price]").forEach(input => {
    // Escape detaches the field, and a detached field still blurs; without this
    // the discarded value would be saved on the way out.
    let cancelled = false;

    const commit = () => {
      if (cancelled) return;
      const rowKey = input.dataset.marketPrice;
      const row = state.marketManualRows.find(r => r.rowKey === rowKey);
      if (!setManualMarketPrice(rowKey, input.value)) {
        // Not a number: stay in the field rather than saving nonsense.
        input.value = formatEditablePrice(row?.price ?? 0);
        return;
      }
      state.editingMarketPrice = null;
      render();
    };

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        input.blur();
      }
      if (e.key === "Escape") {
        e.preventDefault();
        cancelled = true;
        state.editingMarketPrice = null;
        render();
      }
    });

    input.focus();
    input.select();
  });
}

// A manual price reads as a value with a dashed box round it, and only turns
// into a field while it is actually being edited.
function marketPriceCell(r) {
  if (state.editingMarketPrice === r.rowKey) {
    return `<input class="editable-price market-price" type="text" inputmode="decimal"
      data-market-price="${esc(r.rowKey)}" aria-label="Price"
      value="${escInput(formatEditablePrice(r.price))}" placeholder="0">`;
  }

  return `<span class="price-field">
    <span class="price-shown">${esc(formatMoney(r.price ?? 0))}</span>
    <button type="button" class="price-edit" data-market-edit="${esc(r.rowKey)}"
      title="Edit this price" aria-label="Edit price">&#9998;</button>
  </span>`;
}

function renderItemMarketTable() {
  const rows = getFilteredMarketRows();
  const table = document.getElementById("table");
  table.className = "";
  table.style.width = "";
  const empty = document.getElementById("empty");

  const headers = MARKET_FIELDS.map(([field, label, extra]) =>
    `<th scope="col" class="sortable ${columnClass(field)} ${extra || ""}" data-mk-sort="${field}">` +
    `${columnLabel(field, label)}${field === "name" ? uidToggleHtml() : ""}` +
    `${marketSortIndicator(field)}</th>`
  ).join("");

  const filters = MARKET_FIELDS.map(([field, , extra]) => field === "rarity"
    ? `<th><select data-mk-filter="rarity">` +
      rarityFilterOptionsHtml(state.marketFilters.rarity || "") +
      `</select></th>`
    : `<th class="${columnClass(field)} ${extra || ""}"><input data-mk-filter="${field}" ` +
      `aria-label="Filter by ${escInput(field)}" ` +
      `value="${escInput(state.marketFilters[field] || "")}"></th>`
  ).join("");

  table.innerHTML = `
    <thead>
      <tr>${headers}</tr>
      <tr class="filter-row">${filters}</tr>
    </thead>
    <tbody>
      ${rows.map(r => {
        const manual = r.source === "manual";
        const url = marketItemUrl(r);
        const nameCell = url
          ? `<a class="item-link" href="${escInput(url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`
          : esc(r.name);

        const cells = MARKET_FIELDS.slice(1).map(([field, , extra]) => {
          if (field === "price" && manual) {
            return `<td class="${extra || ""}">${marketPriceCell(r)}</td>`;
          }
          if (field === "rarity") {
            return `<td class="${rarityClass(r.rarity).trim()}">${esc(marketDisplayValue(r, field))}</td>`;
          }
          return `<td class="${columnClass(field)} ${extra || ""}">${esc(marketDisplayValue(r, field))}</td>`;
        }).join("");

        const action = manual
          ? `<button type="button" class="inline-action" data-market-remove="${esc(r.rowKey)}" title="Remove this manual entry">Remove</button>`
          : "";

        return `<tr class="${manual ? "market-draft" : "market-live"}">
          <td>${nameCell}${action}${uidLineHtml(r.uid)}</td>
          ${cells}
        </tr>`;
      }).join("")}
    </tbody>`;

  bindMarketControls();
  bindUidControls(table);

  empty.style.display = rows.length ? "none" : "block";
  if (!rows.length) {
    empty.textContent = allMarketRows().length
      ? "No items match the current filters."
      : "No weapon or armour listings on the item market. Press Refresh listings to load, " +
        "or add items from the Transaction History tab.";
  }
}

// ---------------------------------------------------------------------------
// Forum post export. Reproduces the sale-thread markup: a weapons table, an
// armour table, then one image row per item in the style of Kal's Loadout
// Revealer (Torn's own .item-plate / .torn-item / .bonus-attachment-* classes,
// which the forum renderer already has CSS for).
// ---------------------------------------------------------------------------

// Asking price advertised in the post, as a fraction of the item market price.
const FORUM_PRICE_FACTOR = 0.95;

const FORUM_RARITY_COLORS = new Set(["yellow", "orange", "red"]);

// Weapon table column widths, copied from the existing forum post.
const FORUM_WEAPON_WIDTHS = [
  "15.9005%", "14.3236%", "19.3171%", "10.9069%", "13.0095%", "10.7755%", "15.7691%"
];
const FORUM_ARMOUR_WIDTHS = ["18%", "14%", "22%", "13%", "13%", "20%"];

// Bonuses whose value is not a percentage. Mirrors the loadout revealer.
const FORUM_VALUELESS_BONUSES = new Set(["irradiate", "smash"]);

function escForumText(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"]/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
  }[c]));
}

function forumRarity(row) {
  const rarity = String(row.rarity ?? "").toLowerCase();
  return FORUM_RARITY_COLORS.has(rarity) ? rarity : null;
}
function forumColor(row) {
  const rarity = forumRarity(row);
  return rarity ? `var(--te-text-color-${rarity})` : null;
}
function forumGlow(row) {
  return forumRarity(row) || "default";
}

// Torn's .item-plate / .glow-* / .torn-item classes come from site CSS, and the
// forum drops class attributes when a post is published - the glow shows in the
// editor preview and then vanishes. Inline style survives, so the plate, its
// rarity glow and the image size are all written inline. The classes are kept
// too: where they do apply they are equivalent, and inline style wins anyway.
const FORUM_GLOW_RGB = {
  yellow: "232, 209, 46",
  orange: "232, 145, 30",
  red: "232, 57, 46"
};

const FORUM_PLATE_W = 76;
const FORUM_PLATE_H = 40;
const FORUM_IMAGE_W = 60;
const FORUM_IMAGE_H = 30;

function forumPlateStyle(row) {
  const rarity = forumRarity(row);
  const rgb = rarity ? FORUM_GLOW_RGB[rarity] : null;
  const layers = [];
  if (rgb) {
    layers.push(
      `radial-gradient(ellipse at 50% 50%, rgba(${rgb}, 0.55) 0%, ` +
      `rgba(${rgb}, 0.22) 52%, rgba(${rgb}, 0) 78%)`
    );
  }
  layers.push("rgba(0, 0, 0, 0.25)");

  return [
    "display: inline-block",
    `width: ${FORUM_PLATE_W}px`,
    `height: ${FORUM_PLATE_H}px`,
    `line-height: ${FORUM_PLATE_H}px`,
    "text-align: center",
    "border-radius: 4px",
    "vertical-align: middle",
    `background: ${layers.join(", ")}`
  ].join("; ") + ";";
}

const FORUM_IMAGE_STYLE = [
  `width: ${FORUM_IMAGE_W}px`,
  `height: ${FORUM_IMAGE_H}px`,
  "vertical-align: middle",
  "max-width: 100%"
].join("; ") + ";";

function forumSpan(text, color, bold=false) {
  const escaped = escForumText(text);
  const inner = bold ? `<strong>${escaped}</strong>` : escaped;
  return color ? `<span style="color: ${color};">${inner}</span>` : inner;
}

function forumBonusValue(title, value) {
  const key = String(title ?? "").toLowerCase().replace(/\s+/g, " ").trim();
  if (FORUM_VALUELESS_BONUSES.has(key)) return null;
  if (value === null || value === undefined || value === "") return null;
  const n = Number(value);
  if (!Number.isFinite(n)) return null;
  return `${n}${key === "disarm" ? "T" : "%"}`;
}

function forumBonusText(row) {
  const parts = [];
  for (const [title, value] of [[row.bonus1, row.bonus1Value], [row.bonus2, row.bonus2Value]]) {
    if (!title) continue;
    const formatted = forumBonusValue(title, value);
    parts.push(formatted ? `${title}: ${formatted}` : String(title));
  }
  return parts.join(", ");
}

function forumStat(value) {
  const n = Number(value);
  return value === null || value === undefined || value === "" || !Number.isFinite(n)
    ? ""
    : n.toFixed(2);
}
function forumQuality(value) {
  const stat = forumStat(value);
  return stat ? `${stat}%` : "";
}
// Listed weapons advertise at a discount; anything held elsewhere advertises at
// the price that was set for it.
function forumPriceFactor(row) {
  return row?.source === "manual" ? 1 : FORUM_PRICE_FACTOR;
}
function forumPrice(row) {
  const n = Number(row.price);
  if (!Number.isFinite(n) || n <= 0) return "";
  return formatMoney(Math.round(n * forumPriceFactor(row)));
}

// /user/itemmarket reports the equip slot, so armour arrives as "Defensive".
// The post labels that column "Armor".
function isArmourRow(row) {
  const type = String(row.type ?? "").toLowerCase();
  if (type) return ["defensive", "armor", "armour"].includes(type);
  return row.armor !== null && row.armor !== undefined && row.armor !== "";
}
function forumType(row) {
  return isArmourRow(row) ? "Armor" : String(row.type ?? "");
}

function forumStatsTable(rows, armour) {
  const widths = armour ? FORUM_ARMOUR_WIDTHS : FORUM_WEAPON_WIDTHS;
  const headers = armour
    ? ["Armor", "Type", "Bonus", "Armor", "Quality", "B/O"]
    : ["Weapon", "Type", "Bonus", "Damage", "Accuracy", "Quality", "B/O"];

  const headCells = headers.map((label, i) =>
    `          <th style="width: ${widths[i]}; text-align: center;">` +
    `<span style="font-size: 16px;">${escForumText(label)}</span></th>`
  ).join("\n");

  const bodyRows = rows.map(row => {
    const color = forumColor(row);
    const cells = armour
      ? [
          [row.name, true],
          [forumType(row), false],
          [forumBonusText(row), false],
          [forumStat(row.armor), false],
          [forumQuality(row.quality), false],
          [forumPrice(row), false]
        ]
      : [
          [row.name, true],
          [forumType(row), false],
          [forumBonusText(row), false],
          [forumStat(row.damage), false],
          [forumStat(row.accuracy), false],
          [forumQuality(row.quality), false],
          [forumPrice(row), false]
        ];

    return "        <tr>\n" + cells.map(([text, bold], i) =>
      `          <td style="width: ${widths[i]}; text-align: center;">` +
      `${forumSpan(text, color, bold)}</td>`
    ).join("\n") + "\n        </tr>";
  }).join("\n");

  return [
    '  <div class="table-wrap">',
    '    <table style="width: 99.7382%;">',
    '      <tbody>',
    '        <tr>',
    headCells,
    '        </tr>',
    bodyRows,
    '      </tbody>',
    '    </table>',
    '  </div>'
  ].join("\n");
}

function forumStatLine(stats, textLabels) {
  const parts = stats
    .filter(([, , value]) => value)
    .map(([label, iconClass, value]) => textLabels
      ? `<strong>${escForumText(label)}</strong>&nbsp;${escForumText(value)}`
      : `<i class="${iconClass}" title="${escForumText(label)}"></i>&nbsp;${escForumText(value)}`);

  return parts.length
    ? `<p><span style="font-size: 12px;">${parts.join("&nbsp; &nbsp;")}</span></p>`
    : "";
}

function forumImageRows(rows, textLabels) {
  if (!rows.length) return "";

  const bodyRows = rows.map(row => {
    const color = forumColor(row);
    const base = row.itemId === null
      ? null
      : `https://www.torn.com/images/items/${row.itemId}/medium`;
    const alt = escForumText(row.name);

    const plate = base
      ? `<span class="item-plate glow-${forumGlow(row)}" style="${forumPlateStyle(row)}">` +
        `<img class="torn-item medium" style="${FORUM_IMAGE_STYLE}" src="${base}.png" ` +
        `srcset="${base}.png 1x, ${base}@2x.png 2x, ${base}@3x.png 3x, ${base}@4x.png 4x" ` +
        `width="${FORUM_IMAGE_W}" height="${FORUM_IMAGE_H}" ` +
        `alt="${alt}" loading="lazy" /></span>`
      : forumSpan(row.name, color, true);

    const bonus = forumBonusText(row);
    const nameLine = `<p>${forumSpan(row.name, color, true)}` +
      (bonus ? `&nbsp; &nbsp;${forumSpan(bonus, color)}` : "") + "</p>";

    const statLine = isArmourRow(row)
      ? forumStatLine([
          ["Armor", "bonus-attachment-item-defence-bonus", forumStat(row.armor)]
        ], textLabels)
      : forumStatLine([
          ["Damage", "bonus-attachment-item-damage-bonus", forumStat(row.damage)],
          ["Accuracy", "bonus-attachment-item-accuracy-bonus", forumStat(row.accuracy)]
        ], textLabels);

    return `      <tr>
        <td style="width: 12%; text-align: center;">${plate}</td>
        <td style="width: 88%;">
          ${nameLine}
          ${statLine}
        </td>
      </tr>`;
  }).join("\n");

  return [
    '<div class="table-wrap">',
    '  <table style="width: 99.7382%;">',
    '    <tbody>',
    bodyRows,
    '    </tbody>',
    '  </table>',
    '</div>'
  ].join("\n");
}

// The whole post, with ${table} standing in for the generated tables. It is
// never rendered here - only written into a textarea and copied - so it is
// stored and emitted byte for byte, HTML and all.
const FORUM_TEMPLATE_KEY = "tornForumTemplate";
const FORUM_TABLE_TOKEN = "${table}";

const FORUM_TEMPLATE_DEFAULT = [
  '<p>',
  '  <span style="font-size: 16px;"><strong>Weapons and armour for sale</strong></span>',
  '</p>',
  '<p>&nbsp;</p>',
  '<p>',
  '  <span style="font-size: 12px;">Prices are the buyout shown below. Offers welcome.</span>',
  '</p>',
  '<p>&nbsp;</p>',
  FORUM_TABLE_TOKEN
].join("\n");

function forumTemplate() {
  const saved = localStorage.getItem(FORUM_TEMPLATE_KEY);
  return saved === null ? FORUM_TEMPLATE_DEFAULT : saved;
}
function saveForumTemplate(text) {
  localStorage.setItem(FORUM_TEMPLATE_KEY, text);
}

function buildMarketForumTables() {
  const rows = getFilteredMarketRows();
  const weapons = rows.filter(r => !isArmourRow(r));
  const armour = rows.filter(isArmourRow);

  const tables = [];
  if (weapons.length) tables.push(forumStatsTable(weapons, false));
  if (armour.length) tables.push(forumStatsTable(armour, true));

  const parts = [];
  if (tables.length) {
    parts.push("<div>\n" + tables.join("\n  <p>&nbsp;</p>\n") + "\n</div>");
  }

  const images = forumImageRows([...weapons, ...armour], state.marketForumTextLabels);
  if (images) parts.push("<p>&nbsp;</p>", images);

  return parts.join("\n");
}

function buildMarketForumHtml() {
  const template = forumTemplate();
  const tables = buildMarketForumTables();

  return template.includes(FORUM_TABLE_TOKEN)
    ? template.split(FORUM_TABLE_TOKEN).join(tables)
    : [template, tables].filter(Boolean).join("\n");
}

async function copyMarketForumHtml() {
  const rows = getFilteredMarketRows();
  if (!rows.length) {
    status("Nothing to copy - no listings in the current view.", true);
    return;
  }

  state.marketForumHtml = buildMarketForumHtml();

  let copied = false;
  try {
    await navigator.clipboard.writeText(state.marketForumHtml);
    copied = true;
  } catch (_) {}

  render();

  // Clipboard access is blocked on insecure origins and without a gesture in
  // some browsers; fall back to selecting the textarea the panel just rendered.
  if (!copied) {
    const textarea = document.getElementById("exportHtml");
    if (textarea) {
      textarea.removeAttribute("readonly");
      textarea.focus();
      textarea.select();
      try { copied = document.execCommand("copy"); } catch (_) {}
      textarea.setAttribute("readonly", "readonly");
    }
  }

  const unpriced = rows.filter(r => !(Number(r.price) > 0)).length;
  const warning = unpriced
    ? ` ${unpriced} item${unpriced === 1 ? " has" : "s have"} no price set - its B/O cell is blank.`
    : "";

  status(copied
    ? `Forum HTML for ${rows.length} item${rows.length === 1 ? "" : "s"} copied to clipboard.${warning}`
    : "Could not reach the clipboard - select the HTML below and copy it manually." + warning,
    !copied || unpriced > 0);
}

function renderMarketExportPanel() {
  const panel = document.getElementById("exportPanel");
  if (state.active !== MARKET_TAB.key ||
      (!state.marketForumHtml && !state.forumEditOpen)) {
    panel.innerHTML = "";
    return;
  }

  const pct = `${Math.round(FORUM_PRICE_FACTOR * 100)}%`;
  const editor = state.forumEditOpen ? `
    <div class="export-head">
      <span>Post message &middot; <code>${esc(FORUM_TABLE_TOKEN)}</code> is replaced by the tables</span>
      <button type="button" id="resetForumMessage">Reset to default</button>
    </div>
    <textarea id="forumTemplate" spellcheck="false">${escInput(forumTemplate())}</textarea>` : "";

  const output = state.marketForumHtml ? `
    <div class="export-head">
      <span>Copied HTML &middot; listed items at ${pct}, everything else at the price set</span>
      <button type="button" id="closeExport">Hide</button>
    </div>
    <textarea id="exportHtml" spellcheck="false" readonly>${escInput(state.marketForumHtml)}</textarea>` : "";

  panel.innerHTML = editor + output;

  const template = document.getElementById("forumTemplate");
  if (template) {
    template.addEventListener("input", () => {
      saveForumTemplate(template.value);
      // Keep an already-copied preview honest about the edit.
      if (state.marketForumHtml) {
        state.marketForumHtml = buildMarketForumHtml();
        const out = document.getElementById("exportHtml");
        if (out) out.value = state.marketForumHtml;
      }
    });
  }

  const reset = document.getElementById("resetForumMessage");
  if (reset) {
    reset.addEventListener("click", () => {
      saveForumTemplate(FORUM_TEMPLATE_DEFAULT);
      if (state.marketForumHtml) state.marketForumHtml = buildMarketForumHtml();
      render();
    });
  }

  const close = document.getElementById("closeExport");
  if (close) {
    close.addEventListener("click", () => {
      state.marketForumHtml = "";
      render();
    });
  }
}

// ---------------------------------------------------------------------------
// Trade receipt modal
// ---------------------------------------------------------------------------

const RARITY_OPTIONS = ["Yellow", "Orange", "Red"];

function formatRarity(rarity) {
  const r = String(rarity ?? "").trim();
  return r ? r.charAt(0).toUpperCase() + r.slice(1).toLowerCase() : "";
}

function rarityFilterOptionsHtml(selected) {
  return [`<option value="">All</option>`]
    .concat(RARITY_OPTIONS.map(r =>
      `<option value="${r}"${r === selected ? " selected" : ""}>${r}</option>`))
    .join("");
}

// Column groups that can be folded away together, and the ones whose contents
// are short enough to squeeze.
const STAT_FIELDS = new Set(["quality", "armor", "damage", "accuracy"]);
const BONUS_FIELDS = new Set(["bonus1", "bonus1Value", "bonus2", "bonus2Value"]);
const NARROW_FIELDS = new Set(["bonus1Value", "bonus2Value"]);

const COLUMN_LABELS = {
  damage: "DMG",
  accuracy: "ACC",
  bonus1Value: "B1 Value",
  bonus2Value: "B2 Value"
};

function columnLabel(field, fallback) {
  return COLUMN_LABELS[field] ?? fallback;
}

function columnClass(field) {
  const parts = [];
  if (STAT_FIELDS.has(field)) parts.push("col-stat", "col-num");
  if (BONUS_FIELDS.has(field)) parts.push("col-bonus");
  if (NARROW_FIELDS.has(field)) parts.push("col-narrow");
  return parts.join(" ");
}
function columnAttr(field) {
  const cls = columnClass(field);
  return cls ? ` class="${cls}"` : "";
}

// Folding columns away is a Transaction History affordance; the other tables
// always show everything, so there is no way to lose a column there.
// The toggle for a collapsible group lives in the header of the first column it
// folds away, and that header stays put when collapsed so there is always
// something to click to bring the group back.
// The unique id is rarely wanted but occasionally essential, so it hides under
// the item name and can be switched on from the Item heading of any table.
function uidToggleHtml() {
  return `<label class="uid-toggle-label" title="Show unique IDs under each item">` +
    `<input type="checkbox" class="uid-toggle" data-uid-toggle ` +
    `${state.showUids ? "checked" : ""} aria-label="Show unique IDs">id</label>`;
}

function uidLineHtml(uid) {
  if (!state.showUids || uid === null || uid === undefined || uid === "") return "";
  return `<span class="uid-line" data-copy-uid="${escInput(uid)}" ` +
    `title="Click to copy">${esc(uid)}</span>`;
}

async function copyUid(uid) {
  try {
    await navigator.clipboard.writeText(String(uid));
    status(`Copied ${uid}`);
  } catch (_) {
    status("Could not reach the clipboard.", true);
  }
}

function bindUidControls(root) {
  root.querySelectorAll("[data-uid-toggle]").forEach(box => {
    box.addEventListener("click", e => e.stopPropagation());
    box.addEventListener("change", () => {
      state.showUids = box.checked;
      localStorage.setItem("tornShowUids", box.checked ? "1" : "0");
      render();
    });
  });

  root.querySelectorAll("[data-copy-uid]").forEach(el => {
    el.addEventListener("click", () => copyUid(el.dataset.copyUid));
  });
}

function rarityClass(rarity) {
  const r = String(rarity ?? "").toLowerCase();
  return ["yellow", "orange", "red"].includes(r) ? ` rarity-${r}` : "";
}

function statText(value, suffix) {
  const n = Number(value);
  return value === null || value === undefined || value === "" || !Number.isFinite(n)
    ? null
    : `${n.toFixed(2)} ${suffix}`;
}

function receiptEntryHtml(entry) {
  if (entry.kind === "money") {
    return `<li class="receipt-money">${esc(formatMoney(entry.amount))}</li>`;
  }

  // The unique ID lives in the hover title; the item id is only ever a fallback
  // label for an item whose name could not be resolved.
  const name = entry.name || (entry.itemId === null ? "Unknown item" : `Item ${entry.itemId}`);
  const label = esc(name);
  const qty = entry.amount > 1 ? ` &times;${esc(entry.amount)}` : "";

  const meta = [
    statText(entry.damage, "dmg"),
    statText(entry.accuracy, "acc"),
    statText(entry.armor, "armor")
  ].filter(Boolean);

  for (const bonus of entry.bonuses || []) {
    const formatted = forumBonusValue(bonus.title, bonus.value);
    meta.push(formatted ? `${bonus.title} ${formatted}` : String(bonus.title));
  }

  return `<li>
    <div class="receipt-item-name${rarityClass(entry.rarity)}"${entry.uid ? ` title="Unique ID ${esc(entry.uid)}"` : ""}>${label}${qty}</div>
    ${meta.length ? `<div class="receipt-item-meta">${esc(meta.join(" \u00b7 "))}</div>` : ""}
  </li>`;
}

function receiptSideHtml(side) {
  const who = side.name || `Player ${side.id}`;
  return `<div class="receipt-side">
    <div class="receipt-party${side.isOwner ? " receipt-you" : ""}">
      ${esc(who)}${side.isOwner ? " (you)" : ""} gave
    </div>
    ${side.entries.length
      ? `<ul class="receipt-list">${side.entries.map(receiptEntryHtml).join("")}</ul>`
      : `<div class="receipt-nothing">Nothing recorded</div>`}
  </div>`;
}

// Escape steps back one modal rather than dropping the lot: coming out of a
// trade receipt should land on the history it was opened from.
function closeTradeModal() {
  if (state.modalStack.length > 1) backModal();
  else closeModal();
}

// Every weapon row of one trade that has a Bunker Buck share worked out.
function bbSplitRows(tradeId) {
  if (tradeId === null || tradeId === undefined) return [];
  return ["tradeBuys", "tradeSells"]
    .flatMap(k => state.rows[k] || [])
    .filter(r => String(r.tradeId ?? "") === String(tradeId) && hasPrice(r.bbSplitPrice));
}

function bbSplitApplied(tradeId) {
  const rows = bbSplitRows(tradeId);
  return rows.length > 0 &&
    rows.every(r => state.manualPrices.get(r.rowKey) === r.bbSplitPrice);
}

function applyBbSplit(tradeId, rowKey, undo=false) {
  const rows = bbSplitRows(tradeId);
  if (!rows.length) return;
  for (const row of rows) setManualPrice(row.rowKey, undo ? "" : String(row.bbSplitPrice));
  render();
  openTradeModal(rowKey);
}

function bbSplitPanelHtml(row) {
  const rows = bbSplitRows(row?.tradeId);
  if (!rows.length || !hasPrice(row?.bbSplitPrice)) return "";

  const applied = bbSplitApplied(row.tradeId);
  const share = `${row.bbSplitBucks} of ${row.bbSplitTotalBucks} BB`;

  return `
    <div class="bb-split">
      <div class="bb-split-text">
        <strong>Split by Bunker Buck value</strong>
        ${esc(formatMoney(row.bbSplitCash))} across ${rows.length} weapons
        (${esc(share)} here → ${esc(formatMoney(row.bbSplitPrice))}).
      </div>
      <button type="button" class="bb-split-btn" data-bb-split="${esc(String(row.tradeId))}"
        data-bb-row="${esc(String(row.rowKey))}" data-bb-undo="${applied ? "1" : "0"}"
        >${applied ? "Clear these prices" : "Use these prices"}</button>
    </div>`;
}

// ---------------------------------------------------------------------------
// Modals.
//
// One modal can lead to another - a weapon's history leads to the receipt of a
// trade in it - and coming back has to land where you came from, so what is
// open is a stack rather than a single panel. Each entry says only what it is
// and what it is about; the content is derived when it is drawn, so an edit
// made inside a modal shows up in it immediately.
// ---------------------------------------------------------------------------
function openModal(entry) {
  state.modalStack.push(entry);
  renderModal();
}

function backModal() {
  state.modalStack.pop();
  renderModal();
}

function closeModal() {
  state.modalStack.length = 0;
  renderModal();
}

function modalHtml(entry, canGoBack) {
  if (entry?.kind === "item") return itemHistoryModalHtml(entry.uid, canGoBack);
  if (entry?.kind === "trade") return tradeModalHtml(entry.rowKey, canGoBack);
  return null;
}

function renderModal() {
  const modal = document.getElementById("modal");
  const top = state.modalStack[state.modalStack.length - 1];

  if (!top) {
    modal.hidden = true;
    modal.innerHTML = "";
    return;
  }

  const html = modalHtml(top, state.modalStack.length > 1);
  // Whatever it was about has gone - a weapon filtered away, a row rebuilt.
  if (!html) {
    state.modalStack.pop();
    renderModal();
    return;
  }

  modal.innerHTML = html;
  modal.hidden = false;

  modal.querySelector("[data-modal-close]")?.addEventListener("click", closeModal);
  modal.querySelector("[data-modal-back]")?.addEventListener("click", backModal);
  modal.querySelector("[data-bb-split]")?.addEventListener("click", e => {
    const btn = e.currentTarget;
    applyBbSplit(btn.dataset.bbSplit, btn.dataset.bbRow, btn.dataset.bbUndo === "1");
  });
  modal.querySelectorAll("[data-trade-row]").forEach(btn => {
    btn.addEventListener("click", () => openModal({ kind: "trade", rowKey: btn.dataset.tradeRow }));
  });
  modal.querySelectorAll("[data-holding-end]").forEach(btn => {
    btn.addEventListener("click", () => {
      setHoldingOutcome(btn.dataset.holdingKey, btn.dataset.holdingEnd || null);
      render();
    });
  });
  modal.querySelectorAll("[data-holding-open]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.holdingOpen;
      setHoldingOutcome(key, state.holdingOutcome.get(key) === "open" ? null : "open");
      render();
    });
  });
  bindOwnerControls();
  // The same prices as the table, edited the same way.
  bindEditablePrices(modal);
}

function modalHeadHtml({ title, sub, label, canGoBack }) {
  return `<div class="modal-head">
      <div>
        ${canGoBack
          ? `<button type="button" class="modal-back" data-modal-back>&larr; Back</button>`
          : ""}
        <div class="modal-title">${title}</div>
        ${sub ? `<div class="modal-sub">${sub}</div>` : ""}
      </div>
      <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
    </div>`;
}

function tradeModalHtml(rowKey, canGoBack) {
  // The per-log tabs are gone, so the row could belong to any of them.
  const row = findRowByKey(rowKey);
  const receipt = row?.receipt;
  if (!receipt) return null;

  const subParts = [formatDate(receipt.timestamp)];
  if (receipt.description) subParts.push(`"${receipt.description}"`);

  const viewLink = receipt.tradeId === null || receipt.tradeId === undefined
    ? ""
    : `<a class="trade-view-link" target="_blank" rel="noopener noreferrer"
         href="https://www.torn.com/trade.php#step=logview&ID=${encodeURIComponent(receipt.tradeId)}"
         >[view]</a>`;

  return `
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Trade ${esc(receipt.tradeId)}">
      ${modalHeadHtml({
        title: `Trade #${esc(receipt.tradeId)}${viewLink}`,
        sub: esc(subParts.join(" \u00b7 ")),
        canGoBack
      })}
      <div class="receipt-sides">
        ${receipt.sides.map(receiptSideHtml).join("")}
      </div>
      ${bbSplitPanelHtml(row)}
    </div>`;
}

// Kept so a weapon's history is one click from its name, wherever it is shown.
function openTradeModal(rowKey) {
  openModal({ kind: "trade", rowKey });
}

function openItemModal(uid) {
  openModal({ kind: "item", uid: String(uid) });
}

// Every transaction a weapon has been through, in the order they happened.
// The table shows only the two ends; this is the whole of it, with the same
// cells - a price is edited here exactly as it is there, and the trade behind
// a row opens on top of this one.
function holdingSectionHtml(holding, index, total) {
  const logs = holding.logs || [];
  const ctx = { logsByUid: new Map([[String(holding.uid), logs]]) };
  const outcome = outcomeLogEntry(holding);

  const rows = logs.map((entry, i) => {
    const cells = HISTORY_SUB_SPEC.map(sub =>
      `<td class="${sub.party ? "history-party" : ""}">${historyCell(holding, i, sub, ctx)}</td>`
    ).join("");

    // Any transaction that took the weapon out can be the one that ended the
    // holding. Saying so splits whatever follows into the next holding.
    const ends = OUTGOING_SOURCES.has(entry.sourceKey)
      ? (holding.decision === entry.rowKey
        ? `<button type="button" class="holding-mark is-active" data-holding-end=""
             data-holding-key="${esc(holding.holdingKey)}"
             title="Stop treating this as the end of the holding">Ends here ✓</button>`
        : `<button type="button" class="holding-mark" data-holding-end="${esc(entry.rowKey)}"
             data-holding-key="${esc(holding.holdingKey)}"
             title="This transaction ended the holding; anything after it starts a new one"
             >Ends here</button>`)
      : "";

    return `<tr class="${i === 0 ? "first-acquisition" : ""}${
      outcome && outcome.rowKey === entry.rowKey ? " is-outcome" : ""}">` +
      `${cells}<td class="holding-mark-cell">${ends}</td></tr>`;
  }).join("");

  const decided = holding.decision === "open"
    ? "still open"
    : (holding.decision ? "ended by hand" : "not decided");

  return `
    <section class="holding-section${holding.unresolved ? " is-unresolved" : ""}">
      <div class="holding-head">
        <span class="holding-title">${total > 1 ? `Holding ${index + 1} of ${total}` : "History"}
          <span class="holding-note">${esc(decided)}${
            holding.unresolved ? " \u00b7 unresolved" : ""}</span></span>
        <span class="holding-controls">
          <label class="holding-owner">Owner
            ${ownerCellHtml(holding, { id: holding.ownerId, name: holding.owner })}</label>
          <button type="button" class="holding-mark${holding.decision === "open" ? " is-active" : ""}"
            data-holding-open="${esc(holding.holdingKey)}"
            title="Nothing has ended this holding yet - it is still held or still out"
            >Still open${holding.decision === "open" ? " ✓" : ""}</button>
        </span>
      </div>
      <table class="item-history-table">
        <thead><tr>${HISTORY_SUB_SPEC.map(sub =>
          `<th scope="col">${esc(sub.label)}</th>`).join("")}<th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
}

function itemHistoryModalHtml(uid, canGoBack) {
  const holdings = buildUniqueItemsRows().filter(r => String(r.uid) === String(uid));
  if (!holdings.length) return null;

  const first = holdings[0];
  const subParts = [formatRarity(first.rarity)];
  if (holdings.length > 1) subParts.push(`${holdings.length} holdings`);
  else subParts.push(first.stateLabel);

  return `
    <div class="modal-panel modal-wide" role="dialog" aria-modal="true"
      aria-label="History of ${escInput(first.name)}">
      ${modalHeadHtml({
        title: `${esc(first.name)}${uidLineHtml(first.uid)}`,
        sub: esc(subParts.filter(Boolean).join(" \u00b7 ")),
        canGoBack
      })}
      <div class="item-history">
        ${holdings.map((h, i) => holdingSectionHtml(h, i, holdings.length)).join("")}
      </div>
    </div>`;
}

document.getElementById("modal").addEventListener("click", e => {
  // Backdrop only; clicks inside the panel must not dismiss it.
  if (e.target.id === "modal") closeModal();
});
// A click anywhere outside an open filter menu dismisses it. The target is
// matched with closest() rather than contains(), so a click on a checkbox that
// has already triggered a re-render still counts as inside.
function closeFilterMenus() {
  document.querySelectorAll(".state-filter[open]").forEach(details => {
    details.open = false;
  });
}

document.addEventListener("click", e => {
  if (e.target?.closest?.(".state-filter")) return;
  closeFilterMenus();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeTradeModal();
    closeFilterMenus();
  }
});

function render() {
  invalidateOwnerDefaults();
  applyStatedFacts();
  renderModal();
  renderTabs();
  renderTableActions();
  renderMarketExportPanel();

  if (state.active === MARKET_TAB.key) {
    renderItemMarketTable();
    return;
  }

  if (state.active === CACHE_TAB.key) {
    renderCacheSellsTable();
    return;
  }

  renderUniqueItemsTable();
}

function setKeyRowStatus(keyRow, message, isError=false) {
  const el = keyRow?.querySelector(".key-owner");
  if (!el) return;
  el.textContent = message || "";
  el.style.color = isError ? "var(--danger)" : "";
}

async function loadAll(key, keyRow=null, options={}) {
  const rebuild = options.rebuild === true;

  const requestState = getKeyRequestState(key);
  requestState.keyRow = keyRow;
  requestState.phaseCounts = new Map();
  setKeyRowStatus(keyRow, rebuild ? "Rebuilding..." : "Identifying user...");
  setPerKeyStatus(key, rebuild ? "Rebuilding..." : "Identifying user...");
  setKeyPhase(key, rebuild ? "rebuild from saved facts" : "owner /user/basic");

  // A rebuild is driven entirely by what is already saved, so the owner comes
  // from the stored record rather than another /user/basic call.
  const owner = rebuild
    ? { id: String(options.ownerId), name: options.ownerName || String(options.ownerId) }
    : await getOwnerBasic(key);
  const ownerId = String(owner.id);
  state.loadedOwners.set(ownerId, owner.name);
  setKeyRowStatus(keyRow, owner.name);

  window.tornDebug = window.tornDebug || {};
  window.tornDebug.owners = window.tornDebug.owners || {};
  window.tornDebug.owners[ownerId] = window.tornDebug.owners[ownerId] || {};
  const ownerDebug = window.tornDebug.owners[ownerId];
  ownerDebug.owner = owner;

  // Tables remain empty after page open. Cached rows are only restored when the
  // user presses this owner's Load button.
  setKeyPhase(key, "loading IndexedDB cache");
  const cached = await getOwnerCache(ownerId);
  // Loading an account's key is as clear a statement as the toggle that it is
  // wanted back.
  if (cached?.inactive && !rebuild) cached.inactive = false;
  const cachedRows = cached?.rows || {};
  const watermarks = { ...(cached?.watermarks || {}) };
  let tradeWatermark = Number(cached?.tradeWatermark || 0);

  // Load this owner's facts before anything reads them, recovering a store from
  // the legacy row cache when the saved record predates one.
  state.raw = cached?.raw?.version
    ? cached.raw
    : (cached ? rawFromLegacyRows(cached) : newRawStore());
  state.factStores.set(ownerId, state.raw);
  primeCachesFromRaw();
  ownerDebug.rawStore = state.raw;
  ownerDebug.rawStats = rawStoreStats(state.raw);
  console.log(`[Torn facts] ${owner.name}`, ownerDebug.rawStats);

  // Replace this owner's current in-memory rows with its cached rows.
  for (const spec of LOGS) {
    let ownerRows = Array.isArray(cachedRows[spec.key]) ? cachedRows[spec.key] : [];

    // Manual send/receive prices live separately so clearing them to null remains
    // authoritative even if the cached processed row contains an older value.
    ownerRows = ownerRows.map(row => rowAcceptsManualPrice(spec.key, row)
      ? {
          ...row,
          price: state.manualPrices.has(row.rowKey)
            ? state.manualPrices.get(row.rowKey)
            : null
        }
      : row);

    state.rows[spec.key] = [
      ...(state.rows[spec.key] || []).filter(r => String(r.ownerId ?? "") !== ownerId),
      ...ownerRows
    ];

    if (!watermarks[spec.key]) {
      watermarks[spec.key] = maxTimestamp(ownerRows);
    }
  }

  if (!tradeWatermark) {
    tradeWatermark = Math.max(
      maxTimestamp(cachedRows.tradeBuys || []),
      maxTimestamp(cachedRows.tradeSells || [])
    );
  }
  render();

  if (!rebuild &&
      Number(activeRaw().ownerScope || 1) < RAW_OWNER_SCOPE_VERSION) {
    status(`${owner.name}: re-reading logs to undo a mixed-up save...`);
    activeRaw().logEntries = {};
    activeRaw().trades = {};
    activeRaw().logCursors = {};
    activeRaw().ownerScope = RAW_OWNER_SCOPE_VERSION;

    // Rows are merged by key and never removed, so a row derived from a log
    // entry that is being discarded would otherwise outlive it.
    for (const spec of LOGS) {
      state.rows[spec.key] = (state.rows[spec.key] || [])
        .filter(r => String(r.ownerId ?? "") !== ownerId);
    }
    for (const spec of LOGS) delete watermarks[spec.key];
    delete watermarks.parcelCreate;
    delete watermarks.bunkerBuy;
    tradeWatermark = 0;
  }

  // Written after every stage rather than only at the end: a load that is
  // interrupted keeps everything it had already fetched, and the next one picks
  // up from there instead of starting the walk again.
  // Saving means cloning the whole fact store, so the one inside the trade loop
  // is throttled; stage boundaries always write.
  let lastCheckpoint = 0;
  const checkpoint = async ({ force=false }={}) => {
    if (!force && Date.now() - lastCheckpoint < CHECKPOINT_MIN_MS) return;
    const rowsForCache = {};
    for (const spec of LOGS) {
      rowsForCache[spec.key] = (state.rows[spec.key] || []).filter(
        r => String(r.ownerId ?? "") === ownerId
      );
    }
    await putOwnerCache({
      ownerId,
      ownerName: owner.name,
      rows: rowsForCache,
      raw: state.raw,
      watermarks,
      tradeWatermark,
      savedAt: Date.now()
    });
    lastCheckpoint = Date.now();
  };

  // Long runs of requests inside a single stage save through this rather than
  // taking the checkpoint as a parameter down three levels of helper.
  if (!rebuild) state.saveFacts = checkpoint;

  state.offline = rebuild;

  // The catalog is the one fact a legacy row cache cannot yield, so a rebuild
  // fetches it once if it is missing and then goes back offline.
  if (rebuild && !catalogFromRaw().size) {
    if (!key) {
      state.offline = false;
      throw new Error(
        "Rebuild needs the weapon/armor catalog and none is saved. Add an API key, " +
        "or press Load data once to seed it."
      );
    }
    status(`${owner.name}: seeding the weapon/armor catalog (2 requests)...`);
    setKeyPhase(key, "catalog seed");
    state.offline = false;
    await getEquipmentCatalog(key);
    state.offline = true;
  }

  status(`${owner.name}: loading weapon and armor catalog...`);
  setKeyPhase(key, "weapon/armor catalog");
  const catalog = await getEquipmentCatalog(key);
  state.itemsById = catalog;
  state.equipmentIds = new Set(catalog.keys());
  ownerDebug.catalog = { count: catalog.size, itemsById: catalog, itemIds: [...catalog.keys()] };
  if (!catalog.size) throw new Error("No Weapon or Armor items were returned by /torn/items.");

  // Cache prices set what a Bunker Buck is worth. Cheap, and kept as facts.
  setKeyPhase(key, "bunker cache prices");
  try {
    await getItemMarketValues(Object.keys(BUNKER_CACHE_COST).map(Number), key);
  } catch (err) {
    console.error(err);
  }

  // Current item market listings are live state rather than a stated fact, so a
  // rebuild leaves whatever is already on the Item Market Listings tab alone.
  if (!rebuild) {
  status(`${owner.name}: loading item market listings...`);
  setKeyPhase(key, "item market listings");
  try {
    const marketRows = await loadItemMarket(key, owner, ownerDebug);
    setKeyRowStatus(keyRow, `${owner.name} - ${marketRows.length} market listings`);
  } catch (err) {
    console.error(err);
    status(`${owner.name}: item market listings failed - ${err?.message || err}`, true);
  }
  }
  render();

  for (let i = 0; i < LOGS.length; i++) {
    const spec = LOGS[i];
    if (spec.trade) continue;
    if (!spec.id) continue;

    // A rebuild reads every saved entry for the log, so there is no watermark.
    // A log whose saved facts are known to be partial gets one full re-walk.
    const logStale = Number(activeRaw().logSync?.[spec.id] || 1) <
      Number(LOG_SYNC_VERSIONS[spec.id] || 1);
    const fromTimestamp = (rebuild || logStale)
      ? null
      : (Number(watermarks[spec.key] || 0) || null);
    if (logStale && !rebuild) {
      status(`${owner.name}: re-reading full ${spec.label} history...`);
    }
    const resuming = Number(activeRaw().logCursors?.[String(spec.id)] || 0);
    status(resuming && !rebuild
      ? `${owner.name}: resuming ${spec.label} where the last load stopped...`
      : `${owner.name}: loading ${spec.label} (${i+1}/${LOGS.length})...`);
    setKeyPhase(
      key,
      `${spec.label} logs${resuming ? ` resumed at ${resuming}` : ""}` +
      `${fromTimestamp ? ` from ${fromTimestamp}` : ""}`
    );

    const logs = await getAllLogEntries(spec.id, key, fromTimestamp);
    const newestSourceTimestamp = logs.reduce(
      (m, log) => Math.max(m, Number(log?.timestamp || 0)),
      Number(watermarks[spec.key] || 0)
    );
    watermarks[spec.key] = newestSourceTimestamp;

    const extracted = logs.flatMap(log => extractRowsFromLog(log, catalog, spec));
    // A log that names its items only by UID cannot be judged until the item
    // details arrive, so those rows are held back rather than dropped.
    const keep = row => spec.uidOnly ? !!row.uid : isEquipmentRow(row, catalog);
    const accepted = extracted.filter(keep);
    const rejected = extracted.filter(row => !keep(row));
    let rows = accepted;

    ownerDebug[spec.key] = {
      logId: spec.id,
      label: spec.label,
      fromTimestamp,
      rawLogCount: logs.length,
      rawLogs: logs,
      shapes: logs.slice(0, 20).map(summarizeLogShape),
      extractedCount: extracted.length,
      extractedRows: extracted,
      acceptedCount: accepted.length,
      rejectedCount: rejected.length,
      rejectedItemIds: [...new Set(rejected.map(r => r.itemId).filter(x => x !== null))]
    };

    const detailUids = rows.filter(r => r.uid).map(r => r.uid);
    if (detailUids.length) {
      status(`${owner.name} / ${spec.label}: loading details for ${new Set(detailUids).size} unique items...`);
      setKeyPhase(key, `${spec.label} itemdetails`);
      const detailMap = await getDetailsForUids(detailUids, key);
      rows = rows.map(r => r.uid ? mergeDetails(r, detailMap.get(String(r.uid))) : r);
    }

    const beforeRarityFilter = rows.length;
    const allowedRarities = new Set(["yellow", "orange", "red"]);
    rows = rows.filter(r =>
      r.uid &&
      allowedRarities.has(String(r.rarity ?? "").toLowerCase()) &&
      // Now that the details are in, a UID-only row can be checked properly.
      (!spec.uidOnly || isEquipmentRow(r, catalog))
    );

    for (const row of rows) {
      row.ownerId = ownerId;
      row.owner = owner.name;
      row.rowKey = `${ownerId}:${row.rowKey}`;

      if (rowAcceptsManualPrice(spec.key, row)) {
        row.price = state.manualPrices.has(row.rowKey)
          ? state.manualPrices.get(row.rowKey)
          : null;
      }
    }

    setKeyPhase(key, `${spec.label} user-name resolution`);
    await resolvePeople(rows, key);

    setKeyPhase(key, `${spec.label} flow resolution`);
    await finalizeRowFlow(rows, spec, owner, key);

    // The exchange pays in Bucks; the money figure is today's cache rate.
    if (spec.key === "bunkerSells") priceBunkerSellRows(rows);

    // A weapon out of a cache is worth what the cache cost.
    if (spec.key === "caches") priceCacheRows(rows, owner);

    ownerDebug[spec.key].beforeRarityFilterCount = beforeRarityFilter;
    ownerDebug[spec.key].rarityFilteredOutCount = beforeRarityFilter - rows.length;
    ownerDebug[spec.key].finalRows = rows;
    ownerDebug[spec.key].finalCount = rows.length;

    if (!rebuild && LOG_SYNC_VERSIONS[spec.id]) {
      activeRaw().logSync = {
        ...(activeRaw().logSync || {}),
        [spec.id]: LOG_SYNC_VERSIONS[spec.id]
      };
    }

    const existingOwnerRows = (state.rows[spec.key] || []).filter(
      r => String(r.ownerId ?? "") === ownerId
    );
    const mergedOwnerRows = mergeRowsByKey(existingOwnerRows, rows);

    state.rows[spec.key] = [
      ...(state.rows[spec.key] || []).filter(r => String(r.ownerId ?? "") !== ownerId),
