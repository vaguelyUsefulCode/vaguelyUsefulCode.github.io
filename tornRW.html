      ...mergedOwnerRows
    ];
    render();
    if (!rebuild) await checkpoint({ force: true });
  }

  // Trades use their own source watermark, since many completed trades do not
  // contain qualifying weapons/armour and therefore never become table rows.
  // Bunker purchases say what a cache cost in Bucks, and pair with the cache
  // openings that produced weapons.
  setKeyPhase(key, "bunker purchases");
  try {
    const bunkerFrom = rebuild ? null : (Number(watermarks.bunkerBuy || 0) || null);
    const bunkerLogs = await getAllLogEntries(BUNKER_BUY_LOG, key, bunkerFrom);
    watermarks.bunkerBuy = bunkerLogs.reduce(
      (m, log) => Math.max(m, Number(log?.timestamp || 0)),
      Number(watermarks.bunkerBuy || 0)
    );
    if (!rebuild) await checkpoint({ force: true });
  } catch (err) {
    console.error(err);
  }

  // Parcel contents, read once and then kept as facts. Cheap: a couple of pages.
  const parcelFrom = rebuild ? null : (Number(watermarks.parcelCreate || 0) || null);
  setKeyPhase(key, "parcel contents");
  status(`${owner.name}: reading parcel contents...`);
  try {
    const parcelLogs = await getAllLogEntries(PARCEL_CREATE_LOG, key, parcelFrom);
    watermarks.parcelCreate = parcelLogs.reduce(
      (m, log) => Math.max(m, Number(log?.timestamp || 0)),
      Number(watermarks.parcelCreate || 0)
    );

    const parcelRows = buildParcelSentRows(owner);
    await resolvePeople(parcelRows, key);
    await finalizeRowFlow(parcelRows, { key: "itemsSent" }, owner, key);
    for (const row of parcelRows) {
      row.price = state.manualPrices.has(row.rowKey)
        ? state.manualPrices.get(row.rowKey)
        : null;
    }

    ownerDebug.parcels = {
      parcelLogCount: Object.keys(activeRaw().logEntries[String(PARCEL_CREATE_LOG)] || {}).length,
      derivedRows: parcelRows
    };

    const existingSent = (state.rows.itemsSent || []).filter(
      r => String(r.ownerId ?? "") === ownerId
    );
    state.rows.itemsSent = [
      ...(state.rows.itemsSent || []).filter(r => String(r.ownerId ?? "") !== ownerId),
      ...mergeRowsByKey(existingSent, parcelRows)
    ];
    render();
    if (!rebuild) await checkpoint({ force: true });
  } catch (err) {
    console.error(err);
    status(`${owner.name}: parcel contents failed - ${err?.message || err}`, true);
  }

  // Every log is in, so the bunker chain can be followed: a weapon exchanged
  // for Bucks is worth its share of whatever the cache those Bucks bought
  // actually fetched, rather than a cache's market value.
  try {
    const { values, openedCost } = bunkerChainValues();
    for (const row of state.rows.bunkerSells || []) {
      if (String(row.ownerId ?? "") !== ownerId) continue;
      const resolved = values.get(String(row.uid));
      if (!resolved) continue;
      row.price = resolved.value;
      row.chainValued = true;
      // Part of this weapon's Bucks are still unaccounted for and valued at
      // today's rate, so the figure is not wholly a record of what was got.
      row.bunkerEstimated = resolved.basis === "part-chain";
      row.bunkerPartial = resolved.basis === "part-chain"
        ? { resolved: resolved.resolvedBucks, estimated: resolved.estimatedBucks }
        : null;
    }
    for (const row of state.rows.caches || []) {
      if (String(row.ownerId ?? "") !== ownerId) continue;
      const cost = openedCost.get(String(row.uid));
      if (cost === undefined) continue;
      row.price = cost;
      row.chainValued = true;
      row.cacheEstimated = false;
    }
    ownerDebug.bunkerChain = { valued: values.size, costed: openedCost.size };
  } catch (err) {
    console.error(err);
  }

  // Trades saved before the pagination fix stop at the 100 most recent, so the
  // first load after it re-walks the lot. Already-saved trades cost nothing -
  // their details come from the fact store.
  const tradeSyncStale = Number(activeRaw().tradeSyncVersion || 1) < TRADE_SYNC_VERSION;
  if (tradeSyncStale && !rebuild) {
    status(`${owner.name}: re-reading full trade history (saved trades were truncated)...`);
  }
  const tradeFrom = (rebuild || tradeSyncStale) ? null : (tradeWatermark || null);

  setKeyPhase(key, `trades${tradeFrom ? ` from ${tradeFrom}` : " (full history)"}`);
  const tradeRows = await loadTradeRows(owner, key, ownerDebug, tradeFrom);
  if (!rebuild) activeRaw().tradeSyncVersion = TRADE_SYNC_VERSION;

  const existingBuys = (state.rows.tradeBuys || []).filter(r => String(r.ownerId ?? "") === ownerId);
  const existingSells = (state.rows.tradeSells || []).filter(r => String(r.ownerId ?? "") === ownerId);
  const mergedBuys = mergeRowsByKey(existingBuys, tradeRows.buys);
  const mergedSells = mergeRowsByKey(existingSells, tradeRows.sells);

  state.rows.tradeBuys = [
    ...(state.rows.tradeBuys || []).filter(r => String(r.ownerId ?? "") !== ownerId),
    ...mergedBuys
  ];
  state.rows.tradeSells = [
    ...(state.rows.tradeSells || []).filter(r => String(r.ownerId ?? "") !== ownerId),
    ...mergedSells
  ];

  const rawTradeTimestamps = ownerDebug.trades?.rawTrades || [];
  tradeWatermark = rawTradeTimestamps.reduce(
    (m, trade) => Math.max(m, Number(val(trade?.completed_at, trade?.timestamp) || 0)),
    tradeWatermark || 0
  );

  // Cache processed rows for this owner plus source watermarks. The next page
  // session still starts visually empty; these rows are restored only on Load.
  setKeyPhase(key, "saving IndexedDB cache");
  await checkpoint({ force: true });

  state.saveFacts = null;
  ownerDebug.requests = requestBudgetReport(key);
  console.log(`[Torn requests] ${owner.name}: ${ownerDebug.requests.total} API calls`);
  console.table(ownerDebug.requests.byPhase);
  ownerDebug.rawStats = rawStoreStats(state.raw);
  state.offline = false;
  render();

  const ownerTotal = LOGS.reduce(
    (n, spec) => n + (state.rows[spec.key] || []).filter(r => String(r.ownerId) === ownerId).length,
    0
  );
  status(rebuild
    ? `${owner.name}: rebuilt ${ownerTotal} entries from saved data.`
    : `${owner.name}: done. ${ownerTotal} matching weapon/armor entries loaded.`);
  setKeyRowStatus(keyRow, `${owner.name} — ${rebuild ? "rebuilt" : "loaded"}`);
  setPerKeyStatus(key, rebuild ? "Rebuilt" : "Loaded");
  return owner;
}

// Re-derives every table from the saved facts. This runs automatically on every
// page load, so it must not touch the network: `allowCatalogFetch` is only set
// when a person asks for a rebuild explicitly and a legacy cache has no catalog
// of its own saved yet.
async function rebuildAllFromSaved(options={}) {
  const allowCatalogFetch = options.allowCatalogFetch === true;
  const quiet = options.quiet === true;

  const records = (await getAllOwnerCaches()).filter(r => !r?.inactive);
  if (!records.length) {
    if (!quiet) status("Nothing is saved yet - press Load data first.", true);
    return 0;
  }

  for (const record of records) {
    if (record?.ownerId === null || record?.ownerId === undefined) continue;
    state.loadedOwners.set(String(record.ownerId), record.ownerName || String(record.ownerId));
  }
  invalidateOwnerDefaults();

  const key = allowCatalogFetch ? ((readSavedKeys() || [])[0] || null) : null;
  let rebuilt = 0;

  try {
    return await runExclusive(async () => {
    for (const record of records) {
      const name = record.ownerName || record.ownerId;
      status(`Rebuilding ${name} from saved data...`);
      await loadAll(key, null, {
        rebuild: true,
        ownerId: record.ownerId,
        ownerName: record.ownerName
      });
      rebuilt += 1;
    }
    if (!quiet) {
      status(`Rebuilt ${rebuilt} owner${rebuilt === 1 ? "" : "s"} from saved data. No logs were re-pulled.`);
    }
    return rebuilt;
    });
  } finally {
    state.offline = false;
    render();
  }

  return rebuilt;
}

// Manual escape hatch: allowed the two catalog requests a legacy cache needs.
window.tornRebuild = async () => {
  try {
    return await rebuildAllFromSaved({ allowCatalogFetch: true });
  } catch (err) {
    console.error(err);
    status(err?.message || String(err), true);
    return 0;
  }
};

// Reports what is saved, without touching it.
window.tornSavedFacts = async function() {
  const records = await getAllOwnerCaches();
  const report = records.map(r => ({
    owner: r.ownerName || r.ownerId,
    savedAt: new Date(r.savedAt).toLocaleString(),
    hasRawStore: !!r.raw?.version,
    ...rawStoreStats(r.raw?.version ? r.raw : rawFromLegacyRows(r))
  }));
  console.table(report);
  return report;
};

function readSavedKeys() {
  try {
    const parsed = JSON.parse(localStorage.getItem("tornApiKeys") || "[]");
    if (Array.isArray(parsed) && parsed.length) return parsed.filter(Boolean);
  } catch (_) {}

  const legacy = getCookie("tornApiKeys");
  if (legacy) {
    try {
      const parsed = JSON.parse(decodeURIComponent(legacy));
      if (Array.isArray(parsed)) {
        const keys = parsed.filter(Boolean);
        localStorage.setItem("tornApiKeys", JSON.stringify(keys));
        return keys;
      }
    } catch (_) {}
  }

  const legacySingle = getCookie("tornApiKey");
  if (legacySingle) {
    const key = decodeURIComponent(legacySingle);
    if (key) {
      localStorage.setItem("tornApiKeys", JSON.stringify([key]));
      return [key];
    }
  }
  return [];
}

function saveKeys() {
  const keys = [...document.querySelectorAll(".api-key-input")]
    .map(input => input.value.trim())
    .filter(Boolean);
  localStorage.setItem("tornApiKeys", JSON.stringify(keys));
}

function refreshRemoveButtons() {
  const rows = [...document.querySelectorAll(".key-row")];
  rows.forEach((row, i) => {
    const btn = row.querySelector(".remove-key-btn");
    if (btn) btn.style.display = i === 0 ? "none" : "";
  });
}

function addKeyRow(initialKey="") {
  const rows = document.getElementById("keyRows");
  const row = document.createElement("div");
  row.className = "key-row";
  row.innerHTML = `
    <input class="api-key-input" type="password" autocomplete="off" placeholder="Torn API key" value="${escInput(initialKey)}">
    <button class="load-key-btn" type="button">Load data</button>
    <button class="remove-key-btn" type="button">Remove</button>
    <span class="key-owner"></span>
    <span class="key-status"></span>
  `;

  const input = row.querySelector(".api-key-input");
  const button = row.querySelector(".load-key-btn");
  const removeButton = row.querySelector(".remove-key-btn");

  input.addEventListener("change", saveKeys);
  removeButton.addEventListener("click", () => {
    row.remove();
    saveKeys();
    refreshRemoveButtons();
  });
  button.addEventListener("click", async () => {
    const key = input.value.trim();
    if (!key) return;

    saveKeys();
    setLoadingUi(true);
    try {
      // The startup rebuild runs offline; letting a live load overlap it would
      // trip the offline guard, and two live loads would corrupt each other.
      await state.startupRebuild;
      await runExclusive(() => loadAll(key, row));
    } catch (err) {
      console.error(err);
      status(err?.message || String(err), true);
      setKeyRowStatus(row, err?.message || String(err), true);
      const keyState = getKeyRequestState(key);
      setPerKeyStatus(key, err?.message || String(err), true);
    } finally {
      state.saveFacts = null;
      setLoadingUi(false);
    }
  });

  rows.appendChild(row);
  refreshRemoveButtons();
}

document.getElementById("addKeyBtn").addEventListener("click", () => {
  addKeyRow("");
});

// Every account with something saved, and a way to drop one. Loading a second
// person's key to try the viewer out should not mean living with their weapons
// in your tables for ever.
async function renderSavedDataPanel() {
  const panel = document.getElementById("savedDataPanel");
  if (!panel) return;

  let records = [];
  try {
    records = await getAllOwnerCaches();
  } catch (err) {
    panel.innerHTML = `<div>Saved data could not be read: ${esc(err?.message || String(err))}</div>`;
    return;
  }

  panel.innerHTML = (records.length
    ? records.map(record => {
    const id = String(record.ownerId);
    const weapons = new Set();
    for (const spec of LOGS) {
      for (const row of record?.rows?.[spec.key] || []) {
        if (row?.uid) weapons.add(String(row.uid));
      }
    }
    const facts = rawStoreStats(record.raw);
    const saved = record.savedAt ? formatDate(Math.round(record.savedAt / 1000)) : "unknown";

    const aside = record.inactive === true;

    return `<div class="saved-owner${aside ? " is-aside" : ""}">
      <span>
        <span class="saved-owner-name">${esc(record.ownerName || id)}` +
        `${aside ? ` <span class="aside-tag">set aside</span>` : ""}</span>
        <span class="saved-owner-detail">id ${esc(id)} · ${weapons.size} weapons · ` +
        `${facts.logEntries} log entries · ${facts.trades} trades · saved ${esc(saved)}</span>
      </span>
      <span class="saved-owner-actions">
        <button type="button" class="owner-action" data-export-owner="${esc(id)}"
          title="Save this account to a file">Export</button>
        <button type="button" class="owner-action" data-toggle-owner="${esc(id)}"
          title="${aside ? "Put this account back in the tables"
            : "Keep the data but leave this account out of the tables and out of shared ownership"}"
          >${aside ? "Bring back" : "Set aside"}</button>
        <button type="button" class="forget-owner" data-forget-owner="${esc(id)}"
          >Forget</button>
      </span>
    </div>`;
      }).join("")
    : `<div class="saved-owner"><span class="saved-owner-detail">` +
      `No account has been loaded in this browser yet.</span></div>`) +
    `<div class="saved-data-import">
      <button type="button" class="owner-action" id="importOwnerBtn"
        title="Load an account from a file exported here">Import from file</button>
    </div>` +
    `<div class="saved-data-stated">
      <span>
        <span class="saved-owner-name">My decisions</span>
        <span class="saved-owner-detail">${esc(statedFactSummary() ||
          "nothing set by hand yet")} · not kept per account</span>
      </span>
      <button type="button" class="forget-owner" id="resetStatedBtn"
        title="Clear the owners, prices, loans and returns you have set by hand"
        >Reset my decisions</button>
    </div>`;

  panel.querySelectorAll("[data-export-owner]").forEach(btn => {
    btn.addEventListener("click", () => {
      const record = records.find(r => String(r.ownerId) === btn.dataset.exportOwner);
      if (!record) return;
      exportOwnerRecord(record);
      status(`${record.ownerName || record.ownerId}: saved to a file.`);
    });
  });

  panel.querySelectorAll("[data-toggle-owner]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggleOwner;
      const record = records.find(r => String(r.ownerId) === id);
      const bringBack = record?.inactive === true;

      try {
        const name = await setOwnerActive(id, bringBack);
        await rebuildAllFromSaved({ quiet: true });
        status(bringBack
          ? `${name}: back in the tables.`
          : `${name}: set aside. Its data is kept, but it is out of the tables ` +
            `and no longer shares ownership.`);
      } catch (err) {
        console.error(err);
        status(`Could not change ${record?.ownerName || id}: ${err?.message || err}`, true);
      }
      await renderSavedDataPanel();
      render();
    });
  });

  document.getElementById("resetStatedBtn")?.addEventListener("click", async () => {
    const counts = statedFactCounts();
    if (!counts.total) {
      status("Nothing has been set by hand yet.");
      return;
    }
    if (!window.confirm(
      `Clear everything you have set by hand?\n\n${statedFactSummary()}.\n\n` +
      "The transactions themselves are untouched - only your decisions about " +
      "them go, and they cannot be fetched back from Torn."
    )) return;

    resetStatedFacts();
    status(`Cleared ${counts.total} decision${counts.total === 1 ? "" : "s"}.`);
    await renderSavedDataPanel();
    render();
  });

  const importBtn = document.getElementById("importOwnerBtn");
  const importInput = document.getElementById("importOwnerFile");
  if (importBtn && importInput) {
    importBtn.addEventListener("click", () => importInput.click());
  }

  panel.querySelectorAll("[data-forget-owner]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.forgetOwner;
      const record = records.find(r => String(r.ownerId) === id);
      const name = record?.ownerName || id;
      if (!window.confirm(
        `Forget everything saved for ${name}?\n\n` +
        "Their weapons, logs and trades are removed from this browser. " +
        "Loading their key again would pull it all back from Torn."
      )) return;

      let gone;
      try {
        gone = await forgetOwner(id);
      } catch (err) {
        console.error(err);
        status(`Could not forget ${name}: ${err?.message || err}`, true);
        return;
      }

      // Re-derive what is left from the records that remain, so the tables are
      // right without waiting for a reload. Costs no requests - and a rebuild
      // that cannot run does not mean the data is still there.
      try {
        const left = await rebuildAllFromSaved({ quiet: true });
        status(`${gone.name}: saved data forgotten. ` +
          (left ? `${left} account${left === 1 ? "" : "s"} left.` : "Nothing is saved now."));
      } catch (err) {
        console.error(err);
        status(`${gone.name}: saved data forgotten. Reload the page to rebuild the tables.`);
      }
      await renderSavedDataPanel();
      render();
    });
  });
}

document.getElementById("savedData")?.addEventListener("toggle", e => {
  if (e.target.open) renderSavedDataPanel();
});

document.getElementById("importOwnerFile")?.addEventListener("change", async e => {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;

  try {
    const imported = await importOwnerRecord(await file.text());
    await rebuildAllFromSaved({ quiet: true });
    status(`${imported.name}: imported from ${file.name}.`);
  } catch (err) {
    console.error(err);
    status(`Import failed: ${err?.message || err}`, true);
  }
  await renderSavedDataPanel();
  render();
});

const savedKeys = readSavedKeys();
if (savedKeys.length) {
  savedKeys.forEach(addKeyRow);
} else {
  addKeyRow("");
}

render();

// Every table is a pure function of the saved facts, so a page load re-derives
// them instead of showing empty tables until someone presses Load. Strictly
// offline: a reload never costs a request.
state.startupRebuild = (async () => {
  try {
    const rebuilt = await rebuildAllFromSaved({ quiet: true });
    migrateUidDecisions();
    if (rebuilt) {
      status(`Rebuilt ${rebuilt} owner${rebuilt === 1 ? "" : "s"} from saved data. ` +
        `Press Load data to pull anything new.`);
    }
  } catch (err) {
    console.error(err);
    status(
      /catalog/i.test(err?.message || "")
        ? "Saved data found, but no weapon/armor catalog is stored yet - " +
          "press Load data once and reloads will rebuild on their own."
        : (err?.message || String(err)),
      true
    );
  }
})();

</script>
