<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torn Equipment Log Viewer</title>
<style>
:root{
  --bg:#171610;
  --panel:#201e16;
  --panel2:#29261c;
  --border:#4a4432;
  --text:#e8e1ce;
  --muted:#a9a08a;
  --accent:#b49a63;
  --accent2:#d0b87c;
  --danger:#c77b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{max-width:1500px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:22px;margin:0 0 5px;font-weight:650}
.sub{color:var(--muted);margin-bottom:20px}
.controls{
  display:flex;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:14px;
  border-radius:7px;
}
.key-controls{align-items:flex-start}
.key-rows{display:grid;gap:8px;flex:1}
.key-row{
  display:grid;
  grid-template-columns:minmax(260px,1fr) auto auto auto;
  gap:8px;
  align-items:center;
}
.key-status{
  grid-column:1 / -1;
  color:var(--muted);
  font-size:12px;
  min-height:18px;
}
.key-owner{
  min-width:130px;
  max-width:320px;
  color:var(--muted);
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.add-key{
  min-width:128px;
  padding:9px 12px;
}
.remove-key-btn{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
}
@media(max-width:700px){
  .key-row{grid-template-columns:1fr auto}
  .key-owner{grid-column:1 / -1}
}
input,button,select{
  font:inherit;
  border-radius:5px;
  border:1px solid var(--border);
}
select{
  color:var(--text);
  background:#13120e;
  padding:5px 6px;
  outline:none;
  max-width:100%;
}
select:focus{border-color:var(--accent)}
input:not([type="checkbox"]){
  width:100%;
  padding:10px 11px;
  color:var(--text);
  background:#13120e;
  outline:none;
}
input:focus{border-color:var(--accent)}

/* Still a native checkbox - appearance:none just lets it wear the site's
   colours instead of the browser's. */
input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:13px;
  height:13px;
  min-width:13px;
  flex:0 0 auto;
  padding:0;
  margin:0;
  border:1px solid var(--border);
  border-radius:3px;
  background:#13120e;
  cursor:pointer;
  position:relative;
  vertical-align:middle;
}
input[type="checkbox"]:hover{border-color:var(--accent)}
input[type="checkbox"]:checked{
  background:var(--accent2);
  border-color:var(--accent2);
}
input[type="checkbox"]:checked::after{
  content:"";
  position:absolute;
  left:3px;
  top:0;
  width:4px;
  height:8px;
  border:solid #171610;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
input[type="checkbox"]:focus-visible{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(180,154,99,.35);
}
button{
  padding:9px 15px;
  color:#171610;
  background:var(--accent2);
  cursor:pointer;
  font-weight:650;
}
button:hover{background:#dec88f}
button:disabled{opacity:.55;cursor:not-allowed}
.status{
  min-height:22px;
  margin:12px 2px 4px;
  color:var(--muted);
}
.status.error{color:var(--danger)}
.tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin:17px 0 0;
  border-bottom:1px solid var(--border);
}
.tab{
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
  border-radius:0;
  padding:10px 12px;
  font-weight:600;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent2)}
.tab:hover{background:var(--panel);color:var(--text)}
.table-wrap{
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-top:0;
  min-height:420px;
}
table{width:100%;border-collapse:collapse;min-width:1100px}
#table.fixed-layout{table-layout:fixed;min-width:0}
/* Body cells clip, header cells must not: a filter menu opens out of one. */
#table.fixed-layout td{overflow:hidden;text-overflow:ellipsis}
#table.fixed-layout th{overflow:visible}
th,td{
  text-align:left;
  padding:9px 10px;
  border-bottom:1px solid #383426;
  white-space:nowrap;
}
th{
  position:sticky;top:0;
  background:var(--panel2);
  color:#cfc5ab;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .sort-indicator{margin-left:5px;color:var(--accent2)}
.filter-row th{
  top:34px;
  padding:5px 6px 7px;
  background:#242117;
}
.filter-row input:not([type="checkbox"]),.filter-row select{
  width:100%;
  min-width:0;
  max-width:100%;
  padding:6px 7px;
  font-size:12px;
  border-radius:3px;
}
tbody tr:hover{background:#262319}
.history-group{
  border-left:1px solid var(--border) !important;
  border-right:1px solid var(--border) !important;
  text-align:center;
}
#table tbody td.history-group{
  border-left:1px solid var(--border) !important;
  border-right:1px solid var(--border) !important;
}
th.history-group{
  border-top:1px solid var(--border) !important;
  border-bottom:1px solid var(--border) !important;
}
.history-group-start{border-left:3px solid var(--border) !important}
.history-group-0{background:#2d291e}
.history-group-1{background:#25231b}
.history-detail-header{border-left:1px solid var(--border) !important}
#table thead .history-subcell{
  border-left:1px solid var(--border) !important;
  border-right:1px solid var(--border) !important;
  box-shadow:inset 1px 0 0 var(--border), inset -1px 0 0 var(--border);
}
#table thead .history-subcell.history-group-start{
  border-left:3px solid var(--border) !important;
  box-shadow:inset 2px 0 0 var(--border), inset -1px 0 0 var(--border);
}
.history-date-sortable{cursor:pointer;user-select:none}
.history-date-sortable:hover{color:var(--text)}
th[rowspan="2"]{vertical-align:middle}
/* Deliberately unpositioned: a static block paints beneath positioned content,
   so an open filter menu hanging out of the header sits over it. */
.empty{padding:30px;color:var(--muted);text-align:center}
.count{color:var(--muted);font-weight:400;margin-left:5px}
.table-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  min-height:37px;
  padding:6px 0;
}
.table-actions button{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  padding:6px 10px;
  font-weight:600;
}
.row-action{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
  padding:4px 8px;
  font-weight:600;
}
.row-action:hover{color:var(--text);background:var(--panel2)}
.history-option{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px;
}
.state-filter{
  position:relative;
  font-size:13px;
}
/* The last left-hand dropdown pushes the checkboxes to the right. */
.state-filter+.state-filter{margin-right:auto}
.table-actions>.state-filter:last-of-type{margin-right:auto}
.state-filter>summary{
  display:flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
  list-style:none;
  color:var(--muted);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:5px;
  padding:5px 11px;
  font-weight:600;
  user-select:none;
}
.state-filter>summary::-webkit-details-marker{display:none}
.state-filter>summary::after{content:"▾";font-size:11px}
.state-filter[open]>summary{color:var(--text)}
.state-filter[open]>summary::after{content:"▴"}
.state-filter-panel{
  /* Inside a <th>, so the header's uppercase and tracking have to be undone. */
  text-transform:none;
  letter-spacing:normal;
  font-weight:400;
  color:var(--text);
  position:absolute;
  top:calc(100% + 5px);
  left:0;
  z-index:30;
  min-width:232px;
  display:grid;
  gap:3px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:9px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.state-option{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--text);
  padding:3px 4px;
  border-radius:4px;
  cursor:pointer;
  white-space:nowrap;
}
.state-option:hover{background:var(--panel2)}
.state-swatch{
  width:10px;
  height:10px;
  border-radius:2px;
  flex:0 0 auto;
}
.state-swatch.state-loaned-in{background:#6d8ab4}
.state-swatch.state-returned{background:#8c8c8c}
.state-swatch.state-listed{background:#d0a23c}
.state-swatch.state-sold{background:#74a157}
.state-swatch.state-faction{background:#9573b8}
.state-swatch.state-loaned-out{background:#59a391}
.state-swatch.state-inventory{background:#4a4432}
.state-filter-actions{
  display:flex;
  gap:6px;
  margin-top:5px;
  padding-top:7px;
  border-top:1px solid var(--border);
}
.state-filter-actions button{
  flex:1;
  background:var(--panel2);
  color:var(--muted);
  border:1px solid var(--border);
  padding:4px 8px;
  font-size:12px;
  font-weight:600;
}
.state-filter-actions button:hover{color:var(--text)}

/* The same menu, shrunk to sit inside a table header cell. */
.log-type-filter{font-size:11px;font-weight:400}
.log-type-filter>summary{
  padding:3px 6px;
  gap:4px;
  font-size:11px;
  justify-content:center;
}
.log-type-filter>summary::after{font-size:9px}
.state-filter[open]{z-index:40}
.log-type-panel{
  grid-template-columns:1fr 1fr;
  min-width:340px;
  max-height:min(50vh,230px);
  overflow:auto;
  z-index:40;
  font-size:12px;
  font-weight:400;
}
.log-type-panel .state-filter-actions{grid-column:1 / -1}
.log-type-panel .state-option{justify-content:flex-start;gap:6px}
.log-type-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.log-type-count{
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  font-size:11px;
}
.state-option.is-empty .log-type-name,
.state-option.is-empty .log-type-count{opacity:.45}
#table th.history-band{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.07em;
}
#table thead th:has(.log-type-filter[open]){z-index:40}
[data-th-sort]{cursor:pointer;user-select:none}
[data-th-sort]:hover{color:var(--text)}
.history-owner-cell{
  background:#383326 !important;
  color:var(--accent2);
  font-weight:700;
}
.funders{white-space:normal}
.funder{
  display:inline-flex;
  align-items:baseline;
  gap:5px;
  margin:0 8px 2px 0;
}
.funder-bb{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.row-note{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-top:1px;
}
.history-detail-label{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:2px;
}
/* Compound selector on purpose: .editable-price is declared after this and
   would otherwise impose its own 125px width on a 112px column, overflowing it
   and getting clipped. */
.editable-price.history-price{
  width:100%;
  min-width:0;
  font-size:11px;
  padding:4px 11px 4px 6px;
}
.editable-price{
  width:125px;
  min-width:110px;
  padding:6px 10px 6px 7px;
  background:#17150f;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.price-field{
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  width:100%;
}
/* Same box as the input it replaces, so swapping between them does not move
   the row. */
.price-shown{
  flex:1 1 auto;
  padding:3px 8px;
  border:1px dashed var(--border);
  border-radius:4px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.price-edit{
  flex:0 0 auto;
  background:transparent;
  border:0;
  padding:0 2px;
  color:var(--muted);
  font-size:13px;
  line-height:1;
  cursor:pointer;
}
.price-edit:hover{color:var(--accent)}
.no-price{color:var(--muted)}
/* The inventory's price column is narrower than the market's, so the box and
   the pencil are scaled to it. */
.price-field.history-field{gap:3px}
.price-shown.history-shown{font-size:11px;padding:2px 5px}
.price-edit.history-edit{font-size:11px}
.editable-price.market-price{
  width:100%;
  min-width:0;
  padding:3px 8px;
  border:1px solid var(--accent);
  border-radius:4px;
}
.trade-link{
  background:transparent;
  color:var(--accent2);
  border:0;
  padding:0;
  font:inherit;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
}
.trade-link:hover{text-decoration:underline}
.tx-name{display:block}
.uid-toggle-label{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-left:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  cursor:pointer;
  text-transform:none;
  letter-spacing:normal;
}
.uid-toggle-label:hover{color:var(--text)}
.uid-line{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
  cursor:pointer;
  text-transform:none;
  letter-spacing:normal;
}
.uid-line:hover{color:var(--accent2);text-decoration:underline}
.tx-trade{display:block;width:100%;margin:2px 0 0;text-align:inherit}
.modal{
  position:fixed;
  inset:0;
  background:rgba(8,7,4,.72);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow:auto;
  z-index:50;
}
.modal[hidden]{display:none}
.modal-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  width:100%;
  max-width:760px;
  box-shadow:0 18px 48px rgba(0,0,0,.55);
}
.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding:16px 18px 14px;
  border-bottom:1px solid var(--border);
}
.modal-title{font-size:17px;font-weight:650}
.trade-view-link{
  color:var(--accent2);
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  margin-left:9px;
}
.trade-view-link:hover{text-decoration:underline}
.modal-sub{color:var(--muted);font-size:13px;margin-top:3px}
.modal-wide{max-width:980px}
.modal-back{
  display:inline-block;
  margin-bottom:7px;
  padding:3px 9px;
  background:transparent;
  color:var(--accent2);
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.modal-back:hover{border-color:var(--accent2)}

/* A weapon's whole history. The cells are the table's own, so a price is
   edited here exactly as it is there. */
.item-history{padding:4px 6px 10px;overflow-x:auto}
.holding-section{
  margin:10px 0 14px;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}
.holding-section.is-unresolved{border-color:#8a6d3b}
.holding-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:8px 10px;
  background:var(--panel2);
  border-bottom:1px solid var(--border);
}
.holding-title{font-size:12px;font-weight:650}
.holding-note{
  margin-left:8px;
  color:var(--muted);
  font-size:11px;
  font-weight:400;
  text-transform:none;
}
.holding-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.holding-owner{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
}
.holding-mark{
  padding:3px 9px;
  border:1px solid var(--border);
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
  white-space:nowrap;
}
.holding-mark:hover{border-color:var(--accent2);color:var(--text)}
.holding-mark.is-active{border-color:var(--accent2);color:var(--accent2)}
.holding-mark-cell{width:96px;text-align:right}
.item-history-table tr.is-outcome td{background:#232014}
.inline-action.is-unresolved{border-color:#8a6d3b;color:#d2a65a}
.item-history-table{width:100%;min-width:0;border-collapse:collapse}
.item-history-table th{
  position:static;
  background:transparent;
  border-bottom:1px solid var(--border);
  padding:8px 10px;
}
.item-history-table td{
  padding:8px 10px;
  border-bottom:1px solid #2c2819;
  vertical-align:top;
}
.item-history-table tbody tr:last-child td{border-bottom:0}
.item-history-table .history-party{white-space:normal;overflow-wrap:break-word}

/* The item name as the way into its history. */
.item-history-link{
  background:transparent;
  border:0;
  padding:0;
  font:inherit;
  color:inherit;
  text-align:left;
  cursor:pointer;
}
.item-history-link:hover{color:var(--accent2);text-decoration:underline}
.modal-close{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  padding:3px 9px;
  font-size:15px;
  line-height:1.2;
  flex:0 0 auto;
}
.receipt-sides{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--border);
}
.receipt-side{background:var(--panel);padding:14px 18px 18px}
.receipt-party{
  font-weight:650;
  padding-bottom:9px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.receipt-you{color:var(--accent2)}
.receipt-list{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.receipt-item-name{font-weight:600}
.receipt-item-meta{color:var(--muted);font-size:11.5px;margin-top:1px}
.receipt-money{font-variant-numeric:tabular-nums}
.receipt-nothing{color:var(--muted);font-style:italic}
.rarity-yellow{color:#e8d12e}
.rarity-orange{color:#e8911e}
.rarity-red{color:#e8564a}
@media(max-width:640px){
  .receipt-sides{grid-template-columns:1fr}
}
tr.market-live td{background:#1a2218}
tr.market-live td:first-child{box-shadow:inset 3px 0 0 #74a157}
tr.market-draft td{background:#1b1f27}
tr.market-draft td:first-child{box-shadow:inset 3px 0 0 #6d8ab4}
.market-legend{
  display:flex;
  align-items:center;
  gap:14px;
  color:var(--muted);
  font-size:13px;
}
.legend-chip{display:inline-flex;align-items:center;gap:6px}
.legend-dot{
  width:10px;
  height:10px;
  border-radius:2px;
  display:inline-block;
  flex:0 0 auto;
}
.legend-live{background:#74a157}
.legend-draft{background:#6d8ab4}
.add-market,.inline-action{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
  padding:1px 6px;
  margin-left:8px;
  font-size:11px;
  font-weight:600;
  border-radius:3px;
}
.add-market:hover:not(:disabled),.inline-action:hover:not(:disabled){
  color:var(--text);
  background:var(--panel2);
}
.add-market:disabled,.inline-action:disabled{opacity:.5}
.inline-action.is-active{
  color:#171610;
  background:var(--accent2);
  border-color:var(--accent2);
}
.inline-action.is-active:hover{color:#171610;background:var(--accent)}

.owner-select{min-width:120px;font-size:12px}
.owner-id-input{
  width:96px;
  min-width:80px;
  margin-top:4px;
  padding:4px 6px;
  font-size:12px;
}

/* Weapon state, shown only as colour. The history columns paint their own cell
   backgrounds, so the left edge marker carries the signal across the whole row. */
tr.state-loaned-in td{background:#1b1f27}
tr.state-loaned-in td:first-child{box-shadow:inset 3px 0 0 #6d8ab4}
tr.state-returned td{background:#1d1d1d}
tr.state-returned td:first-child{box-shadow:inset 3px 0 0 #8c8c8c}
tr.state-listed td{background:#262013}
tr.state-listed td:first-child{box-shadow:inset 3px 0 0 #d0a23c}
tr.state-sold td{background:#1a2218}

<body>
<main>
  <h1>Torn Equipment Log Viewer</h1>
  <div class="sub">Weapon and armor entries only. Keys and everything pulled with them stay
    in this browser - nothing is sent anywhere but Torn's API.</div>

  <div class="controls key-controls">
    <div class="key-control-main">
      <div id="keyRows" class="key-rows"></div>
      <a class="custom-key-link" href="https://www.torn.com/preferences.php#tab=api?step=addNewKey&user=basic,itemmarket,trade,trades,log&logIds=11,15,18,75,80,84,85,88,214&torn=itemdetails,items&title=TransactionKey" target="_blank" rel="noopener noreferrer">Create Custom Key</a>
    </div>
    <button id="addKeyBtn" class="add-key" type="button">Add another key</button>
  </div>

  <details class="saved-data" id="savedData">
    <summary>Saved data</summary>
    <div class="saved-data-panel" id="savedDataPanel"></div>
    <input type="file" id="importOwnerFile" accept="application/json,.json" hidden>
  </details>
  <div id="status" class="status"></div>

  <div id="tabs" class="tabs"></div>
  <div id="tableActions" class="table-actions"></div>
  <div id="exportPanel" class="export-panel"></div>
  <div class="table-wrap">
    <table id="table">
      <thead></thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty">Enter an API key and load data.</div>
  </div>
</main>

<div id="modal" class="modal" hidden></div>

<script>
const API = "https://api.torn.com/v2/";

const LOGS = [
  { id: 2615, key: "caches", label: "Caches", thLabel: "Cache", partyLabel: null },
  { id: 4320, key: "auctionWins", label: "Auction House Wins", thLabel: "AH Win", partyLabel: "Seller" },
  { id: 1112, key: "imBuys", label: "IM Buys", thLabel: "IM Buy", partyLabel: "Seller" },
  { id: 1225, key: "bazaarBuys", label: "Bazaar Buys", thLabel: "Bazaar Buy", partyLabel: "Seller" },
  { id: null, key: "tradeBuys", label: "Trades (Buys)", thLabel: "Trade Buy", trade: true, partyLabel: "Seller" },
  { id: 4322, key: "auction", label: "Auction House Sells", thLabel: "AH Sell", partyLabel: "Buyer" },
  { id: 1113, key: "marketSells", label: "IM Sells", thLabel: "IM Sell", partyLabel: "Buyer" },
  { id: 1226, key: "bazaarSells", label: "Bazaar Sells", thLabel: "Bazaar Sell", partyLabel: "Buyer" },
  { id: null, key: "tradeSells", label: "Trades (Sells)", thLabel: "Trade Sell", trade: true, partyLabel: "Buyer" },
  { id: 6728, key: "factionDeposit", label: "Deposited in Armoury", thLabel: "Deposited in Armoury", partyLabel: "Faction" },
  { id: 6733, key: "factionGiven", label: "Given from Armoury", thLabel: "Given from Armoury", partyLabel: "Sender / Faction" },
  { id: 4102, key: "itemsSent", label: "Items Sent", thLabel: "Sent", partyLabel: "Receiver" },
  { id: 4103, key: "itemsReceived", label: "Items Received", thLabel: "Received", partyLabel: "Sender" },
  { id: 1500, key: "bunkerSells", label: "Bunker Sells", thLabel: "Bunker Sell",
    partyLabel: "Exchange", uidOnly: true }
];
// Parcel contents are not a tab of their own: a weapon inside a parcel that was
// posted off is an Item Send like any other, so log 4000 is read purely as a
// source for those rows.
const PARCEL_CREATE_LOG = 4000;
const BUNKER_BUY_LOG = 1501;
const CACHE_USE_LOG = 2615;
const ITEM_MARKET_BUY_LOG = 1112;
const BAZAAR_BUY_LOG = 1225;
const ITEM_SEND_LOG = 4102;

// Big Al's Bunker, per the wiki. Bunker Bucks are earned by exchanging weapons
// and spent on caches, which gives them a money value: the best rate any cache
// offers. Columns are rarity, and for orange and red whether the weapon carries
// two effects. Armour has no two-effect price, so it falls back to one.
const BUNKER_RATES = {
  "pistol":          { yellow: 4,  orange: 12, orange2: 18,   red: 36,  red2: 54 },
  "smg":             { yellow: 4,  orange: 12, orange2: 18,   red: 36,  red2: 54 },
  "clubbing":        { yellow: 6,  orange: 18, orange2: 27,   red: 54,  red2: 81 },
  "piercing":        { yellow: 6,  orange: 18, orange2: 27,   red: 54,  red2: 81 },
  "slashing":        { yellow: 6,  orange: 18, orange2: 27,   red: 54,  red2: 81 },
  "shotgun":         { yellow: 10, orange: 30, orange2: 45,   red: 90,  red2: 135 },
  "rifle":           { yellow: 10, orange: 30, orange2: 45,   red: 90,  red2: 135 },
  "armor":           { yellow: 12, orange: 26, orange2: null, red: 108, red2: null },
  "machine gun":     { yellow: 14, orange: 42, orange2: 63,   red: 126, red2: 189 },
  "heavy artillery": { yellow: 14, orange: 42, orange2: 63,   red: 126, red2: 189 }
};

// The rarities this tool is about. White equipment is ordinary stock and is
// left out of every table.
const QUALIFYING_RARITIES = new Set(["yellow", "orange", "red"]);

const BUNKER_PARTY = "Big Al's Bunker";

// Cache item id -> what it costs in Bunker Bucks.
const BUNKER_CACHE_COST = { 1118: 60, 1119: 30, 1120: 20, 1121: 50, 1122: 70 };

const SUMMARY_TAB = { key: "uniqueItems", label: "RW Inventory" };
const MARKET_TAB = { key: "itemMarket", label: "Currently Selling" };
const CACHE_TAB = { key: "cacheSells", label: "Cache Sells" };

const state = {
  active: "uniqueItems",
  rows: Object.fromEntries(LOGS.map(x => [x.key, []])),
  equipmentIds: new Set(),
  itemsById: new Map(),

  itemDetailsDebug: [],

  // What a person has decided about each holding. Keyed by the rowKey of the
  // transaction the holding opens with; the value is either the rowKey of the
  // transaction that ended it, or "open" for one considered and still running.
  // No entry at all means nobody has looked yet - which is what the unresolved
  // filter is for. See buildHoldingRows.
  holdingOutcome: new Map(Object.entries(
    JSON.parse(localStorage.getItem("tornHoldingOutcome") || "{}"))),
  // Who held a weapon for one stretch of its life, same key.
  holdingOwners: new Map(Object.entries(
    JSON.parse(localStorage.getItem("tornHoldingOwners") || "{}"))),
  // Lazily filled from storage: ITEM_STATES is declared further down.
  stateFilter: null,
  stateFilterOpen: false,
  // Per-column Type filters for the buy end and the sell end of a weapon's life.
  logTypeFilters: { firstLog: null, outcome: null },
  logTypeFilterOpen: { firstLog: false, outcome: false },
  hideStatColumns: localStorage.getItem("tornHideStatColumns") === "1",
  showBunkerProfit: localStorage.getItem("tornShowBunkerProfit") === "1",
  showUids: localStorage.getItem("tornShowUids") === "1",
  unresolvedOnly: localStorage.getItem("tornUnresolvedOnly") === "1",
  transactionFilters: {},
  transactionSort: { field: "firstLogTimestamp", dir: "desc" },
  userNameCache: new Map(),
  userNamePromises: new Map(),
  loadedOwners: new Map(),
  manualPrices: new Map(Object.entries(JSON.parse(localStorage.getItem("tornManualPrices") || "{}"))),
  itemMarketValueCache: new Map(),
  itemNameCache: new Map(),
  raw: null,
  offline: false,
  factionNameCache: new Map(),
  factionNamePromises: new Map(),
  marketRows: [],
  marketFilters: {},
  marketSort: { field: "price", dir: "desc" },
  marketLoading: false,
  marketManualRows: readStoredArray("tornMarketManualRows"),
  startupRebuild: null,
  ownerIndex: null,
  keyHolderIds: null,
  loadChain: null,
  loadBusy: false,
  // What is open, innermost last. See the modal section.
  modalStack: [],
  // ownerId -> that account's fact store, for the tables that span accounts.
  factStores: new Map(),
  // Which manual market price is open for editing, if any.
  editingMarketPrice: null,
  // Same, for a transaction price on the RW Inventory tab.
  editingPriceRow: null,
  saveFacts: null,   // set while a live load is running; see loadAll
  marketForumHtml: "",
  forumEditOpen: false,
  // The bonus-attachment-* stat icons are class-driven sprites and meet the same
  // fate as the glow on publish, so text labels are the default.
  marketForumTextLabels: localStorage.getItem("tornMarketForumTextLabels") !== "0"
};

// Debug data is intentionally exposed in the browser console.
// After loading, run `tornDebug` or e.g. `tornDebug.auction.rawLogs[0]`.
window.tornDebug = { catalog: null };


window.tornDebug = window.tornDebug || {};
window.getInvalidItemUids = function() {
  return state.itemDetailsDebug
    .filter(x => x?.status === "invalid_uid")
    .map(x => ({ uid: x.requestedUids?.[0] ?? null, error: x.error ?? "" }));
};

// Every UID the API would not resolve, matched back to the log entry that asked
// for it. Reads only what is already saved - it makes no requests.
window.tornBadUids = function() {
  const bad = new Map();
  for (const entry of state.itemDetailsDebug) {
    if (entry?.status !== "invalid_uid") continue;
    const uid = String(entry.requestedUids?.[0] ?? "");
    if (uid) bad.set(uid, entry.error ?? "");
  }
  for (const [uid, record] of Object.entries(activeRaw().itemDetails || {})) {
    if (record?.unresolved && !bad.has(uid)) bad.set(uid, "recorded as unresolvable");
  }

  // Find the log entry each one came from, so the item and date are visible.
  const sources = new Map();
  for (const [logId, bucket] of Object.entries(activeRaw().logEntries || {})) {
    for (const logEntry of Object.values(bucket || {})) {
      const data = logEntry?.data || {};
      const items = Array.isArray(data.items)
        ? data.items
        : (data.item && typeof data.item === "object"
          ? Object.entries(data.item).map(([uid, qty]) => ({ uid, qty }))
          : []);
      for (const item of items) {
        const uid = String(val(item?.uid, item?.unique_id) ?? "");
        if (!uid || !bad.has(uid) || sources.has(uid)) continue;
        sources.set(uid, {
          logId: Number(logId),
          logTitle: logEntry?.details?.title ?? "",
          timestamp: Number(logEntry?.timestamp || 0),
          itemId: Number(val(item?.id, item?.item_id)) || null
        });
      }
    }
  }

  const rows = [...bad.entries()].map(([uid, error]) => {
    const source = sources.get(uid) || {};
    const catalogItem = source.itemId === null || source.itemId === undefined
      ? null
      : state.itemsById.get(Number(source.itemId));
    return {
      uid,
      digits: uid.length,
      itemId: source.itemId ?? null,
      item: catalogItem?.name ?? state.itemNameCache.get(Number(source.itemId)) ?? "(unknown)",
      type: catalogItem ? val(catalogItem.sub_type, catalogItem.type) : "(not in catalog)",
      inEquipmentCatalog: source.itemId ? state.equipmentIds.has(Number(source.itemId)) : null,
      log: source.logId ? `${source.logId} ${source.logTitle}` : "(entry not saved)",
      date: source.timestamp ? new Date(source.timestamp * 1000).toISOString().slice(0, 10) : "",
      error
    };
  }).sort((a, b) => String(a.uid).localeCompare(String(b.uid)));

  // A UID that resolves is a useful comparison: these are assigned in order, so
  // a bad one being much shorter would say it is simply very old.
  const goodUids = Object.keys(activeRaw().itemDetails || {})
    .filter(u => !activeRaw().itemDetails[u]?.unresolved);
  const lengths = {};
  for (const u of goodUids) lengths[u.length] = (lengths[u.length] || 0) + 1;

  console.log(`%c${rows.length} unresolvable UID${rows.length === 1 ? "" : "s"}`,
    "font-weight:bold");
  if (rows.length) console.table(rows);
  console.log("resolvable UIDs by digit count:", lengths);
  console.log("unresolvable UIDs by digit count:",
    rows.reduce((acc, r) => { acc[r.digits] = (acc[r.digits] || 0) + 1; return acc; }, {}));

  window.tornBadUidReport = { rows, resolvableLengths: lengths };
  return rows;
};
window.tornDebug.itemDetails = state.itemDetailsDebug;

function findKeysDeep(obj, pattern, path="", out=[]) {
  if (!obj || typeof obj !== "object") return out;
  if (Array.isArray(obj)) {
    obj.forEach((v,i) => findKeysDeep(v, pattern, `${path}[${i}]`, out));
    return out;
  }
  for (const [k,v] of Object.entries(obj)) {
    const p = path ? `${path}.${k}` : k;
    if (pattern.test(k)) out.push({ path: p, value: v });
    if (v && typeof v === "object") findKeysDeep(v, pattern, p, out);
  }
  return out;
}

window.inspectItemDetailColors = function() {
  const hits = [];
  for (const batch of state.itemDetailsDebug) {
    for (const record of batch.normalized || []) {
      const found = findKeysDeep(record, /(color|colour|rarity|tier)/i);
      if (found.length) hits.push({ record, found });
    }
  }
  console.table(hits.flatMap(x => x.found.map(f => ({ path: f.path, value: f.value }))));
  return hits;
};

// Where this load's API calls went, per key. Safe to call at any time,
// including while a load is still running.
window.tornRequests = function tornRequests() {
  const out = {};
  for (const key of keyRequestState.keys()) {
    const report = requestBudgetReport(key);
    out[`...${String(key).slice(-4)}`] = report;
    console.log(`[Torn requests] ...${String(key).slice(-4)}: ${report.total} API calls`);
    console.table(report.byPhase);
  }
  return out;
};

const CACHE_DB_NAME = "tornEquipmentViewer";
const CACHE_DB_VERSION = 1;
const CACHE_STORE = "owners";

// ---------------------------------------------------------------------------
// Raw fact store.
//
// Everything the API states and never revises - log entries, trade payloads,
// item details, the item catalog, player and faction names - is kept verbatim
// per owner alongside the derived rows. Every table in the viewer is a pure
// function of those facts, so changing how a price is valued, which items pass
// the filter, how owners are attributed or what a row looks like only needs a
// rebuild, never another pull. `state.offline` makes that rebuild fail loudly
// if it ever reaches for the network.
// ---------------------------------------------------------------------------
const RAW_VERSION = 1;

// Saving means cloning the whole fact store, so mid-stage saves are no more
// frequent than this. Stage boundaries always write.
const CHECKPOINT_MIN_MS = 10_000;

// 2: before loads were serialised, two running together could file one owner's
// log entries under the other. Log entries and trades are discarded once and
// read back cleanly; item details, item records and names are owner-independent
// and some can no longer be fetched, so they stay.
const RAW_OWNER_SCOPE_VERSION = 2;

// Bumped when a fetch bug means the saved facts are known to be incomplete, so
// the next live load ignores its watermark and walks the whole history again.
// 2: /user/trades stopped after the first page of 100.
const TRADE_SYNC_VERSION = 2;

// Same idea per log id. Item Send needs its whole history saved, not just the
// entries that produced rows, because a parcel's despatch is an ordinary send
// of the parcel item and that is what links a parcel to its recipient.
// 2: the buy logs need their whole history, not just the entries that produced
// a weapon, because a cache purchase is what prices the weapon that came out.
const LOG_SYNC_VERSIONS = {
  [ITEM_SEND_LOG]: 2,
  [ITEM_MARKET_BUY_LOG]: 2,
  [BAZAAR_BUY_LOG]: 2,
  [CACHE_USE_LOG]: 2
};

// state.raw is only populated when an owner is loaded; anything that records a
// fact before then gets a scratch store rather than crashing.
// One owner's facts are held in state.raw at a time, so two loads running
// together would each write into whichever store the other had just installed:
// one owner's log entries land in the other's store, and the rows derived from
// them are stamped with the wrong account. Everything that loads queues here.
function runExclusive(task) {
  const next = (state.loadChain || Promise.resolve()).catch(() => {}).then(task);
  state.loadChain = next;
  return next;
}

function setLoadingUi(busy) {
  state.loadBusy = busy;
  document.querySelectorAll(".load-key-btn").forEach(btn => { btn.disabled = busy; });
}

function activeRaw() {
  if (!state.raw) state.raw = emptyRawStore();
  return state.raw;
}

// The fact stores of every account currently in play. Facts are recorded into
// state.raw, the owner being loaded; they are read back from all of them.
function loadedFactStores() {
  const stores = [];
  for (const id of state.loadedOwners.keys()) {
    const store = state.factStores.get(String(id));
    if (store) stores.push(store);
  }
  if (!stores.length && state.raw) stores.push(state.raw);
  return stores;
}

function factLogEntries(logId) {
  const id = String(logId);
  return loadedFactStores().flatMap(raw => Object.values(raw.logEntries?.[id] || {}));
}

function factTrades() {
  return loadedFactStores().flatMap(raw => Object.values(raw.trades || {}));
}

function emptyRawStore() {
  return {
    version: RAW_VERSION,
    logEntries: {},    // logId -> { entryId -> log entry }
    trades: {},        // tradeId -> { summary, detail }
    itemDetails: {},   // uid -> /torn/<uid>/itemdetails record
    itemRecords: {},   // itemId -> /torn/items record
    userNames: {},     // userId -> name
    factionNames: {},  // factionId -> name
    logCursors: {}     // logId (or "trades") -> oldest timestamp an unfinished walk reached
  };
}

// A store created now was never written by any of the versions those repairs
// exist for, so it starts out already up to date. Only a store recovered from
// an older cache goes through them.
function newRawStore() {
  const raw = emptyRawStore();
  raw.ownerScope = RAW_OWNER_SCOPE_VERSION;
  raw.tradeSyncVersion = TRADE_SYNC_VERSION;
  raw.logSync = { ...LOG_SYNC_VERSIONS };
  return raw;
}

function rawLogBucket(logId) {
  const id = String(logId);
  if (!activeRaw().logEntries[id]) activeRaw().logEntries[id] = {};
  return activeRaw().logEntries[id];
}
function rawTradeBucket(tradeId) {
  const id = String(tradeId);
  if (!activeRaw().trades[id]) activeRaw().trades[id] = { summary: null, detail: null };
  return activeRaw().trades[id];
}

function recordRawItem(item) {
  const id = Number(val(item?.id, item?.item_id, item?.itemID));
  if (!Number.isFinite(id)) return;
  activeRaw().itemRecords[String(id)] = item;

  const market = val(item?.value?.market_price, item?.market_price, item?.marketPrice);
  state.itemMarketValueCache.set(
    id,
    market === null || market === undefined ? null : Number(market)
  );
  const name = val(item?.name, item?.item_name);
  if (name) state.itemNameCache.set(id, String(name));
}

function recordRawLogEntries(logId, entries) {
  const bucket = rawLogBucket(logId);
  for (const entry of entries) {
    const id = val(entry?.id, entry?.timestamp);
    if (id !== null && id !== undefined) bucket[String(id)] = entry;
  }
}

function logEntriesFromRaw(logId) {
  return Object.values(activeRaw().logEntries[String(logId)] || {});
}

function catalogFromRaw() {
  const deduped = new Map();
  for (const item of Object.values(activeRaw().itemRecords)) {
    if (!isWeaponOrArmor(item)) continue;
    const id = Number(val(item?.id, item?.item_id, item?.itemID));
    if (Number.isFinite(id)) deduped.set(id, item);
  }
  return deduped;
}

function primeCachesFromRaw() {
  for (const [id, name] of Object.entries(activeRaw().userNames)) {
    if (name) state.userNameCache.set(String(id), String(name));
  }
  for (const [id, name] of Object.entries(activeRaw().factionNames)) {
    if (name) state.factionNameCache.set(String(id), String(name));
  }
  for (const item of Object.values(activeRaw().itemRecords)) recordRawItem(item);
}

function rawStoreStats(raw) {
  return {
    logEntries: Object.values(raw?.logEntries || {})
      .reduce((n, bucket) => n + Object.keys(bucket).length, 0),
    trades: Object.keys(raw?.trades || {}).length,
    tradeDetails: Object.values(raw?.trades || {}).filter(t => t?.detail).length,
    itemDetails: Object.keys(raw?.itemDetails || {}).length,
    itemRecords: Object.keys(raw?.itemRecords || {}).length,
    userNames: Object.keys(raw?.userNames || {}).length,
    factionNames: Object.keys(raw?.factionNames || {}).length,
    migratedFromRows: !!raw?.migratedFromRows
  };
}

// Caches written before the raw store existed only kept the rows that passed
// the filters, but each row carries its source log entry or trade payload, and
// weapon stats are themselves stated facts - so a usable fact store can be
// recovered from them without pulling anything.
function rawFromLegacyRows(record) {
  const raw = emptyRawStore();
  raw.migratedFromRows = true;

  for (const spec of LOGS) {
    for (const row of record?.rows?.[spec.key] || []) {
      const source = row?.raw;

      if (spec.trade) {
        const tradeId = val(source?.id, row?.tradeId);
        if (source && tradeId !== null && tradeId !== undefined) {
          raw.trades[String(tradeId)] = {
            summary: {
              id: tradeId,
              description: source?.description ?? null,
              completed_at: val(source?.completed_at, source?.timestamp),
              timestamp: val(source?.timestamp, source?.completed_at)
            },
            detail: source
          };
        }
      } else if (source && spec.id) {
        const entryId = val(source?.id, source?.timestamp);
        if (entryId !== null && entryId !== undefined) {
          if (!raw.logEntries[String(spec.id)]) raw.logEntries[String(spec.id)] = {};
          raw.logEntries[String(spec.id)][String(entryId)] = source;
        }
      }

      if (row?.uid) {
        raw.itemDetails[String(row.uid)] = {
          uid: String(row.uid),
          id: row.itemId ?? null,
          name: row.name ?? null,
          rarity: row.rarity ?? null,
          type: null,
          stats: {
            quality: row.quality ?? null,
            armor: row.armor ?? null,
            damage: row.damage ?? null,
            accuracy: row.accuracy ?? null
          },
          bonuses: [
            ...(row.bonus1 ? [{ title: row.bonus1, value: row.bonus1Value ?? null }] : []),
            ...(row.bonus2 ? [{ title: row.bonus2, value: row.bonus2Value ?? null }] : [])
          ]
        };
      }

      for (const [id, name] of [
        [row?.sellerId, row?.seller],
        [row?.buyerId, row?.buyer],
        [row?.senderId, row?.sender],
        [row?.receiverId, row?.receiver]
      ]) {
        if (id && name) raw.userNames[String(id)] = String(name);
      }
      if (row?.factionId && row?.faction) {
        raw.factionNames[String(row.factionId)] = String(row.faction);
      }
    }
  }

  return raw;
}

function openCacheDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CACHE_DB_NAME, CACHE_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(CACHE_STORE)) {
        db.createObjectStore(CACHE_STORE, { keyPath: "ownerId" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getOwnerCache(ownerId) {
  const db = await openCacheDb();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readonly");
      const req = tx.objectStore(CACHE_STORE).get(String(ownerId));
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } finally {
    db.close();
  }
}

async function getAllOwnerCaches() {
  const db = await openCacheDb();
  try {
    return await new Promise((resolve, reject) => {
      const req = db.transaction(CACHE_STORE, "readonly").objectStore(CACHE_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } finally {
    db.close();
  }
}

async function deleteOwnerCache(ownerId) {
  const db = await openCacheDb();
  try {
    await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readwrite");
      tx.objectStore(CACHE_STORE).delete(String(ownerId));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

async function putOwnerCache(record) {
  const db = await openCacheDb();
  try {
    await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readwrite");
      tx.objectStore(CACHE_STORE).put(record);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

// Forgetting one account.
//
// The facts live in that owner's own record, so the record goes. What is keyed
// by row rather than by owner - hand-typed prices and holding decisions - is
// prefixed with the owner id and goes with it. What is keyed by UID - a named
// owner, a weapon marked returned - is only dropped for weapons that no other
// account has a row for, so shared history survives.
async function forgetOwner(ownerId) {
  const id = String(ownerId);
  const record = await getOwnerCache(id);

  const goneUids = new Set();
  for (const spec of LOGS) {
    for (const row of record?.rows?.[spec.key] || []) {
      if (row?.uid) goneUids.add(String(row.uid));
    }
  }

  await deleteOwnerCache(id);

  for (const spec of LOGS) {
    state.rows[spec.key] = (state.rows[spec.key] || [])
      .filter(r => String(r.ownerId ?? "") !== id);
    for (const row of state.rows[spec.key]) {
      if (row?.uid) goneUids.delete(String(row.uid));
    }
  }

  state.loadedOwners.delete(id);
  state.factStores.delete(id);
  state.marketRows = state.marketRows.filter(r => String(r.ownerId ?? "") !== id);

  const prefix = `${id}:`;
  for (const key of [...state.manualPrices.keys()]) {
    if (key.startsWith(prefix)) state.manualPrices.delete(key);
  }
  for (const key of [...state.holdingOutcome.keys()]) {
    if (String(key).startsWith(prefix)) state.holdingOutcome.delete(key);
  }
  for (const key of [...state.holdingOwners.keys()]) {
    if (String(key).startsWith(prefix)) state.holdingOwners.delete(key);
  }
  state.marketManualRows = state.marketManualRows
    .filter(r => !goneUids.has(String(r.uid)));

  saveManualPrices();
  saveHoldingOutcomes();
  saveHoldingOwners();
  saveMarketManualRows();

  state.raw = null;
  invalidateOwnerDefaults();
  return { name: record?.ownerName || id, uids: goneUids.size };
}

// An account that is set aside keeps everything it has saved, but takes no
// part in anything: no rows, no rebuild, and - the point of it - no share in
// the ownership the loaded accounts hold in common.
async function setOwnerActive(ownerId, active) {
  const id = String(ownerId);
  const record = await getOwnerCache(id);
  if (!record) return null;

  await putOwnerCache({ ...record, inactive: !active });

  if (!active) {
    for (const spec of LOGS) {
      state.rows[spec.key] = (state.rows[spec.key] || [])
        .filter(r => String(r.ownerId ?? "") !== id);
    }
    state.loadedOwners.delete(id);
    state.factStores.delete(id);
    state.marketRows = state.marketRows.filter(r => String(r.ownerId ?? "") !== id);
    state.raw = null;
  }

  invalidateOwnerDefaults();
  return record.ownerName || id;
}

// The whole record, as a file: the rows, the facts behind them, and the
// watermarks that say how much of the history has been walked. Importing it
// puts the account back exactly as it was, without a single request.
function exportOwnerRecord(record) {
  const name = String(record?.ownerName || record?.ownerId || "owner")
    .replace(/[^A-Za-z0-9_-]+/g, "-");
  const blob = new Blob([JSON.stringify(record)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tornRW-${name}-${record?.ownerId}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

async function importOwnerRecord(text) {
  let record;
  try {
    record = JSON.parse(text);
  } catch (err) {
    throw new Error("That file is not readable JSON.");
  }

  if (!record || record.ownerId === null || record.ownerId === undefined) {
    throw new Error("That file is not a saved account - no ownerId in it.");
  }
  if (!record.rows && !record.raw) {
    throw new Error("That file has neither rows nor saved facts in it.");
  }

  await putOwnerCache({
    ...record,
    ownerId: String(record.ownerId),
    inactive: record.inactive === true,
    savedAt: Number(record.savedAt) || Date.now()
  });

  return { id: String(record.ownerId), name: record.ownerName || String(record.ownerId) };
}

const STATED_FACT_STORES = [
  { key: "owners",   label: "owners named",     get: () => state.holdingOwners,
    save: () => saveHoldingOwners() },
  { key: "prices",   label: "prices typed",     get: () => state.manualPrices,
    save: () => saveManualPrices() },
  { key: "outcomes", label: "holdings decided", get: () => state.holdingOutcome,
    save: () => saveHoldingOutcomes() }
];

function statedFactCounts() {
  const counts = {};
  let total = 0;
  for (const store of STATED_FACT_STORES) {
    const n = store.get().size;
    counts[store.key] = n;
    total += n;
  }
  counts.total = total;
  return counts;
}

function statedFactSummary() {
  const counts = statedFactCounts();
  return STATED_FACT_STORES
    .filter(store => counts[store.key] > 0)
    .map(store => {
      const n = counts[store.key];
      // "1 owner named" rather than "1 owners named".
      const [noun, verb] = store.label.split(" ");
      return `${n} ${n === 1 ? noun.replace(/s$/, "") : noun} ${verb}`;
    })
    .join(", ");
}

function resetStatedFacts() {
  for (const store of STATED_FACT_STORES) {
    store.get().clear();
    store.save();
  }
  invalidateOwnerDefaults();
  applyStatedFacts();
}

function maxTimestamp(rows) {
  return (rows || []).reduce((m, r) => Math.max(m, Number(r?.timestamp || 0)), 0);
}

function mergeRowsByKey(existing, incoming) {
  const map = new Map();
  for (const row of [...(existing || []), ...(incoming || [])]) {
    if (!row?.rowKey) continue;
    map.set(row.rowKey, row);
  }
  return [...map.values()];
}

function readStoredArray(key) {
  try {
    const parsed = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

function getCookie(name) {
  return document.cookie.split("; ").find(x => x.startsWith(name + "="))?.split("=").slice(1).join("=") || "";
}
function setCookie(name, value) {
  document.cookie = `${name}=${encodeURIComponent(value)}; max-age=31536000; path=/; SameSite=Lax`;
}
function status(msg, error=false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (error ? " error" : "");
}
function val(...xs) {
  for (const x of xs) if (x !== undefined && x !== null && x !== "") return x;
  return null;
}
function formatMoney(v) {
  if (v === null || v === undefined || v === "") return "";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  const rounded = Math.round(n);
  return rounded < 0
    ? "-$" + Math.abs(rounded).toLocaleString()
    : "$" + rounded.toLocaleString();
}
function formatDate(ts) {
  if (!ts) return "";
  const n = Number(ts);
  if (!Number.isFinite(n)) return String(ts);
  return new Date(n * 1000).toLocaleString();
}
function flattenObjects(obj, out=[]) {
  if (!obj || typeof obj !== "object") return out;
  out.push(obj);
  for (const v of Object.values(obj)) {
    if (v && typeof v === "object") flattenObjects(v, out);
  }
  return out;
}
function firstDeep(obj, names) {
  const lowered = new Set(names.map(x => x.toLowerCase()));
  for (const o of flattenObjects(obj, [])) {
    for (const [k,v] of Object.entries(o)) {
      if (lowered.has(k.toLowerCase()) && (typeof v !== "object" || v === null)) return v;
    }
  }
  return null;
}
function apiError(json, res) {
  const e = json?.error;
  if (e) return e.error || e.message || `API error ${e.code ?? ""}`.trim();
  return `HTTP ${res.status}`;
}
const API_COMMENT = "RWInv";

const REQUEST_LIMIT = 60;
const REQUEST_WINDOW_MS = 60_000;
const RATE_LIMIT_RETRY_MS = 60_000;
const MAX_RATE_LIMIT_WAITS = 10;

const keyRequestState = new Map();
window.tornRequestDebug = keyRequestState;
window.getTradeDebug = function() {
  const owners = window.tornDebug?.owners || {};
  return Object.fromEntries(
    Object.entries(owners).map(([id, data]) => [id, data?.trades || null])
  );
};

function getKeyRequestState(key) {
  let s = keyRequestState.get(key);
  if (!s) {
    s = {
      requestTimes: [],
      consecutiveApiErrors: 0,
      phase: "",
      lastRequest: "",
      keyRow: null,
      phaseCounts: new Map()   // phase -> { requests, paced, examples }
    };
    keyRequestState.set(key, s);
  }
  return s;
}

function setPerKeyStatus(key, message, isError=false) {
  const s = getKeyRequestState(key);
  const el = s.keyRow?.querySelector(".key-status");
  if (!el) return;
  el.textContent = message || "";
  el.style.color = isError ? "var(--danger)" : "";
}

function setKeyPhase(key, phase) {
  const s = getKeyRequestState(key);
  s.phase = phase || "";
  if (s.phase) setPerKeyStatus(key, s.phase);
}

function phaseTally(key) {
  const s = getKeyRequestState(key);
  const name = s.phase || "(no phase)";
  if (!s.phaseCounts.has(name)) {
    s.phaseCounts.set(name, { requests: 0, paced: 0, examples: [] });
  }
  return s.phaseCounts.get(name);
}

// What a load spent its requests on. A load that stalls on the rolling window
// is almost always one phase asking for far more than expected, and this says
// which - no guessing from a status line that has already moved on.
function requestBudgetReport(key) {
  const s = getKeyRequestState(key);
  const rows = [...s.phaseCounts.entries()]
    .map(([phase, t]) => ({ phase, requests: t.requests, pacedWaits: t.paced,
      examples: t.examples.join(" | ") }))
    .sort((a, b) => b.requests - a.requests);
  return { total: rows.reduce((n, r) => n + r.requests, 0), byPhase: rows };
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Sleeping in one go leaves whatever was written on screen frozen for the whole
// wait, which reads as a hang. This re-writes the line every second so the
// number actually counts down.
async function countdown(key, ms, label, isError=false) {
  const until = Date.now() + ms;
  while (true) {
    const left = until - Date.now();
    if (left <= 0) return;
    const msg = label(Math.ceil(left / 1000));
    status(msg, isError);
    setPerKeyStatus(key, msg, isError);
    await sleep(Math.min(1000, left));
  }
}

async function waitForRequestSlot(key) {
  const s = getKeyRequestState(key);

  while (true) {
    const now = Date.now();

    while (s.requestTimes.length && now - s.requestTimes[0] >= REQUEST_WINDOW_MS) {
      s.requestTimes.shift();
    }

    if (s.requestTimes.length < REQUEST_LIMIT) {
      s.requestTimes.push(now);
      return;
    }

    const waitMs = Math.max(1, REQUEST_WINDOW_MS - (now - s.requestTimes[0]) + 25);
    const tally = phaseTally(key);
    tally.paced += 1;
    const where = s.phase ? ` during ${s.phase}` : "";
    await countdown(key, waitMs,
      left => `API pacing${where}: waiting ${left}s for this key's rolling ` +
        `window (${REQUEST_LIMIT} requests/${Math.round(REQUEST_WINDOW_MS / 1000)}s, ` +
        `${tally.requests} spent here so far)...`);
  }
}

function isTooManyRequests(json, res, message) {
  if (res?.status === 429) return true;

  const errorText = String(
    message ??
    json?.error?.error ??
    json?.error?.message ??
    ""
  ).toLowerCase();

  return errorText.includes("too many requests");
}

async function apiFetch(url, key) {
  if (state.offline) {
    throw new Error(
      `Rebuild from saved data needed a live request (${url}) - the saved facts are incomplete.`
    );
  }

  const requestState = getKeyRequestState(key);
  let rateLimitWaits = 0;

  while (true) {
    await waitForRequestSlot(key);

    const requestPath = String(url);
    const u = new URL(requestPath.replace(/^\/+/, ""), API);
    u.searchParams.set("key", key);
    u.searchParams.set("comment", API_COMMENT);
    requestState.lastRequest = requestPath;

    const tally = phaseTally(key);
    tally.requests += 1;
    if (tally.examples.length < 3) tally.examples.push(requestPath.slice(0, 80));

    let res;
    let json;

    try {
      res = await fetch(u.toString());

      try {
        json = await res.json();
      } catch {
        throw new Error(`Invalid API response (${res.status})`);
      }

      if (!res.ok || json?.error) {
        throw new Error(apiError(json, res));
      }

      requestState.consecutiveApiErrors = 0;
      return json;

    } catch (err) {
      // Being told to slow down is not a failure to give up on. It gets its own
      // budget and never spends the one meant for things that are actually
      // broken - otherwise three busy moments in a row abort the whole load.
      if (isTooManyRequests(json, res, err?.message)) {
        rateLimitWaits += 1;
        if (rateLimitWaits > MAX_RATE_LIMIT_WAITS) {
          throw new Error(
            `Still rate limited after ${MAX_RATE_LIMIT_WAITS} waits` +
            ` — request: ${requestState.lastRequest}` +
            `${requestState.phase ? ` — phase: ${requestState.phase}` : ""}`
          );
        }
        await countdown(key, RATE_LIMIT_RETRY_MS,
          left => `Too many requests. Retrying in ${left}s ` +
            `(wait ${rateLimitWaits}/${MAX_RATE_LIMIT_WAITS})...`,
          true);
        continue;
      }

      requestState.consecutiveApiErrors += 1;

      if (requestState.consecutiveApiErrors >= 3) {
        throw new Error(
          `${err?.message || String(err)} — request: ${requestState.lastRequest}` +
          `${requestState.phase ? ` — phase: ${requestState.phase}` : ""}` +
          ` — stopped after 3 consecutive API errors.`
        );
      }

      throw new Error(
        `${err?.message || String(err)} — request: ${requestState.lastRequest}` +
        `${requestState.phase ? ` — phase: ${requestState.phase}` : ""}`
      );
    }
  }
}

function normalizeBasicUser(json) {
  const candidates = [
    json?.profile,
    json?.basic,
    json?.user,
    json?.data,
    json
  ].filter(x => x && typeof x === "object");

  for (const obj of candidates) {
    const id = val(obj?.id, obj?.player_id, obj?.playerId, obj?.user_id, obj?.userId);
    const name = val(obj?.name, obj?.player_name, obj?.playerName, obj?.username);
    if (id !== null || name !== null) {
      return {
        id: id !== null ? String(id) : null,
        name: name !== null ? String(name) : null
      };
    }
  }
  return { id: null, name: null };
}

async function getFactionName(factionId, key) {
  if (factionId === null || factionId === undefined || factionId === "" || Number(factionId) === 0) return null;
  const id = String(factionId);
  const saved = state.raw?.factionNames?.[id];
  if (saved) {
    state.factionNameCache.set(id, saved);
    return saved;
  }
  if (state.factionNameCache.has(id)) {
    const cached = state.factionNameCache.get(id);
    if (state.raw && cached) activeRaw().factionNames[id] = cached;
    return cached;
  }
  if (state.factionNamePromises.has(id)) return state.factionNamePromises.get(id);
  if (state.offline) return null;

  const promise = (async () => {
    try {
      const json = await apiFetch(`/faction/${encodeURIComponent(id)}/basic`, key);
      const name = val(json?.basic?.name, json?.faction?.basic?.name, json?.name);
      if (!name) throw new Error(`Could not resolve faction name for ID ${id}.`);
      state.factionNameCache.set(id, String(name));
      if (state.raw) activeRaw().factionNames[id] = String(name);
      return String(name);
    } catch (err) {
      // A key without faction access, or a faction that no longer exists.
      console.warn(`[Torn] faction ${id} name unavailable`, err?.message || err);
      return null;
    } finally {
      state.factionNamePromises.delete(id);
    }
  })();

  state.factionNamePromises.set(id, promise);
  return promise;
}

async function getOwnerBasic(key) {
  const json = await apiFetch("/user/basic", key);
  const user = normalizeBasicUser(json);
  if (!user.id || !user.name) {
    throw new Error("Could not determine user ID/name from /user/basic.");
  }
  state.userNameCache.set(String(user.id), user.name);
  return user;
}

async function getUserName(userId, key) {
  if (userId === null || userId === undefined || userId === "" || Number(userId) === 0) return null;
  const id = String(userId).trim();
  if (!/^\d+$/.test(id)) {
    throw new Error(`Invalid user ID extracted from log: ${id}`);
  }

  const saved = state.raw?.userNames?.[id];
  if (saved) {
    state.userNameCache.set(id, saved);
    return saved;
  }
  if (state.userNameCache.has(id)) {
    const cached = state.userNameCache.get(id);
    if (state.raw && cached) activeRaw().userNames[id] = cached;
    return cached;
  }
  if (state.userNamePromises.has(id)) return state.userNamePromises.get(id);
  if (state.offline) return null;

  const promise = (async () => {
    try {
      const json = await apiFetch(`/user/${encodeURIComponent(id)}/basic`, key);
      const user = normalizeBasicUser(json);
      if (!user.name) {
        throw new Error(`Could not resolve user name for ID ${id}.`);
      }
      state.userNameCache.set(id, user.name);
      if (state.raw) activeRaw().userNames[id] = user.name;
      return user.name;
    } catch (err) {
      // The player id is shown instead. Not cached as a fact, so a key with
      // more access - or a better moment - resolves it next time.
      console.warn(`[Torn] player ${id} name unavailable`, err?.message || err);
      return null;
    } finally {
      state.userNamePromises.delete(id);
    }
  })();

  state.userNamePromises.set(id, promise);
  return promise;
}

async function resolvePeople(rows, key) {
  const ids = new Set();
  for (const row of rows) {
    if (row.sellerId) ids.add(String(row.sellerId));
    if (row.buyerId) ids.add(String(row.buyerId));
    if (row.senderId) ids.add(String(row.senderId));
    if (row.receiverId) ids.add(String(row.receiverId));
  }

  await Promise.all([...ids].map(id => getUserName(id, key)));

  for (const row of rows) {
    row.seller = row.sellerId ? (state.userNameCache.get(String(row.sellerId)) || String(row.sellerId)) : null;
    row.buyer = row.buyerId ? (state.userNameCache.get(String(row.buyerId)) || String(row.buyerId)) : null;
    row.sender = row.senderId ? (state.userNameCache.get(String(row.senderId)) || String(row.senderId)) : null;
    row.receiver = row.receiverId ? (state.userNameCache.get(String(row.receiverId)) || String(row.receiverId)) : null;
  }
}


/* Torn has used both `cat` and broader unfiltered item responses over time.
   Try category calls first; if unavailable, fall back to /torn/items and filter locally. */
async function getEquipmentCatalog(key) {
  if (state.offline) return catalogFromRaw();

  let all = [];
  let categorySucceeded = false;

  for (const category of ["Weapon", "Armor"]) {
    try {
      const j = await apiFetch(`/torn/items?cat=${encodeURIComponent(category)}`, key);
      const arr = normalizeItemList(j);
      if (arr.length) {
        all.push(...arr);
        categorySucceeded = true;
      }
    } catch (_) {}
  }

  if (!categorySucceeded) {
    const j = await apiFetch("/torn/items", key);
    all = normalizeItemList(j).filter(isWeaponOrArmor);
  } else {
    all = all.filter(isWeaponOrArmor);
  }

  const deduped = new Map();
  for (const item of all) {
    const id = Number(val(item.id, item.item_id, item.itemID));
    if (!Number.isFinite(id)) continue;
    deduped.set(id, item);
    recordRawItem(item);
  }
  return deduped;
}
function normalizeItemList(json) {
  const root = val(json?.items, json?.data?.items, json);
  if (Array.isArray(root)) return root;
  if (root && typeof root === "object") {
    return Object.entries(root).map(([id,v]) =>
      v && typeof v === "object" ? {id: val(v.id, Number(id)), ...v} : null
    ).filter(Boolean);
  }
  return [];
}
function isWeaponOrArmor(item) {
  const bits = [
    item?.type, item?.category, item?.sub_type, item?.subtype,
    item?.item_type, item?.itemType
  ].filter(Boolean).join(" ").toLowerCase();
  return bits.includes("weapon") || bits.includes("armor") || bits.includes("armour");
}

// Equipment types seen on /user/itemmarket listings. Only used when the
// /torn/items catalog is not loaded yet; the catalog is authoritative.
const MARKET_EQUIPMENT_TYPES = new Set([
  "weapon", "melee", "primary", "secondary", "piercing", "clubbing",
  "slashing", "mechanical", "fists", "hands", "defensive", "armor", "armour"
]);

function isEquipmentListing(listing, catalog) {
  const item = listing?.item || {};
  const id = Number(val(item.id, item.item_id, item.itemID));
  if (catalog && catalog.size && Number.isFinite(id)) return catalog.has(id);
  return MARKET_EQUIPMENT_TYPES.has(String(val(item.type, item.category) ?? "").toLowerCase());
}

async function getItemMarketListings(key) {
  let url = "/user/itemmarket?limit=100&offset=0";

  // This endpoint does not always honour `limit`, so pages can overlap. Listings
  // are collected by id rather than appended blindly.
  const byId = new Map();
  const seenUrls = new Set();

  while (url && !seenUrls.has(url) && seenUrls.size < 100) {
    seenUrls.add(url);
    const j = await apiFetch(url, key);

    const batch = val(j?.itemmarket, j?.itemMarket, j?.data?.itemmarket, []);
    const listings = Array.isArray(batch)
      ? batch
      : (batch && typeof batch === "object" ? Object.values(batch) : []);

    for (const [i, listing] of listings.entries()) {
      const id = val(listing?.id, listing?.listing_id, `${seenUrls.size}:${i}`);
      byId.set(String(id), listing);
    }

    const next = val(
      j?._metadata?.links?.next,
      j?.metadata?.links?.next,
      j?._metadata?.next,
      j?.metadata?.next,
      j?.links?.next
    );
    url = paginationUrl(next, { limit: 100 });
  }
  return [...byId.values()];
}

function marketListingToRow(listing, owner) {
  const item = listing?.item || {};
  const stats = item?.stats || {};
  const bonuses = Array.isArray(item?.bonuses) ? item.bonuses : [];

  const priceRaw = Number(val(listing?.price, listing?.cost));
  const price = Number.isFinite(priceRaw) ? priceRaw : null;
  const avgRaw = Number(val(listing?.average_price, listing?.averagePrice, listing?.market_price));
  const averagePrice = Number.isFinite(avgRaw) && avgRaw > 0 ? avgRaw : null;

  const itemId = Number(val(item?.id, item?.item_id, item?.itemID));
  const listingId = val(listing?.id, listing?.listing_id);

  return {
    rowKey: `${owner.id}:itemmarket:${val(listingId, item?.uid, item?.id, "")}`,
    listingId,
    ownerId: String(owner.id),
    owner: owner.name,
    itemId: Number.isFinite(itemId) ? itemId : null,
    name: val(item?.name),
    type: val(item?.type, item?.category),
    rarity: val(item?.rarity),
    uid: val(item?.uid),
    price,
    averagePrice,
    markup: price !== null && averagePrice !== null ? price / averagePrice : null,
    amount: val(listing?.amount),
    available: val(listing?.available),
    anonymous: listing?.is_anonymous ? "Yes" : "No",
    quality: val(stats?.quality),
    armor: val(stats?.armor),
    damage: val(stats?.damage),
    accuracy: val(stats?.accuracy),
    bonus1: val(bonuses[0]?.title),
    bonus1Value: val(bonuses[0]?.value),
    bonus2: val(bonuses[1]?.title),
    bonus2Value: val(bonuses[1]?.value)
  };
}

async function ensureEquipmentCatalog(key) {
  if (state.equipmentIds.size) return state.itemsById;
  const catalog = await getEquipmentCatalog(key);
  if (catalog.size) {
    state.itemsById = catalog;
    state.equipmentIds = new Set(catalog.keys());
  }
  return catalog;
}

// Replaces this owner's listings; a delisted item must not linger in the table.
async function loadItemMarket(key, owner, ownerDebug=null) {
  const catalog = state.equipmentIds.size ? state.itemsById : null;
  const listings = await getItemMarketListings(key);
  const kept = listings.filter(l => isEquipmentListing(l, catalog));
  const rows = kept.map(l => marketListingToRow(l, owner));

  state.marketRows = [
    ...state.marketRows.filter(r => String(r.ownerId) !== String(owner.id)),
    ...rows
  ];

  // An item that is now genuinely listed no longer needs its manual stand-in.
  const liveUids = new Set(rows.map(r => String(r.uid)));
  const keptManual = state.marketManualRows.filter(r => !liveUids.has(String(r.uid)));
  if (keptManual.length !== state.marketManualRows.length) {
    state.marketManualRows = keptManual;
    saveMarketManualRows();
  }

  if (ownerDebug) {
    ownerDebug.itemMarket = {
      rawCount: listings.length,
      rawListings: listings,
      keptCount: kept.length,
      rows
    };
  }
  return rows;
}

// /torn/items reports category + sub_type ("Weapon" / "Slashing"); the item
// market reports the equip slot ("Melee"). Manual rows come from logs, so the
// slot has to be derived from the catalog to match live listings.
const WEAPON_SLOT_BY_SUBTYPE = new Map([
  ["clubbing", "Melee"],
  ["piercing", "Melee"],
  ["slashing", "Melee"],
  ["mechanical", "Melee"],
  ["pistol", "Secondary"],
  ["rifle", "Primary"],
  ["smg", "Primary"],
  ["shotgun", "Primary"],
  ["machine gun", "Primary"],
  ["heavy artillery", "Primary"],
  ["temporary", "Temporary"]
]);

function catalogSlot(itemId) {
  const id = Number(itemId);
  const item = Number.isFinite(id) ? state.itemsById.get(id) : null;
  if (!item) return "";

  const type = String(val(item.type, item.category) ?? "").toLowerCase().trim();
  if (["armor", "armour", "defensive"].includes(type)) return "Armor";

  const sub = String(val(item.sub_type, item.subtype, item.subType) ?? "").toLowerCase().trim();
  return WEAPON_SLOT_BY_SUBTYPE.get(sub) || "";
}

// Live listings and manually added rows share every downstream code path; only
// `source` separates them. White equipment is not what this tool is about, so
// a plain listing is left off the tab exactly as it is left out of every table.
function allMarketRows() {
  return [...state.marketRows, ...state.marketManualRows]
    .filter(r => QUALIFYING_RARITIES.has(String(r.rarity ?? "").toLowerCase()));
}

function saveMarketManualRows() {

}
function findManualMarketRow(uid) {

function findLiveMarketRow(uid) {

function removeManualMarketRow(rowKey) {

function setManualMarketPrice(rowKey, rawValue) {
  const parsed = parseEditablePrice(rawValue);
  if (parsed !== null && !Number.isFinite(parsed)) return false;

  const row = state.marketManualRows.find(r => r.rowKey === rowKey);
  if (!row) return false;

  row.price = parsed === null ? 0 : parsed;
  saveMarketManualRows();
  return true;
}

// uid -> the send that posted it off. Built from raw Item Send entries, because
// the parcel item itself is not equipment and so never becomes a row.
function sentItemIndex() {
  const index = new Map();

  for (const entry of Object.values(activeRaw().logEntries[String(ITEM_SEND_LOG)] || {})) {
    const data = entry?.data || {};
    const receiverId = primitiveId(data?.receiver, data?.receiver_id, data?.recipient);
    const items = Array.isArray(data?.items) ? data.items : [];

    for (const item of items) {
      const uid = val(item?.uid, item?.unique_id);
      if (uid === null || uid === undefined || Number(uid) === 0) continue;
      index.set(String(uid), {
        timestamp: val(entry?.timestamp),
        receiverId,
        entry
      });
    }
  }
  return index;
}

// A parcel's despatch becomes one Item Send row per tracked weapon inside it.
// Only UIDs we already hold details for are considered - those are exactly the
// ones that already appear in the tables - so this costs no extra requests.
function buildParcelSentRows(owner) {
  const parcels = activeRaw().logEntries[String(PARCEL_CREATE_LOG)] || {};
  const sends = sentItemIndex();
  const details = activeRaw().itemDetails;
  const ownerId = String(owner.id);
  const rows = [];

  for (const entry of Object.values(parcels)) {
    const parcelId = val(entry?.data?.parcel_id, entry?.data?.parcelId);
    if (parcelId === null || parcelId === undefined) continue;

    const send = sends.get(String(parcelId));
    if (!send) continue;   // never posted, or its send is not among our facts

    for (const item of (Array.isArray(entry?.data?.items) ? entry.data.items : [])) {
      const uid = val(item?.uid, item?.unique_id);
      if (uid === null || uid === undefined || Number(uid) === 0) continue;

      const detail = details[String(uid)];
      if (!detail) continue;   // not a weapon we track, so nothing to show

      const itemId = Number(val(detail?.id, item?.id));
      if (!Number.isFinite(itemId) || !state.equipmentIds.has(itemId)) continue;
      if (!QUALIFYING_RARITIES.has(String(detail?.rarity ?? "").toLowerCase())) continue;

      const stats = detail?.stats || {};
      const bonuses = Array.isArray(detail?.bonuses) ? detail.bonuses : [];

      rows.push({
        timestamp: send.timestamp,
        rowKey: `${ownerId}:parcel:${parcelId}:${uid}`,
        itemId,
        uid: String(uid),
        qty: 1,
        price: null,
        sellerId: null,
        buyerId: null,
        senderId: null,
        receiverId: send.receiverId,
        factionId: null,
        seller: null,
        buyer: null,
        sender: null,
        receiver: null,
        faction: null,
        party: null,
        partyId: null,
        from: null,
        to: null,
        owner: owner.name,
        ownerId,
        name: val(detail?.name, ""),
        quality: val(stats?.quality),
        armor: val(stats?.armor, stats?.armour),
        damage: val(stats?.damage),
        accuracy: val(stats?.accuracy),
        bonus1: val(bonuses[0]?.title, bonuses[0]?.name),
        bonus1Value: val(bonuses[0]?.value),
        bonus2: val(bonuses[1]?.title, bonuses[1]?.name),
        bonus2Value: val(bonuses[1]?.value),
        rarity: val(detail?.rarity),
        viaParcel: true,
        parcelId: String(parcelId),
        raw: entry
      });
    }
  }

  return rows;
}


// Lays the hand-made decisions back over the derived rows: a price somebody
// typed, a transaction called a loan, a return the logs cannot show. The
// stores stay the record of what was said - a row is rebuilt from the facts on
// every load and would lose anything kept only on it - but nothing reads them
// directly, so there is one place where a decision meets a transaction.
function applyStatedFacts() {
  for (const spec of LOGS) {
    for (const row of state.rows[spec.key] || []) {
      if (rowAcceptsManualPrice(spec.key, row)) {
        row.price = state.manualPrices.has(row.rowKey)
          ? state.manualPrices.get(row.rowKey)
          : null;
      }
    }
  }
}




// Provenance, not custody: bought by this key holder rather than on someone
// else's behalf or borrowed from them.
function ownerIsUs(row) {
  const owner = effectiveOwner(row);
  return !owner.id || isKeyHolder(owner.id);
}

// Rows are transactions rather than history entries, so the counterparty is
// read straight off the row.
function rowIsInternalTransfer(row, sourceKey) {
  return isInternalTransfer({
    sourceKey,
    toId: row?.receiverId ?? row?.buyerId ?? null,
    fromId: row?.senderId ?? row?.sellerId ?? null
  });
}

function findRowByKey(rowKey) {
  for (const spec of LOGS) {
    const row = (state.rows[spec.key] || []).find(r => r.rowKey === rowKey);
    if (row) return row;
  }
  return null;
}

// ---------------------------------------------------------------------------
// Cache pricing.
//
// A weapon out of a cache cost whatever the cache cost. Torn records neither
// which cache instance was opened nor which was bought, so purchases and
// openings of the same cache type are paired in chronological order: the
// earliest purchase not yet accounted for, provided it happened first. Where no
// purchase can be paired, the cache's market value stands in.
// ---------------------------------------------------------------------------
const RW_CACHE_IDS = new Set(Object.keys(BUNKER_CACHE_COST).map(Number));

function cacheUnitCostFromBuy(data, qty) {
  const each = val(data?.cost_each, data?.price_each, data?.unit_price);
  if (hasPrice(each)) return Number(each);
  const total = val(data?.cost_total, data?.total_price, data?.final_price);
  return hasPrice(total) && qty > 0 ? Number(total) / qty : null;
}

// One entry per cache, so several bought together pair one at a time.
function cacheAcquisitions() {
  const byCache = new Map();
  const add = (cacheId, record) => {
    const id = Number(cacheId);
    if (!RW_CACHE_IDS.has(id)) return;
    if (!byCache.has(id)) byCache.set(id, []);
    byCache.get(id).push(record);
  };

  for (const [logId, source] of [[ITEM_MARKET_BUY_LOG, "Item market"],
                                 [BAZAAR_BUY_LOG, "Bazaar"]]) {
    for (const entry of factLogEntries(logId)) {
      const data = entry?.data || {};
      for (const item of (Array.isArray(data.items) ? data.items : [])) {
        if (!RW_CACHE_IDS.has(Number(item?.id))) continue;
        const qty = Math.max(1, Number(val(item?.qty, item?.quantity, 1)) || 1);
        const unit = cacheUnitCostFromBuy(data, qty);
        for (let i = 0; i < qty; i++) {
          add(item.id, { timestamp: Number(entry.timestamp), unitCost: unit, source });
        }
      }
    }
  }

  // Bought with Bunker Bucks, so there is no money price to carry over.
  for (const entry of factLogEntries(BUNKER_BUY_LOG)) {
    const data = entry?.data || {};
    add(data.item, {
      timestamp: Number(entry.timestamp),
      unitCost: null,
      source: "Bunker",
      bucks: Number(data.bucks) || null
    });
  }

  for (const trade of cacheTrades("in")) {
    for (const entry of trade.caches) {
      for (let i = 0; i < tradeEntryAmount(entry); i++) {
        add(entry.details.id, {
          timestamp: trade.timestamp,
          unitCost: trade.unitPrice,
          source: "Trade",
          tradeId: trade.tradeId
        });
      }
    }
  }

  for (const list of byCache.values()) {
    list.sort((a, b) => a.timestamp - b.timestamp);
  }
  return byCache;
}

// uid of a weapon out of a cache -> how that cache was come by.
function cacheWeaponOrigins() {
  const acquisitions = cacheAcquisitions();
  const nextFree = new Map();
  const origins = new Map();

  const openings = factLogEntries(CACHE_USE_LOG)
    .filter(e => RW_CACHE_IDS.has(Number(e?.data?.item)))
    .sort((a, b) => Number(a.timestamp) - Number(b.timestamp));

  for (const opening of openings) {
    const cacheId = Number(opening.data.item);
    const list = acquisitions.get(cacheId) || [];
    const index = nextFree.get(cacheId) ?? 0;

    // A cache cannot have been opened before it was obtained; if the next
    // unaccounted purchase is later than this opening, it waits for a later one.
    const candidate = list[index];
    const match = candidate && candidate.timestamp <= Number(opening.timestamp)
      ? candidate
      : null;
    if (match) nextFree.set(cacheId, index + 1);

    const produced = (opening.data.items || [])
      .filter(i => i?.uid && Number(i.uid) !== 0);
    if (!produced.length) continue;

    // One cache paid for everything unique that came out of it.
    const share = produced.length;
    for (const item of produced) {
      origins.set(String(item.uid), {
        cacheId,
        unitCost: hasPrice(match?.unitCost) ? Number(match.unitCost) / share : null,
        source: match?.source ?? null,
        tradeId: match?.tradeId ?? null,
        bucks: match?.bucks ?? null
      });
    }
  }

  return origins;
}

// ---------------------------------------------------------------------------
// The bunker chain.
//
// A weapon exchanged at Big Al's becomes Bunker Bucks; Bucks buy a cache; the
// cache is sold, or opened and its contents exchanged in turn. Value flows back
// along that chain, so a weapon is worth its share of whatever its cache
// actually fetched rather than a cache's market value.
//
// Nothing in the logs says which Bucks bought which cache, or which cache was
// sold, so both are paired oldest-first. Bucks are a pool: a weapon's Bucks can
// span two caches, and it earns a share of each.
// ---------------------------------------------------------------------------
const CACHE_CHAIN_DEPTH = 2;
const CACHE_SELL_LOGS = { 1113: "Item market", 1226: "Bazaar" };

// Item market takes a cut, so cost_total is what actually arrived. Bazaar has
// no fee and reports the same figure either way.
function cacheSaleProceeds(data) {
  const total = val(data?.cost_total, data?.total_price, data?.final_price);
  return hasPrice(total) ? Number(total) : null;
}

// A trade shows which way the caches went by whose side they sat on. Without
// checking that, a trade where caches were sold reads exactly like one where
// they were bought.
function cacheTrades(direction) {
  const out = [];

  for (const record of factTrades()) {
    const trade = record?.detail;
    if (!trade) continue;

    const items = normalizeTradeItems(trade);
