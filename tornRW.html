    const isItem = e => String(e?.type ?? "").toLowerCase() === "item";
    const isMoney = e => String(e?.type ?? "").toLowerCase() === "money";

    const allCaches = items.filter(e => isItem(e) && RW_CACHE_IDS.has(Number(e?.details?.id)));
    if (!allCaches.length) continue;

    // Coming in means the other side put the caches up; going out means we did.
    const caches = allCaches.filter(e => direction === "in"
      ? !isKeyHolder(tradeEntrySideId(e))
      : isKeyHolder(tradeEntrySideId(e)));
    if (!caches.length) continue;

    // Money flows the other way from the caches.
    const money = items
      .filter(e => isMoney(e) && (direction === "in"
        ? isKeyHolder(tradeEntrySideId(e))
        : !isKeyHolder(tradeEntrySideId(e))))
      .reduce((n, e) => n + (Number(e?.details?.amount) || 0), 0);

    // One kind of cache against money and nothing else can be split by number;
    // any other mix cannot be apportioned.
    const rest = items.filter(e => !caches.includes(e));
    const distinct = new Set(caches.map(e => Number(e.details.id)));
    const count = caches.reduce((n, e) => n + tradeEntryAmount(e), 0);
    const splittable = distinct.size === 1 && rest.every(isMoney) && money > 0;

    out.push({
      tradeId: trade.id,
      timestamp: Number(val(trade.completed_at, trade.timestamp)),
      caches,
      count,
      money,
      unitPrice: splittable ? money / count : null
    });
  }

  return out.sort((a, b) => a.timestamp - b.timestamp);
}

function cacheSales() {
  const sales = [];
  for (const [logId, source] of Object.entries(CACHE_SELL_LOGS)) {
    for (const entry of factLogEntries(logId)) {
      const data = entry?.data || {};
      for (const item of (Array.isArray(data.items) ? data.items : [])) {
        const cacheId = Number(item?.id);
        if (!RW_CACHE_IDS.has(cacheId)) continue;
        const qty = Math.max(1, Number(val(item?.qty, item?.quantity, 1)) || 1);
        const proceeds = cacheSaleProceeds(data);
        for (let i = 0; i < qty; i++) {
          sales.push({
            timestamp: Number(entry.timestamp),
            cacheId,
            source,
            buyerId: primitiveId(data?.buyer),
            proceeds: proceeds === null ? null : proceeds / qty,
            fee: Number(val(data?.fee, 0)) / qty
          });
        }
      }
    }
  }
  for (const trade of cacheTrades("out")) {
    for (const entry of trade.caches) {
      for (let i = 0; i < tradeEntryAmount(entry); i++) {
        sales.push({
          timestamp: trade.timestamp,
          cacheId: Number(entry.details.id),
          source: "Trade",
          tradeId: trade.tradeId,
          buyerId: null,
          proceeds: trade.unitPrice,
          fee: 0
        });
      }
    }
  }

  return sales.sort((a, b) => a.timestamp - b.timestamp);
}

// Which weapons' Bucks paid for which cache purchase, oldest Bucks first.
function bunkerBuckLedger() {
  // Several weapons exchanged in one sitting carry the same timestamp, and the
  // order rows arrive in is not stable between loads. Which of them is spent
  // first does not matter, but it must be the same answer every time, or the
  // same history values a weapon differently on each rebuild - so equal
  // timestamps are settled by UID.
  const lots = (state.rows.bunkerSells || [])
    .filter(r => r.bunkerBucks > 0)
    .map(r => ({
      timestamp: Number(r.timestamp),
      uid: String(r.uid),
      bucks: Number(r.bunkerBucks),
      remaining: Number(r.bunkerBucks)
    }))
    .sort((a, b) => a.timestamp - b.timestamp ||
      String(a.uid).localeCompare(String(b.uid), undefined, { numeric: true }));

  const purchases = [];
  for (const entry of factLogEntries(BUNKER_BUY_LOG)) {
    const cacheId = Number(entry?.data?.item);
    if (!RW_CACHE_IDS.has(cacheId)) continue;
    purchases.push({
      timestamp: Number(entry.timestamp),
      cacheId,
      bucks: Number(entry?.data?.bucks) || BUNKER_CACHE_COST[cacheId] || 0,
      contributions: []
    });
  }
  purchases.sort((a, b) => a.timestamp - b.timestamp);

  // Equal timestamps on both sides too, so a purchase made in the same sitting
  // as the exchange that paid for it is funded by it rather than skipped.
  purchases.sort((a, b) => a.timestamp - b.timestamp || a.cacheId - b.cacheId);

  for (const purchase of purchases) {
    let outstanding = purchase.bucks;
    // Oldest lot first, and each one emptied before the next is touched: a
    // weapon is never left part-spent while a later one is being drawn on.
    for (const lot of lots) {
      if (outstanding <= 0) break;
      if (lot.remaining <= 0 || lot.timestamp > purchase.timestamp) continue;
      const taken = Math.min(lot.remaining, outstanding);
      lot.remaining -= taken;
      outstanding -= taken;
      purchase.contributions.push({ uid: lot.uid, bucks: taken });
    }
    // Bucks earned before the logs begin cannot be attributed to a weapon.
    purchase.unfunded = outstanding;
  }

  return { lots, purchases };
}

// Every cache that came in, paired oldest-first with every cache that went out,
// whether sold or opened.
function cacheChain() {
  const acquisitions = cacheAcquisitions();
  const ledger = bunkerBuckLedger();

  // A bunker purchase is also an acquisition; carry its Buck contributions over.
  for (const purchase of ledger.purchases) {
    const list = acquisitions.get(purchase.cacheId) || [];
    const match = list.find(a =>
      a.source === "Bunker" && a.timestamp === purchase.timestamp && !a.contributions);
    if (match) {
      match.contributions = purchase.contributions;
      match.bucks = purchase.bucks;
    }
  }

  const openings = factLogEntries(CACHE_USE_LOG)
    .filter(e => RW_CACHE_IDS.has(Number(e?.data?.item)))
    .map(e => ({
      kind: "opened",
      timestamp: Number(e.timestamp),
      cacheId: Number(e.data.item),
      produced: (e.data.items || []).filter(i => i?.uid && Number(i.uid) !== 0)
        .map(i => String(i.uid))
    }));

  const disposals = [...openings, ...cacheSales().map(sale => ({ ...sale, kind: "sold" }))]
    .sort((a, b) => a.timestamp - b.timestamp);

  const nextFree = new Map();
  for (const disposal of disposals) {
    const list = acquisitions.get(disposal.cacheId) || [];
    const index = nextFree.get(disposal.cacheId) ?? 0;
    const candidate = list[index];
    if (candidate && candidate.timestamp <= disposal.timestamp) {
      nextFree.set(disposal.cacheId, index + 1);
      disposal.acquisition = candidate;
      candidate.disposal = disposal;
    }
  }

  return { acquisitions, disposals, ledger };
}

// What a cache turned out to be worth. A sale says so outright; an opening is
// worth what came out of it, until the chain runs too deep to be meaningful.
function resolveCacheValue(acquisition, chain, depth, seen) {
  if (!acquisition || depth > CACHE_CHAIN_DEPTH) return null;
  if (seen.has(acquisition)) return null;
  seen.add(acquisition);

  const disposal = acquisition.disposal;
  if (disposal?.kind === "sold" && hasPrice(disposal.proceeds)) return disposal.proceeds;

  if (disposal?.kind === "opened" && depth < CACHE_CHAIN_DEPTH) {
    let total = 0;
    let known = false;
    for (const uid of disposal.produced) {
      const resolved = resolveWeaponValue(uid, chain, depth + 1, seen);
      if (resolved !== null) { total += resolved.value; known = true; }
    }
    if (known) return total;
  }

  return null;
}

// What a weapon exchanged at the bunker turned out to be worth.
//
// The Bucks it earned are worth whatever the caches they bought went on to
// fetch - but only the Bucks actually spent have an answer of that kind. Bucks
// still in hand, or spent on a cache whose fate is unknown, are worth the going
// rate, the same figure an unspent exchange is quoted at. Counting only the
// spent part would value a 12-Buck weapon at four Bucks' worth.
function resolveWeaponValue(uid, chain, depth, seen) {
  if (depth > CACHE_CHAIN_DEPTH) return null;

  let total = 0;
  let resolvedBucks = 0;

  for (const purchase of chain.ledger.purchases) {
    const share = purchase.contributions.find(c => c.uid === String(uid));
    if (!share || !purchase.bucks) continue;

    const acquisition = (chain.acquisitions.get(purchase.cacheId) || [])
      .find(a => a.source === "Bunker" && a.timestamp === purchase.timestamp);
    const cacheValue = resolveCacheValue(acquisition, chain, depth, new Set(seen));
    if (cacheValue === null) continue;

    total += share.bucks * (cacheValue / purchase.bucks);
    resolvedBucks += share.bucks;
  }

  if (!resolvedBucks) return null;

  const lot = chain.ledger.lots.find(l => l.uid === String(uid));
  const rest = Math.max(0, Number(lot?.bucks || 0) - resolvedBucks);
  const rate = bunkerBuckValue();

  // Nothing to value the remainder at; the part that is known is still a floor,
  // but calling it the weapon's worth would understate it, so it is not.
  if (rest > 0 && !rate) return null;

  return {
    value: total + rest * rate,
    resolvedBucks,
    estimatedBucks: rest
  };
}

// uid -> what the chain says the weapon realised, and how it got there.
function bunkerChainValues() {
  const chain = cacheChain();
  const out = new Map();

  for (const row of state.rows.bunkerSells || []) {
    const uid = String(row.uid);
    const resolved = resolveWeaponValue(uid, chain, 0, new Set());
    if (resolved !== null) {
      out.set(uid, {
        value: Math.round(resolved.value),
        basis: resolved.estimatedBucks > 0 ? "part-chain" : "chain",
        resolvedBucks: resolved.resolvedBucks,
        estimatedBucks: resolved.estimatedBucks
      });
    }
  }

  // What a cache turned out to be worth is also what its contents cost. Without
  // this the intermediate step is counted twice: the weapon exchanged for the
  // cache realises the final sale, and so does the weapon that came out of it.
  const openedCost = new Map();
  for (const disposal of chain.disposals) {
    if (disposal.kind !== "opened" || !disposal.acquisition) continue;
    const value = resolveCacheValue(disposal.acquisition, chain, 0, new Set());
    if (value === null || !disposal.produced.length) continue;
    for (const uid of disposal.produced) {
      openedCost.set(String(uid), Math.round(value / disposal.produced.length));
    }
  }

  return { values: out, openedCost, chain };
}

function tradeReceiptById(tradeId, owner) {
  const trade = activeRaw().trades[String(tradeId)]?.detail;
  if (!trade) return null;
  const uids = normalizeTradeItems(trade)
    .map(tradeEntryUid)
    .filter(Boolean);
  const detailMap = new Map(
    uids.map(uid => [uid, activeRaw().itemDetails[uid]]).filter(([, d]) => d)
  );
  return buildTradeReceipt(trade, owner, detailMap);
}

function priceCacheRows(rows, owner) {
  const origins = cacheWeaponOrigins();

  for (const row of rows) {
    const origin = origins.get(String(row.uid));
    if (!origin) continue;

    const marketValue = state.itemMarketValueCache.get(Number(origin.cacheId));
    const derived = hasPrice(origin.unitCost) ? Number(origin.unitCost) : null;
    const price = derived !== null
      ? derived
      : (hasPrice(marketValue) ? Number(marketValue) : null);

    if (price !== null) row.price = Math.round(price);
    row.cacheId = origin.cacheId;
    row.cacheSource = origin.source;
    row.cacheEstimated = derived === null;
    if (origin.bucks) row.bunkerBucks = origin.bucks;
    if (origin.tradeId) {
      row.tradeId = origin.tradeId;
      row.receipt = tradeReceiptById(origin.tradeId, owner);
    }
  }
}

async function refreshItemMarketFromKeys() {
  const keys = [...document.querySelectorAll(".api-key-input")]
    .map(input => input.value.trim())
    .filter(Boolean);

  if (!keys.length) {
    status("Enter an API key before loading item market listings.", true);
    return;
  }

  state.marketLoading = true;
  render();
  try {
    await state.startupRebuild;
    return await runExclusive(async () => {
    for (const key of keys) {
      setKeyPhase(key, "item market listings");
      const owner = await getOwnerBasic(key);
      state.loadedOwners.set(String(owner.id), owner.name);
      status(`${owner.name}: loading item market listings...`);
      await ensureEquipmentCatalog(key);
      await loadItemMarket(key, owner);
      state.marketLoading = false;
      render();
      state.marketLoading = true;
    }
    status(`Item market: ${state.marketRows.length} weapon/armour listings loaded.`);
    });
  } catch (err) {
    console.error(err);
    status(err?.message || String(err), true);
  } finally {
    state.marketLoading = false;
    render();
  }
}

// A log is walked newest to oldest, so an interrupted walk is resumed by asking
// for everything older than the oldest entry already saved. The watermark is no
// use for that: it marks the newest entry, and resuming from it would skip the
// history the walk had not reached yet.
async function getAllLogEntries(logId, key, fromTimestamp=null) {
  if (state.offline) return logEntriesFromRaw(logId);

  const cursors = activeRaw().logCursors || (activeRaw().logCursors = {});
  const resumeFrom = Number(cursors[String(logId)] || 0);

  let url = `/user/log?log=${logId}&limit=100&sort=desc`;
  if (fromTimestamp) url += `&from=${encodeURIComponent(fromTimestamp)}`;
  if (resumeFrom) url += `&to=${encodeURIComponent(resumeFrom)}`;

  const seenUrls = new Set();

  while (url && !seenUrls.has(url)) {
    seenUrls.add(url);
    const j = await apiFetch(url, key);

    const batch = val(j?.log, j?.logs, j?.data?.log, j?.data?.logs, []);
    const entries = Array.isArray(batch)
      ? batch
      : (batch && typeof batch === "object" ? Object.values(batch) : []);
    recordRawLogEntries(logId, entries);

    // How far back this walk has reached, saved with the entries so an
    // interruption costs only the page in flight.
    const oldest = entries.reduce(
      (m, e) => Math.min(m, Number(e?.timestamp ?? Infinity)), Infinity);
    if (Number.isFinite(oldest)) cursors[String(logId)] = oldest;
    await state.saveFacts?.();

    const prev = val(
      j?._metadata?.links?.prev,
      j?.metadata?.links?.prev,
      j?._metadata?.prev,
      j?.metadata?.prev,
      j?.pagination?.prev,
      j?.links?.prev
    );
    url = paginationUrl(prev, { log: logId, limit: 100, sort: "desc" });
  }

  delete cursors[String(logId)];

  // Everything saved for this log, not just what this pass fetched, so a
  // resumed walk still derives rows from the whole history.
  return logEntriesFromRaw(logId);
}

// The API's pagination links do not always carry the filters of the request
// that produced them - /user/trades drops `cat`, which silently turns page two
// into a different query that ends the walk. Our own parameters are re-applied
// to every link, keeping only the cursor the API chose.
function paginationUrl(link, params) {
  if (!link) return null;
  const u = new URL(String(link).replace(/^\/+/, ""), API);
  for (const [k, v] of Object.entries(params)) {
    if (v !== null && v !== undefined) u.searchParams.set(k, String(v));
  }
  u.searchParams.delete("key");
  u.searchParams.delete("comment");
  return u.toString();
}

async function getAllTrades(key, fromTimestamp=null) {
  if (state.offline) {
    return Object.values(activeRaw().trades).map(t => t?.summary).filter(Boolean);
  }

  const cursors = activeRaw().logCursors || (activeRaw().logCursors = {});
  const resumeFrom = Number(cursors.trades || 0);

  let url = "/user/trades?cat=finished&limit=100&sort=desc";
  if (fromTimestamp) url += `&from=${encodeURIComponent(fromTimestamp)}`;
  if (resumeFrom) url += `&to=${encodeURIComponent(resumeFrom)}`;

  // The `to=` cursor is inclusive, so consecutive pages overlap by a trade or
  // two; collect by id rather than appending.
  const byId = new Map();
  const seenUrls = new Set();

  while (url && !seenUrls.has(url)) {
    seenUrls.add(url);
    const j = await apiFetch(url, key);
    const batch = val(j?.trades, j?.data?.trades, []);
    if (Array.isArray(batch)) {
      for (const summary of batch) {
        const id = val(summary?.id);
        if (id === null || id === undefined) continue;
        byId.set(String(id), summary);
        rawTradeBucket(id).summary = summary;
      }
      const oldest = batch.reduce(
        (m, t) => Math.min(m, Number(val(t?.completed_at, t?.timestamp) ?? Infinity)), Infinity);
      if (Number.isFinite(oldest)) cursors.trades = oldest;
      await state.saveFacts?.();
    }

    const prev = val(
      j?._metadata?.links?.prev,
      j?.metadata?.links?.prev,
      j?._metadata?.prev,
      j?.metadata?.prev,
      j?.links?.prev
    );
    url = paginationUrl(prev, { cat: "finished", limit: 100, sort: "desc" });
  }

  delete cursors.trades;
  return Object.values(activeRaw().trades).map(t => t?.summary).filter(Boolean);
}

async function getTradeDetails(tradeId, key) {
  const saved = activeRaw().trades[String(tradeId)]?.detail;
  if (saved) return saved;
  if (state.offline) return null;

  const j = await apiFetch(`/user/${encodeURIComponent(tradeId)}/trade`, key);
  const detail = val(j?.trade, j?.data?.trade, j);
  rawTradeBucket(tradeId).detail = detail;
  return detail;
}

const EXCLUDED_TRADE_DESCRIPTION = /^(?:plushie|flower|flushie|xanax|xanie|dp|dono)(?:s|es)?$/i;

function shouldSkipTradeSummary(trade) {
  return EXCLUDED_TRADE_DESCRIPTION.test(String(trade?.description ?? "").trim());
}

function normalizeTradeItems(trade) {
  return Array.isArray(trade?.items) ? trade.items : [];
}

function tradeCounterparty(trade, ownerId) {
  const owner = String(ownerId);
  const user = trade?.user || {};
  const trader = trade?.trader || {};

  if (String(user?.id ?? "") === owner) {
    return {
      id: trader?.id !== undefined && trader?.id !== null ? String(trader.id) : null,
      name: trader?.name ?? null
    };
  }

  if (String(trader?.id ?? "") === owner) {
    return {
      id: user?.id !== undefined && user?.id !== null ? String(user.id) : null,
      name: user?.name ?? null
    };
  }

  return { id: null, name: null };
}

// The trade payload carries neither item names nor values, so both come from
// here and are kept as facts: a rebuild reproduces the valuation the rows were
// originally given rather than repricing them at today's market.
async function getItemMarketValues(itemIds, key) {
  const ids = [...new Set(itemIds.map(Number).filter(Number.isFinite))];
  const missing = ids.filter(id => !(String(id) in activeRaw().itemRecords));

  if (missing.length && !state.offline) {
    for (let i = 0; i < missing.length; i += 25) {
      const chunk = missing.slice(i, i + 25);
      const j = await apiFetch(`/torn/${chunk.join(",")}/items`, key);
      const items = normalizeItemList(j);

      const returned = new Set();
      for (const item of items) {
        const id = Number(val(item?.id, item?.item_id, item?.itemID));
        if (!Number.isFinite(id)) continue;
        returned.add(id);
        recordRawItem(item);
      }

      // Record the gap too, so an id the API will not resolve is not retried
      // on every future load.
      for (const id of chunk) {
        if (!returned.has(id)) {
          recordRawItem({ id, name: null, value: { market_price: null }, unresolved: true });
        }
      }
    }
  }

  return new Map(ids.map(id => [
    id,
    state.itemMarketValueCache.has(id) ? state.itemMarketValueCache.get(id) : null
  ]));
}

// The only two items people hand over as money in these trades. Everything
// else is goods: its presence makes that side's cash value unknown rather than
// being counted at whatever the market says it is worth today.
const CASH_EQUIVALENT_IDS = new Set([
  206,  // Xanax
  283   // Donator Pack
]);

// What one side of a trade is worth as cash: money plus the cash-equivalent
// items, ignoring the weapons being priced. Null means the side holds
// something that cannot be turned into a number, so no price follows from it.
async function tradeSideCash(tradeItems, sideUserId, key, ignoreUids=new Set()) {
  const sideId = String(sideUserId);
  const side = tradeItems.filter(x => tradeEntrySideId(x) === sideId);

  if (!side.length) return null;

  const itemIds = side
    .filter(e => String(e?.type ?? "").toLowerCase() === "item")
    .map(tradeEntryItemId)
    .filter(id => id !== null && CASH_EQUIVALENT_IDS.has(id));
  const values = itemIds.length ? await getItemMarketValues(itemIds, key) : new Map();

  let total = 0;

  for (const entry of side) {
    const type = String(entry?.type ?? "").toLowerCase();

    if (type === "money") {
      const amount = Number(val(entry?.details?.amount, entry?.details?.value, 0));
      if (!Number.isFinite(amount)) return null;
      total += amount;
      continue;
    }

    if (type !== "item") return null;

    const uid = tradeEntryUid(entry);
    if (uid && ignoreUids.has(String(uid))) continue;

    const id = tradeEntryItemId(entry);
    if (id === null || !CASH_EQUIVALENT_IDS.has(id)) return null;

    const amount = tradeEntryAmount(entry);
    const market = values.get(id);
    if (!Number.isFinite(market)) return null;
    total += market * amount;
  }

  return total;
}

function tradeEntryItemId(entry) {
  const id = Number(val(entry?.details?.id, entry?.details?.item_id, entry?.details?.itemId));
  return Number.isFinite(id) ? id : null;
}
function tradeEntryAmount(entry) {
  const amount = Number(val(
    entry?.details?.amount, entry?.details?.qty, entry?.details?.quantity, 1
  ));
  return Number.isFinite(amount) && amount > 0 ? amount : 1;
}
function tradeEntrySideId(entry) {
  return String(val(entry?.user_id, entry?.userId) ?? "");
}
function tradeEntryUid(entry) {
  const uid = val(entry?.details?.uid, entry?.details?.unique_id, entry?.details?.uniqueId);
  return uid !== null && uid !== undefined && Number(uid) !== 0 ? String(uid) : null;
}

// Weapon/armour membership comes from the /torn/items catalog, so stackable and
// non-unique equipment counts too, not just the UID-bearing entries.
function tradeEquipmentEntries(items) {
  return items.filter(entry => {
    if (String(entry?.type ?? "").toLowerCase() !== "item") return false;
    const id = tradeEntryItemId(entry);
    return id !== null && state.equipmentIds.has(id);
  });
}


// What a trade can be made to say about the weapons in it.
//
// One qualifying weapon against cash is priced at that cash, less whatever
// cash-equivalent was handed over alongside the weapon: a weapon plus 10 Xanax
// for $100m is a weapon for $100m minus what the Xanax were worth.
//
// Several weapons against cash cannot be split by arithmetic alone, so they
// are left blank - but every weapon has a published Bunker Buck rate, and that
// is a defensible way to share the money out if a person asks for it. That is
// offered rather than applied.
async function tradeValuationPlan(items, detailMap, owner, counterparty, key) {
  const plan = {
    weapons: [], unknownEquipment: 0, sides: new Set(),
    weaponSideId: null, oppositeSideId: null,
    otherCash: null, ownCash: null, net: null,
    autoPrice: null, split: null
  };

  for (const entry of tradeEquipmentEntries(items)) {
    const uid = tradeEntryUid(entry);
    const detail = uid ? detailMap?.get(String(uid)) : null;
    const rarity = String(detail?.rarity ?? "").toLowerCase();

    if (uid && QUALIFYING_RARITIES.has(rarity)) {
      plan.weapons.push({
        uid: String(uid),
        sideId: tradeEntrySideId(entry),
        bucks: bunkerBucksFor({
          itemId: Number(val(detail?.id, detail?.item_id)),
          rarity,
          bonus1: val(detail?.bonuses?.[0]?.title, detail?.bonuses?.[0]?.name),
          bonus2: val(detail?.bonuses?.[1]?.title, detail?.bonuses?.[1]?.name)
        })
      });
      plan.sides.add(tradeEntrySideId(entry));
    } else {
      plan.unknownEquipment += tradeEntryAmount(entry);
    }
  }

  if (!plan.weapons.length || plan.sides.size > 1 || plan.unknownEquipment > 0) return plan;
  if (!counterparty?.id) return plan;

  plan.weaponSideId = [...plan.sides][0];
  plan.oppositeSideId = plan.weaponSideId === String(owner.id)
    ? String(counterparty.id)
    : String(owner.id);

  const ours = new Set(plan.weapons.map(w => w.uid));
  plan.otherCash = await tradeSideCash(items, plan.oppositeSideId, key);
  plan.ownCash = await tradeSideCash(items, plan.weaponSideId, key, ours);

  if (plan.otherCash === null || plan.ownCash === null) return plan;

  // A weapon handed over for less than the goods that went with it is not a
  // price anybody meant; it stays blank rather than going negative.
  const net = plan.otherCash - plan.ownCash;
  if (net < 0) return plan;
  plan.net = net;

  if (plan.weapons.length === 1) {
    plan.autoPrice = net;
    return plan;
  }

  const totalBucks = plan.weapons.reduce((n, w) => n + (w.bucks || 0), 0);
  if (!totalBucks || plan.weapons.some(w => !w.bucks)) return plan;

  const prices = new Map(plan.weapons.map(w =>
    [w.uid, Math.floor(net * w.bucks / totalBucks)]));

  // Flooring leaves a few dollars over; they go to the largest share so the
  // prices add up to the money that actually changed hands.
  const remainder = net - [...prices.values()].reduce((a, b) => a + b, 0);
  if (remainder > 0) {
    const biggest = plan.weapons.reduce((a, b) => (b.bucks > a.bucks ? b : a));
    prices.set(biggest.uid, prices.get(biggest.uid) + remainder);
  }

  plan.split = {
    net,
    totalBucks,
    prices,
    bucks: new Map(plan.weapons.map(w => [w.uid, w.bucks]))
  };
  return plan;
}

function tradeReceiptEntry(entry, detailMap) {
  const type = String(entry?.type ?? "").toLowerCase();

  if (type === "money") {
    const amount = Number(val(entry?.details?.amount, entry?.details?.value, 0));
    return { kind: "money", amount: Number.isFinite(amount) ? amount : null };
  }

  const itemId = tradeEntryItemId(entry);
  const uid = tradeEntryUid(entry);
  const detail = uid ? detailMap.get(uid) : null;
  const stats = detail?.stats || {};
  const bonuses = Array.isArray(detail?.bonuses) ? detail.bonuses : [];
  const catalogItem = itemId === null ? null : state.itemsById.get(itemId);

  return {
    kind: "item",
    itemId,
    uid,
    name: val(detail?.name, catalogItem?.name, state.itemNameCache.get(itemId)),
    amount: tradeEntryAmount(entry),
    rarity: val(detail?.rarity),
    armor: val(stats?.armor, stats?.armour),
    damage: val(stats?.damage),
    accuracy: val(stats?.accuracy),
    bonuses: bonuses
      .slice(0, 2)
      .map(b => ({ title: val(b?.title, b?.name), value: val(b?.value) }))
      .filter(b => b.title)
  };
}

// Flattened once at load time so the modal needs no further API calls, and so
// it survives a reload from the IndexedDB row cache.
function buildTradeReceipt(trade, owner, detailMap) {
  const items = normalizeTradeItems(trade);

  const parties = [trade?.user, trade?.trader]
    .filter(party => party && party.id !== undefined && party.id !== null)
    .map(party => ({ id: String(party.id), name: party.name ?? null }));

  return {
    tradeId: val(trade?.id),
    timestamp: val(trade?.completed_at, trade?.timestamp),
    description: trade?.description ?? null,
    sides: parties.map(party => ({
      id: party.id,
      name: party.name,
      isOwner: party.id === String(owner.id),
      entries: items
        .filter(entry => tradeEntrySideId(entry) === party.id)
        .map(entry => tradeReceiptEntry(entry, detailMap))
    }))
  };
}

function detailToTradeRow(detail, trade, direction, owner, counterparty, price) {
  const stats = detail?.stats || {};
  const bonuses = Array.isArray(detail?.bonuses) ? detail.bonuses : [];
  const uid = String(detail?.uid);
  const timestamp = val(trade?.completed_at, trade?.timestamp);

  return {
    timestamp,
    rowKey: `${owner.id}:trade:${trade?.id}:${uid}:${direction}`,
    tradeId: val(trade?.id),
    itemId: Number(val(detail?.id, detail?.item_id)),
    uid,
    qty: 1,
    price,
    senderId: direction === "buy" ? counterparty.id : null,
    receiverId: direction === "sell" ? counterparty.id : null,
    sender: direction === "buy" ? counterparty.name : null,
    receiver: direction === "sell" ? counterparty.name : null,
    party: counterparty.name,
    partyId: counterparty.id ?? null,
    from: direction === "buy" ? counterparty.name : owner.name,
    to: direction === "buy" ? owner.name : counterparty.name,
    owner: owner.name,
    ownerId: String(owner.id),
    name: detail?.name ?? "",
    quality: val(stats?.quality),
    armor: val(stats?.armor, stats?.armour),
    damage: val(stats?.damage),
    accuracy: val(stats?.accuracy),
    bonus1: val(bonuses[0]?.title, bonuses[0]?.name),
    bonus1Value: val(bonuses[0]?.value),
    bonus2: val(bonuses[1]?.title, bonuses[1]?.name),
    bonus2Value: val(bonuses[1]?.value),
    rarity: val(detail?.rarity),
    raw: trade
  };
}

async function loadTradeRows(owner, key, ownerDebug, fromTimestamp=null) {
  status(`${owner.name}: loading trades...`);
  setKeyPhase(key, "trade list /user/trades");
  const summaries = await getAllTrades(key, fromTimestamp);

  const skippedByDescription = summaries.filter(shouldSkipTradeSummary);
  const candidates = summaries.filter(t => !shouldSkipTradeSummary(t));

  const buys = [];
  const sells = [];

  const tradeDebug = {
    owner: { id: String(owner.id), name: owner.name },
    category: "finished",
    rawTradeCount: summaries.length,
    rawTrades: summaries,
    skippedByDescriptionCount: skippedByDescription.length,
    skippedByDescription,
    candidateCount: candidates.length,
    inspectedCount: 0,
    tradesWithUidItems: 0,
    totalUidCandidates: 0,
    itemDetailsResolved: 0,
    rejectedMissingItemDetails: 0,
    rejectedWhiteRarity: 0,
    rejectedWrongType: 0,
    rejectedNoCounterparty: 0,
    acceptedBuys: 0,
    acceptedSells: 0,
    details: [],
    perTrade: []
  };

  for (let i = 0; i < candidates.length; i++) {
    const summary = candidates[i];
    status(`${owner.name}: inspecting trade ${i + 1}/${candidates.length}...`);

    const debug = {
      id: summary?.id ?? null,
      description: summary?.description ?? "",
      summary,
      detail: null,
      itemCount: 0,
      uidCandidateCount: 0,
      uidCandidates: [],
      counterparty: null,
      decisions: [],
      result: "no matching equipment"
    };
    tradeDebug.perTrade.push(debug);

    setKeyPhase(key, `trade ${summary.id} detail`);
    const trade = await getTradeDetails(summary.id, key);
    tradeDebug.inspectedCount += 1;
    tradeDebug.details.push(trade);
    debug.detail = trade;

    const items = normalizeTradeItems(trade);
    debug.itemCount = items.length;

    const uniqueCandidates = items.filter(entry => {
      if (String(entry?.type ?? "").toLowerCase() !== "item") return false;
      const uid = val(entry?.details?.uid, entry?.details?.unique_id, entry?.details?.uniqueId);
      return uid !== null && Number(uid) !== 0;
    });

    debug.uidCandidateCount = uniqueCandidates.length;
    debug.uidCandidates = uniqueCandidates;
    tradeDebug.totalUidCandidates += uniqueCandidates.length;

    if (!uniqueCandidates.length) {
      debug.result = "no item entries with UID";
      continue;
    }

    tradeDebug.tradesWithUidItems += 1;

    const uids = uniqueCandidates.map(x =>
      String(val(x?.details?.uid, x?.details?.unique_id, x?.details?.uniqueId))
    );

    setKeyPhase(key, `trade ${summary.id} itemdetails`);
    const detailMap = await getDetailsForUids(uids, key);
    const counterparty = tradeCounterparty(trade, owner.id);
    debug.counterparty = counterparty;

    // Resolve names for the non-unique items so the receipt can label them even
    // when this trade is never valued.
    const plainItemIds = items
      .filter(entry => String(entry?.type ?? "").toLowerCase() === "item" && !tradeEntryUid(entry))
      .map(tradeEntryItemId)
      .filter(id => id !== null && !state.itemNameCache.has(id));
    if (plainItemIds.length) {
      setKeyPhase(key, `trade ${summary.id} item names`);
      try {
        await getItemMarketValues(plainItemIds, key);
      } catch (_) {}
    }

    setKeyPhase(key, `trade ${summary.id} valuation`);
    const plan = await tradeValuationPlan(items, detailMap, owner, counterparty, key);
    const ambiguous = plan.autoPrice === null;
    const receipt = buildTradeReceipt(trade, owner, detailMap);
    debug.valuationPlan = {
      weapons: plan.weapons.length,
      unknownEquipment: plan.unknownEquipment,
      otherCash: plan.otherCash,
      ownCash: plan.ownCash,
      net: plan.net,
      autoPrice: plan.autoPrice,
      splittable: !!plan.split
    };
    debug.equipmentCount = tradeEquipmentEntries(items).reduce((n, e) => n + tradeEntryAmount(e), 0);
    debug.valuationAmbiguous = ambiguous;
    debug.receipt = receipt;

    if (!counterparty?.id) {
      tradeDebug.rejectedNoCounterparty += uniqueCandidates.length;
    }

    for (const entry of uniqueCandidates) {
      const uid = String(val(entry?.details?.uid, entry?.details?.unique_id, entry?.details?.uniqueId));
      const decision = {
        uid,
        entry,
        itemDetail: null,
        rarity: null,
        type: null,
        weaponSideId: String(entry?.user_id ?? entry?.userId ?? ""),
        direction: null,
        oppositeSideId: null,
        price: null,
        accepted: false,
        reason: null
      };
      debug.decisions.push(decision);

      const detail = detailMap.get(uid);
      decision.itemDetail = detail || null;

      if (!detail) {
        tradeDebug.rejectedMissingItemDetails += 1;
        decision.reason = "itemdetails missing/unresolvable";
        continue;
      }

      tradeDebug.itemDetailsResolved += 1;

      const rarity = String(detail?.rarity ?? "").toLowerCase();
      const type = String(detail?.type ?? "").toLowerCase();
      decision.rarity = rarity || null;
      decision.type = type || null;

      if (!["yellow", "orange", "red"].includes(rarity)) {
        tradeDebug.rejectedWhiteRarity += 1;
        decision.reason = `rarity rejected: ${rarity || "null"}`;
        continue;
      }

      // The catalog is authoritative; itemdetails recovered from a legacy row
      // cache carries stats and rarity but no type.
      const detailItemId = Number(val(detail?.id, detail?.item_id));
      const isEquipment = type.includes("weapon") || type.includes("armor") ||
        type.includes("armour") ||
        (Number.isFinite(detailItemId) && state.equipmentIds.has(detailItemId));

      if (!isEquipment) {
        tradeDebug.rejectedWrongType += 1;
        decision.reason = `type rejected: ${type || "null"}`;
        continue;
      }

      if (!counterparty?.id) {
        decision.reason = "counterparty could not be resolved";
        continue;
      }

      const weaponSideId = decision.weaponSideId;
      const direction = weaponSideId === String(owner.id) ? "sell" : "buy";
      const oppositeSideId = direction === "sell" ? counterparty.id : String(owner.id);

      decision.direction = direction;
      decision.oppositeSideId = oppositeSideId;

      const price = ambiguous ? null : plan.autoPrice;
      decision.price = price;

      const row = detailToTradeRow(detail, trade, direction, owner, counterparty, price);
      row.receipt = receipt;

      // Offered, not applied: the row carries what its share would be so the
      // receipt can show the figure and a person can accept it.
      if (plan.split?.prices.has(uid)) {
        row.bbSplitPrice = plan.split.prices.get(uid);
        row.bbSplitBucks = plan.split.bucks.get(uid);
        row.bbSplitTotalBucks = plan.split.totalBucks;
        row.bbSplitCash = plan.split.net;
      }

      // Either the split cannot be derived, or the other side could not be
      // valued at all. Both are unknown values, so both become editable.
      const priceUnknown = ambiguous || price === null || price === undefined;
      if (priceUnknown) {
        row.priceEditable = true;
        row.price = state.manualPrices.has(row.rowKey)
          ? state.manualPrices.get(row.rowKey)
          : null;
      }

      decision.accepted = true;
      decision.reason = priceUnknown ? "accepted (price hand-editable)" : "accepted";

      if (direction === "sell") {
        sells.push(row);
        tradeDebug.acceptedSells += 1;
      } else {
        buys.push(row);
        tradeDebug.acceptedBuys += 1;
      }
    }

    const acceptedHere = debug.decisions.filter(x => x.accepted).length;
    debug.result = acceptedHere
      ? `${acceptedHere} accepted`
      : "UID item(s) found, all rejected";

    // Inspecting trades is the longest stretch of a load, so the details
    // gathered so far are kept every ten seconds.
    await state.saveFacts?.();
  }

  tradeDebug.buyRows = buys;
  tradeDebug.sellRows = sells;
  ownerDebug.trades = tradeDebug;

  console.group(`[Torn trade debug] ${owner.name}`);
  console.log("Summary:", {
    rawTradeCount: tradeDebug.rawTradeCount,
    skippedByDescriptionCount: tradeDebug.skippedByDescriptionCount,
    candidateCount: tradeDebug.candidateCount,
    inspectedCount: tradeDebug.inspectedCount,
    tradesWithUidItems: tradeDebug.tradesWithUidItems,
    totalUidCandidates: tradeDebug.totalUidCandidates,
    itemDetailsResolved: tradeDebug.itemDetailsResolved,
    rejectedMissingItemDetails: tradeDebug.rejectedMissingItemDetails,
    rejectedWhiteRarity: tradeDebug.rejectedWhiteRarity,
    rejectedWrongType: tradeDebug.rejectedWrongType,
    rejectedNoCounterparty: tradeDebug.rejectedNoCounterparty,
    acceptedBuys: tradeDebug.acceptedBuys,
    acceptedSells: tradeDebug.acceptedSells
  });
  console.log("Per-trade decisions:", tradeDebug.perTrade);
  console.log("Buy rows:", buys);
  console.log("Sell rows:", sells);
  console.groupEnd();

  return { buys, sells };
}
function primitiveId(...values) {
  for (const value of values) {
    if (value === null || value === undefined || value === "") continue;

    if (typeof value === "number" && Number.isFinite(value)) return value;
    if (typeof value === "string" && value.trim() !== "") return value.trim();

    // Sometimes Torn embeds a user object instead of a bare ID.
    if (value && typeof value === "object") {
      const nested = val(value?.id, value?.user_id, value?.userId, value?.player_id, value?.playerId);
      if (nested !== null && (typeof nested === "number" || typeof nested === "string")) return nested;
    }
  }
  return null;
}

function extractRowsFromLog(log, catalog, spec) {
  const data = log?.data || {};

  // Most relevant logs use data.items[].
  // Auction house sold (4322) instead uses data.item[].
  // Cache use (2615) also has data.item, but there it is a scalar cache ID,
  // so only use data.item when it is actually an array.
  // Big Al's records a sale as data.item = { uid: quantity }, with no item id
  // anywhere. Every other log uses an array, so that shape is normalised here
  // and the item itself is identified later from its UID.
  const items = Array.isArray(data?.items)
    ? data.items
    : (Array.isArray(data?.item)
      ? data.item
      : (data?.item && typeof data.item === "object"
        ? Object.entries(data.item).map(([uid, qty]) => ({ uid, qty }))
        : []));

  return items.map((entry, entryIndex) => {
    // Number(null) is 0, which would pass for a real item id and then fail to
    // match anything in the catalog.
    const rawItemId = val(entry?.id, entry?.item_id, entry?.itemId);
    const itemId = rawItemId === null || rawItemId === undefined
      ? NaN
      : Number(rawItemId);
    const uidRaw = val(entry?.uid, entry?.unique_id, entry?.uniqueId);
    const uid = uidRaw !== null && Number(uidRaw) !== 0 ? String(uidRaw) : null;
    const catalogItem = Number.isFinite(itemId) ? catalog.get(itemId) : null;

    const statsObj = val(entry?.stats, entry?.item_details?.stats, entry?.itemDetails?.stats, {});
    const bonuses = val(entry?.bonuses, entry?.item_details?.bonuses, entry?.itemDetails?.bonuses, []);
    const bonusArray = Array.isArray(bonuses) ? bonuses : [];
    const b1 = bonusArray[0] || {};
    const b2 = bonusArray[1] || {};

    return {
      timestamp: val(log?.timestamp, log?.time, log?.created_at),
      rowKey: `${log?.id ?? log?.timestamp ?? "log"}:${entryIndex}:${uid ?? (Number.isFinite(itemId) ? itemId : "item")}`,
      itemId: Number.isFinite(itemId) ? itemId : null,
      uid,
      qty: val(entry?.qty, entry?.quantity, 1),
      price: val(
        data?.final_price,
        data?.cost_total,
        data?.total_price,
        data?.cost_each,
        data?.price_each,
        data?.unit_price
      ),
      sellerId: primitiveId(data?.seller, data?.owner),
      buyerId: primitiveId(data?.buyer, data?.winner),
      senderId: primitiveId(data?.sender, data?.sender_id, data?.user, data?.user_id),
      receiverId: primitiveId(data?.receiver, data?.receiver_id, data?.recipient, data?.recipient_id),
      factionId: primitiveId(data?.faction),
      seller: null,
      buyer: null,
      sender: null,
      receiver: null,
      faction: null,
      party: null,
      from: null,
      to: null,
      owner: null,
      ownerId: null,
      name: val(entry?.name, catalogItem?.name, ""),
      quality: val(statsObj?.quality, entry?.quality),
      armor: val(statsObj?.armor, statsObj?.armour, entry?.armor, entry?.armour),
      damage: val(statsObj?.damage, entry?.damage),
      accuracy: val(statsObj?.accuracy, entry?.accuracy),
      bonus1: val(b1?.title, b1?.name, entry?.bonus_1, entry?.bonus1),
      bonus1Value: val(b1?.value, entry?.bonus_1_value, entry?.bonus1_value),
      bonus2: val(b2?.title, b2?.name, entry?.bonus_2, entry?.bonus2),
      bonus2Value: val(b2?.value, entry?.bonus_2_value, entry?.bonus2_value),
      rarity: val(entry?.rarity, entry?.item_details?.rarity, entry?.itemDetails?.rarity),
      raw: log
    };
  });
}

function needsDetails(r) {
  return !!r.uid && [r.quality,r.armor,r.damage,r.accuracy,r.bonus1,r.bonus1Value,r.bonus2,r.bonus2Value]
    .some(v => v === null || v === undefined);
}
function normalizeDetailResponse(j) {
  const x = val(j?.itemdetails, j?.item_details, j?.items, j?.data, j);
  if (Array.isArray(x)) return x;
  if (x && typeof x === "object") {
    if ("uid" in x || "stats" in x || "bonuses" in x) return [x];
    return Object.values(x).filter(v => v && typeof v === "object");
  }
  return [];
}
// Recording the dead ones matters: a mixed batch drops them silently, so
// without this they would be requested again on every single load.
function markUidUnresolvable(uid, reason) {
  activeRaw().itemDetails[String(uid)] = { uid: String(uid), unresolved: true };
  state.itemDetailsDebug.push({
    requestedUids: [String(uid)],
    raw: null,
    normalized: [],
    status: "invalid_uid",
    error: reason
  });
}

async function getDetailsForUids(uids, key) {
  const map = new Map();
  const uniq = [...new Set(uids.filter(Boolean).map(String))];

  // Weapon stats never change, so a UID resolved once is resolved forever - and
  // one the API will not resolve is not worth asking about again either.
  const missing = [];
  for (const uid of uniq) {
    const saved = activeRaw().itemDetails[uid];
    if (saved?.unresolved) continue;
    if (saved) map.set(uid, saved);
    else missing.push(uid);
  }
  if (state.offline || !missing.length) return map;

  async function fetchChunk(chunk) {
    if (!chunk.length) return;

    const ids = chunk.map(encodeURIComponent).join(",");

    try {
      const j = await apiFetch(`/torn/${ids}/itemdetails`, key);
      const arr = normalizeDetailResponse(j);

      state.itemDetailsDebug.push({
        requestedUids: chunk.slice(),
        raw: j,
        normalized: arr,
        status: "ok"
      });

      for (const d of arr) {
        const uid = String(val(d?.uid, d?.item_details?.uid, d?.itemDetails?.uid, ""));
        if (uid) {
          map.set(uid, d);
          activeRaw().itemDetails[uid] = d;
        }
      }

      // Compatibility with the current single-object response for one UID.
      if (chunk.length === 1 && arr.length === 1 && !map.has(chunk[0])) {
        map.set(chunk[0], arr[0]);
        activeRaw().itemDetails[chunk[0]] = arr[0];
      }

      // A batch holding one bad UID does not fail - it comes back without it.
      for (const uid of chunk) {
        if (!map.has(uid)) {
          console.warn(`[Torn itemdetails] UID ${uid} was not returned`, { uid });
          markUidUnresolvable(uid, "not returned by the API");
        }
      }

      return;

    } catch (err) {
      const message = String(err?.message || err);

      // Only a batch with nothing valid left in it errors outright; a mixed one
      // simply comes back short. So a whole chunk failing means every UID in it
      // is dead - splitting it down to singles would cost about two requests
      // per dead UID to learn what the one failure already said. One of them is
      // probed on its own to make sure the failure really is the data and not a
      // passing fault, and if that probe comes back the old split runs instead.
      // These failures are the method working, so they do not count against the
      // runaway-failure budget.
      if (message.toLowerCase().includes("incorrect id")) {
        getKeyRequestState(key).consecutiveApiErrors = 0;

        if (chunk.length > 1) {
          const probe = chunk[0];
          const probeMap = await getDetailsForUids([probe], key);
          for (const [uid, detail] of probeMap) map.set(uid, detail);

          if (!probeMap.has(probe)) {
            console.warn(
              `[Torn itemdetails] ${chunk.length} UIDs in one batch are all unresolvable`,
              { uids: chunk.slice(), error: message }
            );
            for (const uid of chunk) markUidUnresolvable(uid, message);
            getKeyRequestState(key).consecutiveApiErrors = 0;
            return;
          }

          // The probe resolved, so the batch was not all dead after all.
          const rest = chunk.slice(1);
          const mid = Math.ceil(rest.length / 2);
          await fetchChunk(rest.slice(0, mid));
          await fetchChunk(rest.slice(mid));
          return;
        }

        const badUid = chunk[0];

        console.warn(
          `[Torn itemdetails] Skipping invalid/unresolvable UID ${badUid}`,
          { uid: badUid, error: message }
        );

        markUidUnresolvable(badUid, message);

        // The UID itself is bad data from a historical log. Once isolated,
        // don't let that single bad record abort the rest of the user's load.
        const requestState = getKeyRequestState(key);
        requestState.consecutiveApiErrors = 0;
        return;
      }

      throw err;
    }
  }

  for (let i = 0; i < missing.length; i += 25) {
    await fetchChunk(missing.slice(i, i + 25));
    await state.saveFacts?.();
  }

  return map;
}
function mergeDetails(row, d) {
  if (!d) return row;
  const detail = val(d?.item_details, d?.itemDetails, d);
  const stats = val(detail?.stats, d?.stats, {});
  const bonuses = val(detail?.bonuses, d?.bonuses, []);
  const b = Array.isArray(bonuses) ? bonuses : [];
  return {
    ...row,
    itemId: val(row.itemId, detail?.id, detail?.item_id, d?.item_id),
    name: val(row.name, detail?.name, d?.name),
    quality: val(row.quality, stats?.quality),
    armor: val(row.armor, stats?.armor, stats?.armour),
    damage: val(row.damage, stats?.damage),
    accuracy: val(row.accuracy, stats?.accuracy),
    bonus1: val(row.bonus1, b[0]?.title, b[0]?.name),
    bonus1Value: val(row.bonus1Value, b[0]?.value),
    bonus2: val(row.bonus2, b[1]?.title, b[1]?.name),
    bonus2Value: val(row.bonus2Value, b[1]?.value),
    rarity: val(row.rarity, detail?.rarity, d?.rarity)
  };
}
function isEquipmentRow(row, catalog) {
  return row.itemId !== null && catalog.has(Number(row.itemId));
}

async function finalizeRowFlow(rows, spec, owner, key) {
  const factionIds = [...new Set(rows.map(r => r.factionId).filter(Boolean).map(String))];
  await Promise.all(factionIds.map(id => getFactionName(id, key)));

  for (const row of rows) {
    row.faction = row.factionId ? state.factionNameCache.get(String(row.factionId)) || null : null;
    const ownerName = owner.name;

    // partyId is the counterparty as a player id, so it can be offered as an
    // owner. A faction is not a player, so it is deliberately left out.
    switch (spec.key) {
      case "caches":
        row.party = null;
        row.partyId = null;
        row.from = null;
        row.to = ownerName;
        break;
      case "auctionWins":
      case "imBuys":
      case "bazaarBuys":
        row.party = row.seller;
        row.partyId = row.sellerId ?? null;
        row.from = row.seller;
        row.to = ownerName;
        break;
      case "auction":
      case "marketSells":
      case "bazaarSells":
        row.party = row.buyer;
        row.partyId = row.buyerId ?? null;
        row.from = ownerName;
        row.to = row.buyer;
        break;
      case "factionDeposit":
        row.party = row.faction;
        row.partyId = null;
        row.from = ownerName;
        row.to = row.faction;
        break;
      case "factionGiven":
        row.party = [row.sender, row.faction].filter(Boolean).join(" / ") || null;
        row.partyId = row.senderId ?? null;
        row.from = row.party;
        row.to = ownerName;
        break;
      case "itemsSent":
        row.party = row.receiver;
        row.partyId = row.receiverId ?? null;
        row.from = ownerName;
        row.to = row.receiver;
        break;
      case "itemsReceived":
        row.party = row.sender;
        row.partyId = row.senderId ?? null;
        row.from = row.sender;
        row.to = ownerName;
        break;
      case "bunkerSells":
        row.party = BUNKER_PARTY;
        row.partyId = null;
        row.from = ownerName;
        row.to = BUNKER_PARTY;
        break;
    }
  }
}

function summarizeLogShape(log) {
  return {
    logId: log?.details?.id ?? null,
    title: log?.details?.title ?? null,
    timestamp: log?.timestamp ?? null,
    dataKeys: log?.data && typeof log.data === "object" ? Object.keys(log.data) : [],
    paramsKeys: log?.params && typeof log.params === "object" ? Object.keys(log.params) : [],
    dataItemsIsArray: Array.isArray(log?.data?.items),
    dataItemIsArray: Array.isArray(log?.data?.item),
    data: log?.data ?? null
  };
}
function esc(v) {
  if (v === null || v === undefined || v === "") return "—";
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function escInput(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
// Ways a weapon can arrive. An acquisition after a disposal, inside one
// holding, is the sign of a weapon bought back - which is a question for a
// person, not something to assume.
const ACQUISITION_SOURCES = new Set([
  "imBuys", "bazaarBuys", "tradeBuys", "auctionWins", "caches",
  "itemsReceived", "factionGiven"
]);

// Where one holding ends and the next begins.
//
// Walk a weapon's transactions in order. A holding runs from wherever the last
// one left off to the transaction a person named as its ending - and if nobody
// named one, to the end of the list. That is the default and it yields exactly
// one holding per weapon, which is the shape the table has always had.
// Decisions made when they were recorded against a weapon rather than against
// a stretch of its life. A return becomes the transaction that ended the
// holding; a loan someone confirmed becomes a holding they looked at and left
// running; an owner moves onto the holding that was open at the time. With one
// holding per weapon - which is what everyone had - each lands on the only
// holding there was.
function migrateUidDecisions() {
  if (localStorage.getItem("tornHoldingOutcome") !== null) return;

  const returned = readStoredArray("tornReturnedRows");
  const loans = readStoredArray("tornLoanSettled");
  const owners = JSON.parse(localStorage.getItem("tornUidOwners") || "{}");

  if (!returned.length && !loans.length && !Object.keys(owners).length) return;

  // Built before any decision exists, so every weapon is a single holding.
  const firstKeyByUid = new Map();
  const holdingOfRow = new Map();
  for (const holding of buildUniqueItemsRows()) {
    firstKeyByUid.set(String(holding.uid), holding.holdingKey);
    for (const entry of holding.logs || []) holdingOfRow.set(entry.rowKey, holding.holdingKey);
  }

  // A loan confirmed is a holding considered and still running; a return is an
  // actual ending, so it wins where a weapon carried both.
  for (const rowKey of loans) {
    const key = holdingOfRow.get(rowKey);
    if (key) state.holdingOutcome.set(key, "open");
  }
  for (const rowKey of returned) {
    const key = holdingOfRow.get(rowKey);
    if (key) state.holdingOutcome.set(key, rowKey);
  }
  for (const [uid, owner] of Object.entries(owners)) {
    const key = firstKeyByUid.get(String(uid));
    if (key && owner?.id) state.holdingOwners.set(key, owner);
  }

  saveHoldingOutcomes();
  saveHoldingOwners();
  for (const old of ["tornReturnedRows", "tornLoanSettled", "tornUidOwners"]) {
    localStorage.removeItem(old);
  }
  console.log(`[Torn] moved ${state.holdingOutcome.size} holding decisions and ` +
    `${state.holdingOwners.size} owners off their weapons`);
}

function splitIntoHoldings(item) {
  const out = [];
  const logs = item.logs;
  let start = 0;

  while (start < logs.length) {
    const holdingKey = logs[start].rowKey;
    const decision = state.holdingOutcome.get(holdingKey);

    let end = logs.length - 1;
    if (decision && decision !== "open") {
      const named = logs.findIndex((l, i) => i >= start && l.rowKey === decision);
      if (named >= 0) end = named;
    }

    out.push({
      ...item,
      holdingKey,
      decision: decision ?? null,
      logs: logs.slice(start, end + 1),
      // Kept so a row can say whether it is the whole story or one chapter.
      holdingIndex: out.length,
      uid: item.uid
    });
    start = end + 1;
  }

  // A weapon with no transactions at all cannot happen, but an empty list
  // would silently drop it rather than showing an empty row.
  return out.length ? out : [{ ...item, holdingKey: String(item.uid),
    decision: null, holdingIndex: 0 }];
}

// A holding nobody has finished thinking about.
//
// Three questions can be outstanding: an outgoing transaction that is neither
// priced nor declared, an arrival whose owner is only presumed, and a weapon
// bought back inside a holding that ought to be two.
function holdingIsUnresolved(item) {
  const logs = item.externalLogs || item.logs || [];

  if (!item.decision && logs.some(l =>
      OUTGOING_SOURCES.has(l.sourceKey) && !hasPrice(l.price))) return true;

  const first = logs[0];
  if (first && ACQUISITION_SOURCES.has(first.sourceKey) && !hasPrice(first.price) &&
      !ownerIsStated(item.holdingKey)) return true;

  let disposed = false;
  for (const entry of logs) {
    if (OUTGOING_SOURCES.has(entry.sourceKey) && hasPrice(entry.price)) disposed = true;
    else if (disposed && ACQUISITION_SOURCES.has(entry.sourceKey) && hasPrice(entry.price)) return true;
  }

  return false;
}

function buildUniqueItemsRows() {
  const byUid = new Map();

  for (const spec of LOGS) {
    for (const row of state.rows[spec.key] || []) {
      if (!row.uid) continue;

      const key = String(row.uid);
      let item = byUid.get(key);
      if (!item) {
        item = {
          uid: key,
          name: row.name,
          itemId: null,
          rarity: null,
          keyHolderIds: new Set(),
          owners: new Set(),
          quality: row.quality,
          armor: row.armor,
          damage: row.damage,
          accuracy: row.accuracy,
          bonus1: row.bonus1,
          bonus1Value: row.bonus1Value,
          bonus2: row.bonus2,
          bonus2Value: row.bonus2Value,
          logs: []
        };
        byUid.set(key, item);
      }

      if (item.itemId === null && row.itemId !== null && row.itemId !== undefined) {
        item.itemId = row.itemId;
      }
      if (item.rarity === null && row.rarity) item.rarity = row.rarity;

      const holder = keyHolderOf(row);
      if (holder.id) item.keyHolderIds.add(holder.id);
      item.owners.add(row.owner);

      item.logs.push({
        type: spec.thLabel || spec.label,
        sourceKey: spec.key,
        // Kept so the history table can edit the price straight through to the
        // row it came from.
        rowKey: row.rowKey,
        ownerId: row.ownerId ?? null,
        bunkerBucks: row.bunkerBucks ?? null,
        cacheEstimated: row.cacheEstimated ?? false,
        bunkerEstimated: row.bunkerEstimated ?? false,
        bunkerPartial: row.bunkerPartial ?? null,
        tradeId: row.tradeId ?? null,
        hasReceipt: !!row.receipt,
        editable: rowAcceptsManualPrice(spec.key, row),
        timestamp: row.timestamp,
        price: row.price,
        from: row.from,
        to: row.to,
        // A faction is a destination like any other, so the return check can
        // compare it against a faction owner.
        fromId: row.senderId ?? row.sellerId ??
          (spec.key === "factionGiven" && row.factionId ? factionOwnerId(row.factionId) : null),
        toId: row.receiverId ?? row.buyerId ??
          (spec.key === "factionDeposit" && row.factionId ? factionOwnerId(row.factionId) : null),
        owner: row.owner
      });
    }
  }

  // One weapon, one row - until somebody says a transaction ended a stretch of
  // its life, and the transactions after it become a second row with its own
  // acquisition, owner and profit.
  const holdings = [];
  for (const item of byUid.values()) {
    item.logs.sort((a,b) => Number(a.timestamp || 0) - Number(b.timestamp || 0));
    for (const slice of splitIntoHoldings(item)) holdings.push(slice);
  }

  buildOwnerIndex(holdings);

  for (const item of holdings) {
    item.externalLogs = item.logs.filter(l => !isInternalTransfer(l));
    item.firstLogTimestamp = item.logs[0]?.timestamp ?? 0;
    // With several keys loaded a weapon can carry rows from more than one of
    // them. Naming whoever acquired it reads better than listing them all.
    const acquired = item.externalLogs[0] || item.logs[0] || null;
    item.keyHolderName = acquired?.owner || [...item.owners].filter(Boolean)
      .sort((a,b) => String(a).localeCompare(String(b))).join(", ");
    item.acquiredById = acquired?.ownerId ?? null;

    const chosen = ownerOf(item.holdingKey);
    item.owner = chosen?.name || item.keyHolderName;
    item.ownerId = chosen?.id || item.acquiredById || [...item.keyHolderIds][0] || null;

    // One transaction is an acquisition, not a round trip: comparing it with
    // itself would report a profit of exactly zero for everything still held.
    // Handing a weapon to the other account is neither a cost nor a sale.
    const external = item.externalLogs;
    const first = external[0];
    const last = external.length > 1 ? external[external.length - 1] : null;
    const firstPrice = first?.price;
    const lastPrice = last?.price;
    item.profit =
      firstPrice !== null && firstPrice !== undefined && firstPrice !== "" &&
      lastPrice !== null && lastPrice !== undefined && lastPrice !== ""
        ? Number(lastPrice) - Number(firstPrice)
        : null;
  }

  for (const item of holdings) {
    item.ownedByKeyHolder = !item.ownerId || isKeyHolder(item.ownerId);
    item.logState = itemLogState(item);
    item.state = item.logState;
    item.stateLabel = ITEM_STATES[item.state]?.label || item.state;
    item.unresolved = holdingIsUnresolved(item);
  }

  // Which states are shown is the state filter's job now.
  return holdings.sort((a,b) =>
    Number(a.firstLogTimestamp || 0) - Number(b.firstLogTimestamp || 0) ||
    String(a.name || "").localeCompare(String(b.name || ""), undefined, {numeric:true, sensitivity:"base"}) ||
    String(a.uid).localeCompare(String(b.uid), undefined, {numeric:true})
  );
}

// The table carries two transactions and no more: how a weapon came in, and
// the movement that still stands - a sale, a loan still out, a return to
// whoever owns it. A loan that came back leaves the second slot empty, because
// nothing about it is outstanding. Everything else is a click away on the
// item's name, which keeps the table a fixed width whatever a weapon has been
// through.
function visibleItemLogs(item) {
  const logs = item.logs || [];
  if (!logs.length) return logs;
  const outcome = outcomeLogEntry(item);
  return outcome ? [logs[0], outcome] : [logs[0]];
}

// Every way a weapon leaves us. A return closes one of these, which is why a
// return is recorded against the transaction it closes rather than against the
// weapon: a weapon can go out more than once, and "this one came back" has to
// say which one.
const OUTGOING_SOURCES = new Set([
  "itemsSent", "tradeSells", "marketSells", "bazaarSells",
  "auction", "bunkerSells", "factionDeposit"
]);


function saveHoldingOutcomes() {
  localStorage.setItem("tornHoldingOutcome",
    JSON.stringify(Object.fromEntries(state.holdingOutcome)));
}

function saveHoldingOwners() {
  localStorage.setItem("tornHoldingOwners",
    JSON.stringify(Object.fromEntries(state.holdingOwners)));
}

// The one decision there is about a holding: which transaction ended it, that
// nothing has yet ("open"), or nothing said at all (null).
function setHoldingOutcome(holdingKey, value) {
  if (value === null || value === undefined) state.holdingOutcome.delete(String(holdingKey));
  else state.holdingOutcome.set(String(holdingKey), String(value));
  saveHoldingOutcomes();
  invalidateOwnerDefaults();
}

function setHoldingOwner(holdingKey, id, name) {
  const key = String(holdingKey);
  if (!id || !name) state.holdingOwners.delete(key);
  else state.holdingOwners.set(key, { id: String(id), name: String(name) });
  saveHoldingOwners();
  invalidateOwnerDefaults();
}



// The key holder is a fact; the owner shown in the tables is that fact unless a
// person has overridden it for this UID.
// Every loaded key belongs to one set of holdings. Weapons move between those
// accounts without being bought or sold, one of them can buy what another
// sells, and a loan between them is not a loan at all. With a single key loaded
// none of this applies, because nobody can transfer to themselves.
// Any account that produced rows is one of the holdings, whether or not its key
// has been pressed this session - otherwise a table restored from cache would
// read as belonging to nobody.
function keyHolderIdSet() {
  if (!state.keyHolderIds) {
    const ids = new Set([...state.loadedOwners.keys()].map(String));
    for (const spec of LOGS) {
      for (const row of state.rows[spec.key] || []) {
        if (row.ownerId !== null && row.ownerId !== undefined) ids.add(String(row.ownerId));
      }
    }
    state.keyHolderIds = ids;
  }
  return state.keyHolderIds;
}
function isKeyHolder(id) {
  return id !== null && id !== undefined && keyHolderIdSet().has(String(id));
}

// Which side of a transaction the other party sits on, for the direct
// transfers. Market, bazaar and auction trades are left alone: real money
// changes hands there whoever is on the other end.
const TRANSFER_COUNTERPARTY = {
  itemsSent: "toId",
  tradeSells: "toId",
  itemsReceived: "fromId",
  tradeBuys: "fromId"
};

function isInternalTransfer(entry) {
  const field = TRANSFER_COUNTERPARTY[entry?.sourceKey];
  return !!field && isKeyHolder(entry?.[field]);
}

function keyHolderOf(row) {
  return {
    id: row?.ownerId === null || row?.ownerId === undefined ? "" : String(row.ownerId),
    name: row?.owner ?? ""
  };
}
// Faction owner ids are prefixed so they can never collide with a player id,
// which matters because the state rules compare owners against key holders and
// the free-entry field only accepts numeric player ids.
const FACTION_OWNER_PREFIX = "faction:";

function factionOwnerId(factionId) {
  return `${FACTION_OWNER_PREFIX}${factionId}`;
}
function isFactionOwnerId(id) {
  return String(id ?? "").startsWith(FACTION_OWNER_PREFIX);
}

function holdingOwnerOverride(holdingKey) {
  if (holdingKey === null || holdingKey === undefined || holdingKey === "") return null;
  return state.holdingOwners.get(String(holdingKey)) || null;
}
// If the earliest thing we know about a weapon is that somebody sent it to us,
// they are its owner until told otherwise. An explicit choice always wins.
function holdingReceivedOwnerDefaults(holdings) {
  const defaults = new Map();

  for (const holding of holdings) {
    const first = holding.logs?.[0];
    if (!first || first.sourceKey !== "itemsReceived") continue;
    // A weapon arriving from the other shared account was always ours.
    if (!first.fromId || isKeyHolder(first.fromId)) continue;
    defaults.set(holding.holdingKey, {
      id: String(first.fromId),
      name: first.from || String(first.fromId)
    });
  }

  return defaults;
}

// Whoever acquired a weapon, from the rows alone: the earliest transaction
// with an outsider, or failing that the earliest of any kind. Handing a weapon
// between the shared accounts says nothing about whose it is, so those moves
// are passed over.
function holdingAcquiredOwners(holdings) {
  const out = new Map();

  for (const holding of holdings) {
    const logs = holding.logs || [];
    const first = logs.find(l => !isInternalTransfer(l)) || logs[0];
    if (!first) continue;
    out.set(holding.holdingKey, {
      id: first.ownerId === null || first.ownerId === undefined ? null : String(first.ownerId),
      name: first.owner ?? null
    });
  }

  return out;
}

// One owner per weapon, settled once per render and read everywhere.
//
// It carries where the answer came from as well as the answer: a weapon
// received from somebody is presumed theirs, but a presumption is not a
// decision, and the Settle queue has to be able to tell the two apart.
// Built from the holdings themselves, so it has to be handed them rather than
// going and asking for them: buildHoldingRows is what calls this.
function buildOwnerIndex(holdings) {
  const defaults = holdingReceivedOwnerDefaults(holdings);
  const acquired = holdingAcquiredOwners(holdings);
  const index = new Map();

  const keys = new Set([
    ...state.holdingOwners.keys(), ...defaults.keys(), ...acquired.keys()
  ].map(String));

  for (const key of keys) {
    const override = holdingOwnerOverride(key);
    if (override?.id) {
      index.set(key, { id: String(override.id), name: override.name, source: "override" });
      continue;
    }
    const fallback = defaults.get(key);
    if (fallback?.id) {
      index.set(key, { id: String(fallback.id), name: fallback.name, source: "default" });
      continue;
    }
    const first = acquired.get(key);
    if (first?.id) {
      index.set(key, { id: first.id, name: first.name, source: "acquired" });
    }
  }

  state.ownerIndex = index;
  return index;
}

function ownerIndex() {
  return state.ownerIndex || new Map();
}

function ownerOf(uid) {
  if (uid === null || uid === undefined || uid === "") return null;
  return ownerIndex().get(String(uid)) || null;
}

// A person said so, as opposed to the viewer having presumed it.
function ownerIsStated(uid) {
  return ownerOf(uid)?.source === "override";
}

function invalidateOwnerDefaults() {
  state.ownerIndex = null;
  state.keyHolderIds = null;
}

function effectiveOwner(row) {
  return ownerOf(row?.uid) || keyHolderOf(row);
}
function effectiveOwnerName(row) {
  return effectiveOwner(row).name || "";
}



// Candidate owners for a UID: whoever holds the key, plus the other side of
// each transaction the weapon appears in.
// Who could have held it for this stretch: whoever's key the transactions came
// from, and whoever was on the other side of one of them.
function ownerCandidatesForHolding(holding) {
  const byId = new Map();
  const keys = new Set((holding?.logs || []).map(l => l.rowKey));

  for (const spec of LOGS) {
    for (const row of state.rows[spec.key] || []) {
      if (!keys.has(row.rowKey)) continue;
      const holder = keyHolderOf(row);
      if (holder.id) byId.set(holder.id, { id: holder.id, name: holder.name, isKeyHolder: true });
      if (row.partyId && row.party && !byId.has(String(row.partyId))) {
        byId.set(String(row.partyId), { id: String(row.partyId), name: row.party, isKeyHolder: false });
      }
      // A weapon that went into the faction armoury can be owned by the faction.
      if (row.factionId && row.faction) {
        const id = factionOwnerId(row.factionId);
        if (!byId.has(id)) {
          byId.set(id, { id, name: row.faction, isKeyHolder: false, isFaction: true });
        }
      }
    }
  }

  for (const extra of [holdingOwnerOverride(holding?.holdingKey), ownerOf(holding?.holdingKey)]) {
    if (extra?.id && !byId.has(String(extra.id))) {
      byId.set(String(extra.id), { id: String(extra.id), name: extra.name, isKeyHolder: false });
    }
  }
  return [...byId.values()];
}

function findHolding(holdingKey) {
  return buildUniqueItemsRows().find(h => String(h.holdingKey) === String(holdingKey)) || null;
}

async function setHoldingOwnerFromId(holdingKey, rawId) {
  const id = String(rawId ?? "").trim();
  if (!/^\d+$/.test(id)) {
    status("Enter a numeric player ID.", true);
    return false;
  }

  const key = (readSavedKeys() || [])[0];
  if (!key) {
    status("An API key is needed to look up a player ID.", true);
    return false;
  }

  status(`Looking up player ${id}...`);
  try {
    const name = await getUserName(id, key);
    if (!name) {
      status(`No player found for ID ${id}.`, true);
      return false;
    }
    setHoldingOwner(holdingKey, id, name);
    status(`Owner set to ${name}.`);
    return true;
  } catch (err) {
    status(`Could not look up player ${id}: ${err?.message || err}`, true);
    return false;
  }
}

// ---------------------------------------------------------------------------
// Weapon state. Derived from the last event on the UID plus who owns it, and
// surfaced only as a row colour for now.
// ---------------------------------------------------------------------------
const SALE_SOURCES = new Set([
  "auction", "marketSells", "bazaarSells", "tradeSells", "bunkerSells"
]);

// Ways a weapon can go back to whoever lent it: handed over, traded back, or -
// when a faction owns it - put into its armoury.
const RETURN_SOURCES = new Set(["itemsSent", "tradeSells", "factionDeposit"]);

const ITEM_STATES = {
  loanedToUs:      { label: "Loaning",             cls: "state-loaned-in" },
  returned:        { label: "Past Loans",          cls: "state-returned" },
  listed:          { label: "Item Market",         cls: "state-listed" },
  sold:            { label: "Sold",                cls: "state-sold" },
  loanedToFaction: { label: "Loaned out (faction)", cls: "state-faction" },
  loanedOut:       { label: "Loaned out",          cls: "state-loaned-out" },
  inventory:       { label: "Inventory",           cls: "state-inventory" }
};

// Closed loans are history rather than holdings, so they start out unselected.
// A new storage key, because the previous default selected everything and
// relied on a separate "hide past loans" box that no longer exists.
const STATE_FILTER_STORAGE_KEY = "tornStateFilterV2";
const DEFAULT_UNSELECTED_STATES = new Set(["returned"]);

function activeStateFilter() {
  if (!state.stateFilter) {
    const saved = readStoredArray(STATE_FILTER_STORAGE_KEY).filter(k => k in ITEM_STATES);
    state.stateFilter = new Set(saved.length
      ? saved
      : Object.keys(ITEM_STATES).filter(k => !DEFAULT_UNSELECTED_STATES.has(k)));
  }
  return state.stateFilter;
}
function saveStateFilter() {
  localStorage.setItem(STATE_FILTER_STORAGE_KEY, JSON.stringify([...activeStateFilter()]));
}

// "first" is the earliest event. "outcome" is the movement that still stands:
// where the weapon went, if it has gone anywhere that has not been undone.
//
// A loan that came back is not an outcome - the weapon is simply here again -
// so a receive closing one of our own sends leaves the slot empty. A loan
// still out is an outcome, and so is a sale. Somebody else's weapon shows the
// return that gave it back to them, if there was one.
function semanticLogEntry(row, which) {
  const logs = row?.logs || [];
  if (which === "first") return logs[0] || null;
  return outcomeLogEntry(row);
}

function outcomeLogEntry(item) {
  const logs = item?.externalLogs || item?.logs || [];

  // A person has said how this one ends - or said that it has not.
  if (item?.decision === "open") return null;
  if (item?.decision) {
    return logs.find(l => l.rowKey === item.decision) || null;
  }

  const last = logs[logs.length - 1];
  if (!last || logs.length < 2) return null;

  // Not ours: what matters is whether it went back to whoever owns it.
  if (item?.ownedByKeyHolder === false) {
    const owner = String(item?.ownerId ?? "");
    const returned = [...logs].reverse().find(entry =>
      RETURN_SOURCES.has(entry?.sourceKey) && String(entry?.toId ?? "") === owner);
    return returned || null;
  }

  // Ours, and the last thing that happened was it coming back: the loan behind
  // it is closed, so there is nothing outstanding to show.
  if (!OUTGOING_SOURCES.has(last.sourceKey)) return null;

  return last;
}

const LOG_TYPE_SLOTS = {
  firstLog: { which: "first", label: "First" },
  outcome: { which: "outcome", label: "Outcome" }
};

// A weapon with a single transaction has no last one; that absence is itself
// something worth filtering for.
const NO_ENTRY_KEY = "__none__";

// Stored as the set that is switched OFF, not the set that is on. That way
// "all" always means everything, and a log type that appears later - or one we
// add to the tool - arrives already ticked instead of silently filtered out.
function logTypeOptions(slot) {
  const keys = LOGS.map(x => x.key);
  return slot === "outcome" ? [...keys, NO_ENTRY_KEY] : keys;
}
function logTypeOptionLabel(key) {
  if (key === NO_ENTRY_KEY) return "(none)";
  const spec = LOGS.find(x => x.key === key);
  return spec ? (spec.thLabel || spec.label) : key;
}

function excludedLogTypes(slot) {
  if (!state.logTypeFilters[slot]) {
    const valid = new Set(logTypeOptions(slot));
    state.logTypeFilters[slot] = new Set(
      readStoredArray(`tornLogTypeExcluded_${slot}`).filter(k => valid.has(k))
    );
  }
  return state.logTypeFilters[slot];
}
function saveLogTypeFilter(slot) {
  localStorage.setItem(
    `tornLogTypeExcluded_${slot}`,
    JSON.stringify([...excludedLogTypes(slot)])
  );
}

function logTypeKeyOf(row, slot) {
  const entry = semanticLogEntry(row, LOG_TYPE_SLOTS[slot].which);
  return entry ? entry.sourceKey : NO_ENTRY_KEY;
}

// Counts come from the rows that pass every other filter, so a number tells you
// what ticking that type would actually bring back.
function logTypeCounts(slot, facetRows) {
  const counts = new Map();
  for (const row of facetRows) {
    const key = logTypeKeyOf(row, slot);
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  return counts;
}

function logTypeFilterHtml(slot, facetRows) {
  const excluded = excludedLogTypes(slot);
  const counts = logTypeCounts(slot, facetRows);

  // Only types something actually lands on are worth offering. Counts ignore
  // this picker's own exclusions, so unticking a type never makes it vanish -
  // a type only drops off the list when nothing in the data has it.
  const options = logTypeOptions(slot).filter(key => (counts.get(key) || 0) > 0);
  const onCount = options.filter(key => !excluded.has(key)).length;

  const label = excluded.size === 0
    ? "All"
    : (onCount === 0 ? "None" : `${onCount}/${options.length}`);

  return `<details class="state-filter log-type-filter" id="logTypeFilter-${slot}" ` +
    `${state.logTypeFilterOpen[slot] ? "open" : ""}>
      <summary>${esc(label)}</summary>
      <div class="state-filter-panel log-type-panel">
        ${options.map(key => {
          const n = counts.get(key) || 0;
          return `<label class="state-option">
            <input type="checkbox" data-log-type="${slot}" data-log-key="${escInput(key)}"
              ${excluded.has(key) ? "" : "checked"}>
            <span class="log-type-name">${esc(logTypeOptionLabel(key))}</span>
            <span class="log-type-count">${n}</span>
          </label>`;
        }).join("")}
        <div class="state-filter-actions">
          <button type="button" data-log-pick="${slot}:all">All</button>
          <button type="button" data-log-pick="${slot}:none">None</button>
        </div>
      </div>
    </details>`;
}

function bindLogTypeFilters(root) {
  Object.keys(LOG_TYPE_SLOTS).forEach(slot => {
    const details = root.querySelector(`#logTypeFilter-${slot}`);
    if (details) {
      details.addEventListener("toggle", () => {

      });
    }
  });

  root.querySelectorAll("[data-log-type]").forEach(box => {

      state.logTypeFilters[slot] = pick === "all"
